<div id="splash"><h1>La Fine<br>Crasse</h1><div style="font-size:17px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.25)">Deviens le roi de la collecte des déchets !</div><button id="play" style="font-size:22px;padding:14px 40px">▶ Jouer</button><button id="insp" onclick="showIns(1)" style="display:none;background:#fff;color:#2e7d32">📲 Installer sur le téléphone</button><div id="ver" style="font-size:12px;opacity:.85"></div></div>

<script>
// ===================== La Fine Crasse — tycoon de collecte des déchets =====================
const $=id=>document.getElementById(id),rd=(a,b)=>a+Math.random()*(b-a),pk=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>{n=Math.floor(n);if(n<1e6)return n.toLocaleString('fr-FR');const u=['M','Md','B'];let i=-1;while(n>=1e6&&i<2){n/=1000;i++}return (n/1000).toFixed(2).replace('.',',')+' '+u[i]};
// ---------- état et sauvegarde ----------
let st={money:50,trucks:1,cap:0,spd:0,val:0,pop:0,garage:0,sort:0,fact:0,zones:[0],total:0,ips:0,t:0,day:'',streak:0,tip:0,gfx:'auto',mute:false};
try{const s=localStorage.getItem('lfc_tycoon');if(s)st=Object.assign(st,JSON.parse(s))}catch(e){}
const save=()=>{st.t=Date.now();try{localStorage.setItem('lfc_tycoon',JSON.stringify(st))}catch(e){}};
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,Math.max(1600,t.length*55))};
let AC;const snd=(f,d=.08,ty='triangle',v=.05,dl=0)=>{if(st.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+dl;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d)}catch(e){}};
const jingle=()=>[523,659,784,1047].forEach((f,i)=>snd(f,.15,'triangle',.06,i*.08));
// ---------- règles économiques ----------
const ZONES=[{n:'Campagne',e:'🌾',p:0,m:1,g:'#7cbf58',b:'sub',d:['nat/tree_oak','nat/tree_default'],dx:-1,dz:0},{n:'Résidentiel',e:'🏘️',p:600,m:1.6,g:'#6fb24f',b:'sub',d:['sub/tree-large','sub/tree-small'],dx:-1,dz:-1},
 {n:'Plage',e:'🏖️',p:3000,m:2.4,g:'#e6d39c',b:'sub',d:['nat/tree_palm','nat/tree_palmTall','nat/tree_palmBend'],dx:0,dz:-1},{n:'Forêt',e:'🌲',p:10000,m:3.4,g:'#4f8f3a',b:'sub',d:['nat/tree_pineTallA_detailed','nat/tree_pineTallC_detailed','nat/tree_pineRoundA'],dx:1,dz:-1},
 {n:'Centre-ville',e:'🏬',p:32000,m:5,g:'#a3a8ad',b:'com',d:['sub/tree-small'],dx:1,dz:0},{n:'Montagne',e:'⛰️',p:90000,m:7,g:'#8fa07e',b:'sub',d:['nat/rock_tallA','nat/rock_tallB','nat/tree_pineTallD_detailed'],dx:1,dz:1},
 {n:'Zone industrielle',e:'🏭',p:240000,m:10,g:'#8d8d86',b:'ind',d:['car/truck-flat','car/delivery-flat'],dx:0,dz:1},{n:'Gratte-ciel',e:'🏙️',p:650000,m:15,g:'#aab0b6',b:'sky',d:['sub/tree-small'],dx:-1,dz:1}];
const cost=(b,g,l)=>Math.round(b*Math.pow(g,l)/5)*5;
const R={truck:()=>cost(150,2.35,st.trucks-1),maxT:()=>2+2*st.garage+(st.garage>=5?4:0),capN:()=>6+3*st.cap,spdN:()=>10*(1+.12*st.spd),valN:()=>(1+.2*st.val)*(1+.5*st.sort),rate:()=>.06*(1+.15*st.pop),factIps:()=>st.fact*st.fact*3};
const UP=[{k:'cap',i:'📦',n:'Benne plus grande',d:()=>'Chaque camion porte '+R.capN()+' sacs (+3)',b:100,g:1.7,max:25},{k:'spd',i:'⚡',n:'Moteurs plus rapides',d:()=>'+12 % de vitesse',b:120,g:1.8,max:15},
 {k:'val',i:'💎',n:'Tri sélectif',d:()=>'+20 % de valeur par sac',b:250,g:1.85,max:30},{k:'pop',i:'👪',n:'Campagne de pub',d:()=>'+15 % de poubelles produites',b:200,g:1.8,max:20}];
const BLD=[{k:'garage',i:'🅿️',n:'Garage',d:()=>'Places de camions : '+R.maxT(),b:800,g:4,max:5},{k:'sort',i:'♻️',n:'Centre de tri',d:()=>'Valeur des sacs ×'+(1+.5*st.sort).toFixed(1),b:2500,g:4.5,max:4},{k:'fact',i:'🏭',n:'Usine de recyclage',d:()=>'Revenu automatique : '+fmt(R.factIps())+' €/s',b:6000,g:3.2,max:10}];
// ---------- scène ----------
const Rd=new THREE.WebGLRenderer({antialias:true});Rd.shadowMap.enabled=true;Rd.shadowMap.type=THREE.PCFSoftShadowMap;Rd.outputEncoding=THREE.sRGBEncoding;document.body.prepend(Rd.domElement);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x9fd3f0);sc.fog=new THREE.Fog(0x9fd3f0,160,320);
const cam=new THREE.PerspectiveCamera(38,1,1,600);
sc.add(new THREE.HemisphereLight(0xdff2ff,0x5a7a40,.55));const dl=new THREE.DirectionalLight(0xfff2dc,1.05);dl.position.set(60,110,40);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);const sk=dl.shadow.camera;sk.left=sk.bottom=-90;sk.right=sk.top=90;sk.near=10;sk.far=300;dl.shadow.bias=-.0008;sc.add(dl,dl.target);
const MC={},M=c=>MC[c]||(MC[c]=new THREE.MeshStandardMaterial({color:c,roughness:.75}));
const box=(w,h,d,c,x=0,y=0,z=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m};
const cyl=(r1,r2,h,c,x,y,z,n=16)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,n),M(c));m.position.set(x,y,z);m.castShadow=true;return m};
function canvasTex(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
function label(txt,w,h,bg,fg,size){const t=canvasTex(512,Math.round(512*h/w),(x,W,H)=>{x.fillStyle=bg;x.fillRect(0,0,W,H);x.fillStyle=fg;let f=size||H*.6;x.font='bold '+f+'px sans-serif';const tw=x.measureText(txt).width;if(tw>W*.9){f*=W*.9/tw;x.font='bold '+f+'px sans-serif'}x.textAlign='center';x.textBaseline='middle';x.fillText(txt,W/2,H/2+2)});return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide}))}
// sol, mer autour, routes
const grassT=canvasTex(256,256,(x,W)=>{x.fillStyle='#6db24e';x.fillRect(0,0,W,W);for(let i=0;i<6000;i++){x.fillStyle=pk(['#5ea543','#79bd58','#68ad4a','#83c562']);x.fillRect(Math.random()*W,Math.random()*W,1.5,3)}});grassT.wrapS=grassT.wrapT=THREE.RepeatWrapping;grassT.repeat.set(60,60);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({map:grassT,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;sc.add(ground);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(600,200),new THREE.MeshStandardMaterial({color:0x2aa3d8,roughness:.15,metalness:.1}));sea.rotation.x=-Math.PI/2;sea.position.set(0,.02,-170);sc.add(sea);
const RL=[-60,-40,-20,0,20,40,60],RW=5;
const roadT=canvasTex(64,256,(x,W,H)=>{x.fillStyle='#3e4248';x.fillRect(0,0,W,H);for(let i=0;i<500;i++){x.fillStyle=pk(['#363a40','#474b51']);x.fillRect(Math.random()*W,Math.random()*H,2,2)}x.fillStyle='#f2f2f2';x.fillRect(30,20,4,90);x.fillStyle='#d8d8d8';x.fillRect(1,0,3,H);x.fillRect(W-4,0,3,H)});roadT.wrapT=THREE.RepeatWrapping;
for(const v of RL){for(const ax of[0,1]){const t=roadT.clone();t.needsUpdate=true;t.repeat.set(1,24);const m=new THREE.Mesh(new THREE.PlaneGeometry(RW,120),new THREE.MeshStandardMaterial({map:t,roughness:.9}));m.rotation.x=-Math.PI/2;if(ax)m.rotation.z=Math.PI/2;m.position.set(ax?0:v,.04,ax?v:0);m.receiveShadow=true;sc.add(m)}}
for(const x of RL)for(const z of RL){const c=new THREE.Mesh(new THREE.PlaneGeometry(RW,RW),M(0x3e4248));c.rotation.x=-Math.PI/2;c.position.set(x,.05,z);sc.add(c)}
// ---------- modèles Kenney (CC0) ----------
const GL=new THREE.GLTFLoader(),KEN={},KL=['car/garbage-truck','sub/tree-large','sub/tree-small','sub/fence-1x4',...'abcdefghijklmnopqrstu'.split('').map(c=>'sub/building-type-'+c),...'abcdefghijklmn'.split('').map(c=>'com/building-'+c),...'abcde'.split('').map(c=>'com/building-skyscraper-'+c),'car/truck-flat','car/delivery-flat','car/truck','car/delivery','car/box','car/cone',
 ...['tree_oak','tree_default','tree_palm','tree_palmTall','tree_palmBend','tree_pineTallA_detailed','tree_pineTallC_detailed','tree_pineTallD_detailed','tree_pineRoundA','rock_tallA','rock_tallB'].map(c=>'nat/'+c)];
let kLoaded=0;
function loadKenney(){return new Promise(ok=>{let n=0;for(const f of KL)GL.load('models/kenney/'+f+'.glb',g=>{g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;const nm=o.material.name||'';if(/^grass$/i.test(nm)){o.material=o.material.clone();o.material.color.set(0x4f8f34)}else if(/leaf/i.test(nm)&&!/Fall/.test(nm)){o.material=o.material.clone();o.material.color.set(pk([0x3f8f3a,0x4f9a36,0x2f7a34]))}}});KEN[f]=g.scene;if(++n===KL.length)ok()},undefined,()=>{if(++n===KL.length)ok()})})}
const kget=(f,s)=>{const m=KEN[f];if(!m)return null;const c=m.clone();c.scale.setScalar(s||1);return c};
// ---------- quartiers et maisons ----------
const HOUSES=[],ZG=[];
function buildZone(zi){const Z=ZONES[zi],cx=Z.dx*40,cz=Z.dz*40,G=new THREE.Group();ZG[zi]=G;sc.add(G);
 const gm=new THREE.Mesh(new THREE.PlaneGeometry(35,35),new THREE.MeshStandardMaterial({color:Z.g,roughness:1}));gm.rotation.x=-Math.PI/2;gm.position.set(cx,.02,cz);gm.receiveShadow=true;G.add(gm);G.userData.ground=gm;
 for(const bx of[cx-10,cx+10])for(const bz of[cz-10,cz+10]){const blk=new THREE.Mesh(new THREE.PlaneGeometry(14.6,14.6),new THREE.MeshStandardMaterial({color:new THREE.Color(Z.g).multiplyScalar(.92),roughness:1}));blk.rotation.x=-Math.PI/2;blk.position.set(bx,.03,bz);blk.receiveShadow=true;G.add(blk);
  for(const sx of[-1,1])for(const sz of[-1,1]){const hx=bx+sx*3.6,hz=bz+sz*3.6,fz=Math.sign(hz-bz);let b;
   if(Z.b==='com')b=kget('com/building-'+pk('abcdefghijklmn'.split('')),7.5);else if(Z.b==='sky')b=kget('com/building-skyscraper-'+pk('abcde'.split('')),5.2);else if(Z.b==='ind')b=industrial();else b=kget('sub/building-type-'+pk('abcdefghijklmnopqrstu'.split('')),5.6);
   if(b){b.position.set(hx,0,hz);b.rotation.y=fz>0?0:Math.PI;G.add(b)}

function events(dt){if(EV.t>0){EV.t-=dt;$('ev').style.display='block';$('ev').textContent=EV.n+' · '+Math.ceil(EV.t)+' s';if(EV.t<=0)$('ev').style.display='none'}else{evNext-=dt;if(evNext<=0){EV=pk([{k:'trash',n:'🎉 Fête de quartier : poubelles ×2'},{k:'val',n:'💎 Prix du recyclage ×2'},{k:'spd',n:'🛣️ Routes dégagées : camions +50 %'}]);EV.t=30;evNext=rd(80,140);toast(EV.n);jingle()}}}
// ---------- boucle ----------
let last=performance.now(),acc=0;
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;NOW=n/1000;
 const r=R.rate()*dt*(EV.t>0&&EV.k==='trash'?2:1);for(const h of HOUSES){if(!st.zones.includes(h.zi))continue;h.trash=Math.min(6,h.trash+r);const k=Math.floor(h.trash);for(let i=0;i<6;i++)h.bags[i].visible=i<k}
 for(const T of TRUCKS)truckTick(T,dt);
 st.money+=R.factIps()*dt;while(INC.length&&INC[0][0]<NOW-60)INC.shift();
 for(let i=FL.length-1;i>=0;i--){const f=FL[i];f.t+=dt;f.sp.position.y+=dt*2.5;f.sp.material.opacity=Math.max(0,1.6-f.t);if(f.t>1.6){sc.remove(f.sp);f.sp.material.map.dispose();f.sp.material.dispose();FL.splice(i,1)}}
 for(const s of SMK){s.visible=!!SMOKEPOS;if(SMOKEPOS){const p=(NOW*.15+s.userData.ph)%1;s.position.set(SMOKEPOS.x+p*3,SMOKEPOS.y+p*10,SMOKEPOS.z+p*2);s.scale.setScalar(2+p*6)}}
 sea.material.color.setHSL(.55,.7,.5+Math.sin(NOW)*.02);
 acc+=dt;if(acc>.25){acc=0;hud();tips();if($('shop').style.display==='flex'&&PANEL!=='set'){const sy=$('shop').querySelector('.box').scrollTop;render();$('shop').querySelector('.box').scrollTop=sy}}
 events(dt);if(((NOW/10)|0)!==loop.s){loop.s=(NOW/10)|0;save()}
 Rd.render(sc,cam)}
// ---------- démarrage ----------
resize();camUpd();setGfx();
$('play').onclick=()=>{$('splash').remove();snd(520,.08);if(!loop.on){loop.on=1}};
loadKenney().then(()=>{buildDepot();ZONES.forEach((_,i)=>buildZone(i));for(let i=0;i<st.trucks;i++)mkTruck(i);
 // gains pendant l'absence (moitié du revenu, 4 h max) et cadeau du jour
 const now=Date.now(),away=st.t?Math.min(14400,(now-st.t)/1000):0,off=away>60?Math.floor(away*st.ips*.5):0;let msg='';const d=new Date().toDateString();if(st.day!==d){const y=new Date(now-864e5).toDateString();st.streak=st.day===y?Math.min(7,st.streak+1):1;st.day=d;const g=Math.round(50*st.streak*(1+st.zones.length));st.money+=g;msg+='🎁 Cadeau du jour (jour '+st.streak+') : +'+fmt(g)+' €<br>'}
 if(off>0){st.money+=off;msg+='💤 Tes camions ont travaillé pendant ton absence : +'+fmt(off)+' €<br>'}save();hud();
 if(msg){const b=document.createElement('div');b.className='pop';b.innerHTML='<div>'+msg+'<br><button>Récupérer</button></div>';b.querySelector('button').onclick=()=>{b.remove();jingle()};document.body.appendChild(b)}
 requestAnimationFrame(loop)});
</script>

<div id="upd"><div><b>🎉 Nouvelle mise à jour disponible</b><small id="updn"></small></div><button onclick="location.reload()">Mettre à jour</button></div>
<div id="ins"><div><b>📲 Installer La Fine Crasse</b><small id="insm"></small></div><button id="insb" onclick="doIns()">Installer</button><button class="x" onclick="insLater()" aria-label="Plus tard">✕</button></div>
<script>
// Version du jeu : la seule à changer à chaque mise à jour, avec la même valeur dans version.json.
// Le service worker est enregistré avec cette version (sw.js?v=…), ce qui force son remplacement et vide l'ancien cache.
var APPV="2026-11-05.1";
var SWR=null,BIP=null;
var say=function(t){try{toast(t)}catch(x){}};
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js?v='+APPV).then(function(r){SWR=r}).catch(function(){})});
(function(){var v=document.getElementById("ver");if(v)v.textContent="Version "+APPV})();

function chkV(man){if(!window.fetch)return;if(SWR)SWR.update().catch(function(){});
 fetch("version.json?"+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){
  if(!j||!j.v||j.v===APPV){if(man)say("Le jeu est à jour ✓ (version "+APPV+")");return}if(man)document.getElementById("shop").style.display="none";
  document.getElementById("updn").textContent=j.notes||"";document.getElementById("ins").classList.remove("on");document.getElementById("upd").classList.add("on")}).catch(function(){if(man)say("Pas de connexion internet")})}
(function(){try{var o=localStorage.getItem("finecrasse-v");localStorage.setItem("finecrasse-v",APPV);if(o&&o!==APPV)setTimeout(function(){say("Jeu mis à jour ✓")},600)}catch(x){}})();
chkV();setInterval(chkV,30*60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)chkV()});

// Installation : bouton direct quand le navigateur le permet (Chrome Android), sinon explications.
function standalone(){try{return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true}catch(x){return false}}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
// Navigateurs intégrés (Messenger, WhatsApp, Facebook, Instagram…) : ils ne savent pas installer d'appli.
function inApp(){return /; wv\)|FBAN|FBAV|FB_IAB|Messenger|Instagram|WhatsApp|Snapchat|musical_ly|TikTok|Line\/|GSA\//.test(navigator.userAgent)}
function isAndroid(){return /Android/i.test(navigator.userAgent)}
function isChrome(){var u=navigator.userAgent;return !inApp()&& /Chrome\//.test(u)&&!/EdgA?\/|OPR\/|SamsungBrowser|HuaweiBrowser|HeyTapBrowser|MiuiBrowser|YaBrowser|Firefox|FxiOS|CriOS/.test(u)}
function showIns(force){if(standalone()||document.getElementById("upd").classList.contains("on"))return;
 if(!force){try{if(Date.now()-(+localStorage.getItem("finecrasse-ins")||0)<3*864e5)return}catch(x){}}
 var m=document.getElementById("insm"),b=document.getElementById("insb");
 if(BIP){m.textContent="Ajoute le jeu sur ton écran d’accueil, en un appui.";b.textContent="Installer";b.style.display=""}
 else if(isAndroid()){m.textContent=isChrome()?"Menu ⋮ → « Installer l’application ». Pas dans le menu ? Ouvre d’abord dans Chrome.":"Ce navigateur ne peut pas installer le jeu : ouvre-le dans Chrome.";b.textContent="Ouvrir dans Chrome";b.style.display=""}
 else if(inApp()){m.textContent="Tu es dans le navigateur d’une messagerie : ouvre le jeu dans Safari pour l’installer.";b.textContent="Copier le lien";b.style.display=""}
 else if(isIOS()){m.textContent="Dans Safari : touche Partager ⬆️ puis « Sur l’écran d’accueil ».";b.style.display="none"}
 else{m.textContent="Ce navigateur ne peut pas l’installer : copie le lien et ouvre-le dans Chrome.";b.textContent="Copier le lien";b.style.display=""}
 document.getElementById("ins").classList.add("on")}
function insLater(){try{localStorage.setItem("finecrasse-ins",Date.now())}catch(x){}document.getElementById("ins").classList.remove("on")}
function doIns(){if(BIP){var e=BIP;BIP=null;e.prompt();e.userChoice.then(function(c){if(c&&c.outcome==="accepted")document.getElementById("ins").classList.remove("on");else insLater()}).catch(function(){});return}
 var u=location.href.split("#")[0];
 if(isAndroid()){location.href="intent://"+u.replace(/^https?:\/\//,"")+"#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+encodeURIComponent(u)+";end";return}(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){say("Lien copié ✓ Colle-le dans Chrome")}).catch(function(){prompt("Copie ce lien et ouvre-le dans Chrome :",u)})}
// Pas de preventDefault : Chrome affiche aussi sa propre barre « Installer ».
addEventListener("beforeinstallprompt",function(e){BIP=e;if(document.getElementById("splash"))showIns()});
addEventListener("appinstalled",function(){BIP=null;document.getElementById("ins").classList.remove("on");say("Jeu installé ✓")});
// Bouton « Installer » sur l'écran d'accueil du jeu tant qu'il n'est pas installé.
(function(){var p=document.getElementById("insp");if(p&&!standalone())p.style.display=""})();
// Pendant la partie, le bandeau ne doit pas cacher les boutons du jeu.
document.getElementById("play").addEventListener("click",function(){document.getElementById("ins").classList.remove("on")});
setTimeout(function(){if(BIP||standalone()||!document.getElementById("splash"))return;showIns()},3500);
</script>
