<script>
// ===================== Dernier Rempart — tycoon de survie contre les zombies =====================
const $=id=>document.getElementById(id),rd=(a,b)=>a+Math.random()*(b-a),pk=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>{n=Math.floor(n);if(n<1e6)return n.toLocaleString('fr-FR');const u=['M','Md','B','T'];let i=-1;while(n>=1e6&&i<3){n/=1000;i++}return (n/1000).toFixed(2).replace('.',',')+' '+u[i]};
// ---------- sauvegarde ----------
let st={tt:['mg','mg','mg','mg','mg','mg','mg','mg'],pw:{},money:60,wave:1,best:1,wall:0,tur:[1,0,0,0,0,0,0,0],heroes:[],place:[null,null,null,null],gen:{},up:{},kills:0,earned:0,mis:0,medals:0,pres:0,t:0,day:'',streak:0,mute:false,speed:1,tip:0};
try{const s=localStorage.getItem('dr_save');if(s)st=Object.assign(st,JSON.parse(s))}catch(e){}
const save=()=>{st.t=Date.now();try{localStorage.setItem('dr_save',JSON.stringify(st))}catch(e){}};
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
const toast=t=>{const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,Math.max(1600,t.length*55))};
function banner(t,sub){const b=$('banner');b.innerHTML=t+(sub?'<small>'+sub+'</small>':'');b.style.opacity=1;b.style.transform='translate(-50%,-50%) scale(1)';clearTimeout(banner.t);banner.t=setTimeout(()=>{b.style.opacity=0;b.style.transform='translate(-50%,-50%) scale(.8)'},1800)}
// ---------- sons fabriqués (aucun fichier) ----------
let AC,NB;const ac=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC};
const snd=(f,d=.08,ty='triangle',v=.05,dl=0)=>{if(st.mute)return;try{const A=ac(),o=A.createOscillator(),g=A.createGain(),t0=A.currentTime+dl;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(A.destination);o.start(t0);o.stop(t0+d)}catch(e){}};
let lastShot=0;function shotSnd(big){if(st.mute)return;const n=performance.now();if(n-lastShot<45)return;lastShot=n;try{const A=ac();if(!NB){NB=A.createBuffer(1,A.sampleRate*.3,A.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,3)}const s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();s.buffer=NB;f.type='lowpass';f.frequency.value=big?900:2200;g.gain.value=big?.12:.05;s.connect(f);f.connect(g);g.connect(A.destination);s.start()}catch(e){}}
const groan=()=>snd(rd(70,110),.5,'sawtooth',.025);
const jingle=()=>[523,659,784,1047].forEach((f,i)=>snd(f,.15,'triangle',.06,i*.08));
// ---------- règles du jeu ----------
const HEROES=[{n:'Remy',f:'models/remy.glb',p:0,d:10,r:1.4,e:'🧑'},{n:'Lina',f:'models/perso/peasant_girl.glb',p:400,d:22,r:1.4,e:'👩'},{n:'Mia',f:'models/perso/ch46_nonpbr.glb',p:1800,d:45,r:1.6,e:'👧'},{n:'Elfie',f:'models/perso/ch34_nonpbr.glb',p:7000,d:95,r:1.6,e:'🧝'},{n:'The Boss',f:'models/perso/the_boss.glb',p:25000,d:210,r:1.3,e:'🕴️'},
 {n:'Erika l’archère',f:'models/perso/erika_archer.glb',p:90000,d:420,r:2,e:'🏹'},{n:'Maria',f:'models/perso/maria_j_j_ong.glb',p:320000,d:950,r:1.8,e:'🗡️'},{n:'Ely',f:'models/perso/ely_by_k_atienza.glb',p:1.1e6,d:2100,r:2,e:'🪖'},{n:'Vanguard',f:'models/perso/vanguard_by_t__choonyung.glb',p:4e6,d:4800,r:2.2,e:'🤖'},{n:'Maria la lame',f:'models/perso/maria_wprop_j_j_ong.glb',p:1.5e7,d:11000,r:2.4,e:'⚔️'}];
const GENS=[{k:'farm',n:'Potager',i:'🥕',b:1,c:40,g:1.32,m:'sub/building-type-a'},{k:'shop',n:'Atelier de ferraille',i:'🔩',b:9,c:900,g:1.33,m:'sub/building-type-f'},{k:'fact',n:'Usine de munitions',i:'🏭',b:70,c:14000,g:1.34,m:'com/building-c'},{k:'bank',n:'Marché noir',i:'💰',b:550,c:2.2e5,g:1.35,m:'com/building-g'},{k:'lab',n:'Laboratoire du vaccin',i:'🧪',b:4500,c:4e6,g:1.36,m:'com/building-skyscraper-b'}];
// types de tourelles : cadence, dégâts, portée, vague où on les débloque
const TT={mg:{n:'Mitrailleuse',i:'🔫',rate:1,dm:1,rg:l=>26+l*.4,w:1,d:'Tir rapide, une cible'},canon:{n:'Canon',i:'💥',rate:.33,dm:3,rg:l=>32+l*.4,w:6,d:'Obus qui explosent : dégâts de zone'},
 flame:{n:'Lance-flammes',i:'🔥',rate:3,dm:.42,rg:l=>16+l*.2,w:10,d:'Courte portée, brûle tout le groupe'},tesla:{n:'Tesla',i:'⚡',rate:.8,dm:1,rg:l=>24+l*.4,w:15,d:'Éclair qui saute sur 4 zombies'}};
// pouvoirs à déclencher : vague de déblocage, recharge (s), prix d'amélioration
const PWD=[{k:'air',i:'💣',n:'Frappe aérienne',w:3,cd:l=>Math.max(20,45-l*2),c:300,d:l=>'3 bombes : '+fmt(zHp(st.wave)*(1.2+.4*l))+' dégâts chacune'},
 {k:'ice',i:'❄️',n:'Blizzard',w:6,cd:l=>Math.max(30,60-l*2),c:900,d:l=>'Zombies ralentis de 65 % pendant '+(5+l)+' s'},
 {k:'over',i:'⚡',n:'Surcharge',w:10,cd:l=>Math.max(35,75-l*2),c:3000,d:l=>'Tourelles et héros tirent ×2 pendant '+(6+l)+' s'}];
const PW={air:0,ice:0,over:0,slow:0,boost:0,rage:0};// recharges restantes et effets en cours
const UPS=[{k:'dmg',i:'💥',n:'Munitions perforantes',d:'+15 % de dégâts',c:120,g:1.6},{k:'rate',i:'⚡',n:'Cadence de tir',d:'+8 % de vitesse de tir',c:200,g:1.7,max:25},{k:'loot',i:'🪙',n:'Pillage',d:'+12 % d’argent par zombie',c:150,g:1.6},{k:'regen',i:'🩹',n:'Réparations',d:'La base se répare plus vite',c:300,g:1.8,max:20},{k:'crit',i:'🎯',n:'Tir critique',d:'+3 % de chance de dégâts ×3',c:500,g:1.85,max:20},{k:'gen',i:'⚙️',n:'Rendement',d:'+10 % de production des bâtiments',c:800,g:1.75}];
const lvU=k=>st.up[k]|0,lvG=k=>st.gen[k]|0,costU=u=>Math.round(u.c*Math.pow(u.g,lvU(u.k))),costG=g=>Math.round(g.c*Math.pow(g.g,lvG(g.k)));
const MED=()=>1+.25*st.medals;
const R={dmgM:()=>Math.pow(1.15,lvU('dmg'))*MED(),rateM:()=>1+.08*lvU('rate'),loot:()=>(1+.12*lvU('loot'))*MED(),crit:()=>.03*lvU('crit'),

<div id="upd"><div><b>🎉 Nouvelle mise à jour disponible</b><small id="updn"></small></div><button onclick="location.reload()">Mettre à jour</button></div>
<div id="ins"><div><b>📲 Installer Dernier Rempart</b><small id="insm"></small></div><button id="insb" onclick="doIns()">Installer</button><button class="x" onclick="insLater()" aria-label="Plus tard">✕</button></div>
<script>
// Version du jeu : la seule à changer à chaque mise à jour, avec la même valeur dans version.json.
// Le service worker est enregistré avec cette version (sw.js?v=…), ce qui force son remplacement et vide l'ancien cache.
var APPV="2026-11-06.9";
var SWR=null,BIP=null;
var say=function(t){try{toast(t)}catch(x){}};
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js?v='+APPV).then(function(r){SWR=r}).catch(function(){})});
(function(){var v=document.getElementById("ver");if(v)v.textContent="Version "+APPV})();

function chkV(man){if(!window.fetch)return;if(SWR)SWR.update().catch(function(){});
 fetch("version.json?"+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(j){
  if(!j||!j.v||j.v===APPV){if(man)say("Le jeu est à jour ✓ (version "+APPV+")");return}if(man)document.getElementById("shop").style.display="none";
  document.getElementById("updn").textContent=j.notes||"";document.getElementById("ins").classList.remove("on");document.getElementById("upd").classList.add("on")}).catch(function(){if(man)say("Pas de connexion internet")})}
(function(){try{var o=localStorage.getItem("finecrasse-v");localStorage.setItem("finecrasse-v",APPV);if(o&&o!==APPV)setTimeout(function(){say("Jeu mis à jour ✓")},600)}catch(x){}})();
chkV();setInterval(chkV,30*60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)chkV()});

// Installation : bouton direct quand le navigateur le permet (Chrome Android), sinon explications.
function standalone(){try{return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true}catch(x){return false}}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
// Navigateurs intégrés (Messenger, WhatsApp, Facebook, Instagram…) : ils ne savent pas installer d'appli.
function inApp(){return /; wv\)|FBAN|FBAV|FB_IAB|Messenger|Instagram|WhatsApp|Snapchat|musical_ly|TikTok|Line\/|GSA\//.test(navigator.userAgent)}

function isChrome(){var u=navigator.userAgent;return !inApp()&& /Chrome\//.test(u)&&!/EdgA?\/|OPR\/|SamsungBrowser|HuaweiBrowser|HeyTapBrowser|MiuiBrowser|YaBrowser|Firefox|FxiOS|CriOS/.test(u)}
function showIns(force){if(standalone()||document.getElementById("upd").classList.contains("on"))return;

 var m=document.getElementById("insm"),b=document.getElementById("insb");

 else if(isAndroid()){m.textContent=isChrome()?"Menu ⋮ → « Installer l’application ». Pas dans le menu ? Ouvre d’abord dans Chrome.":"Ce navigateur ne peut pas installer le jeu : ouvre-le dans Chrome.";b.textContent="Ouvrir dans Chrome";b.style.display=""}
 else if(inApp()){m.textContent="Tu es dans le navigateur d’une messagerie : ouvre le jeu dans Safari pour l’installer.";b.textContent="Copier le lien";b.style.display=""}
