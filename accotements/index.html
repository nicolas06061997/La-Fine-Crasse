<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b2a1f">
<title>Accotements & Cie</title>
<style>
:root{--bg:#142019;--panel:#1f2f24;--panel2:#273b2d;--line:#355040;--tx:#eef3ee;--mut:#9fb3a5;--or:#ff9f1a;--gr:#5fd068;--rd:#ff5f56;--bl:#56b6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:auto}
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;background:#0f1913;border-bottom:1px solid var(--line);flex-wrap:wrap}
#top .c{font-weight:700;font-size:17px}
#top .s{color:var(--mut);font-size:13px}
#top .sp{margin-left:auto;display:flex;gap:4px}
.sb{background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:4px 8px;font-size:14px}
.sb.on{background:var(--or);color:#000;border-color:var(--or)}
#cv{width:100%;height:200px;display:block;touch-action:manipulation;background:#3d7a33}
nav{display:flex;background:#0f1913;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px;font-size:12px;position:relative}
nav button b{display:block;font-size:20px}
nav button.on{color:var(--or);box-shadow:inset 0 -3px var(--or)}
nav .bd{position:absolute;top:3px;right:18%;background:var(--rd);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
#pane{flex:1;overflow-y:auto;padding:10px 10px calc(env(safe-area-inset-bottom) + 20px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;background:var(--panel2);border-radius:6px;padding:1px 6px;font-size:12px;margin:2px 2px 0 0}
.tag.r{background:#5a2422;color:#ffb3ae}.tag.g{background:#1f4a27;color:#a8f0ae}.tag.o{background:#5a3a10;color:#ffd08a}
.btn{background:var(--or);color:#111;border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:15px}
.btn.s{background:var(--panel2);color:var(--tx);border:1px solid var(--line);font-weight:600}
.btn.r{background:var(--rd);color:#fff}
.btn:disabled{opacity:.4}
.bar{height:8px;background:#0c140f;border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--gr)}
.money{color:var(--gr);font-weight:700}.neg{color:var(--rd);font-weight:700}
h2{font-size:15px;color:var(--mut);margin:12px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal.on{display:flex}
#modal .box{background:var(--panel);width:100%;max-width:720px;max-height:88dvh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px);border-top:2px solid var(--or)}
#modal h3{margin:0 0 8px}
.chip{display:inline-block;border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:6px 10px;margin:3px;font-size:14px}
.chip.on{background:var(--gr);color:#000;border-color:var(--gr)}
input[type=range]{width:100%;accent-color:var(--or)}
input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0c140f;color:var(--tx);font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:3px 2px;border-bottom:1px solid var(--line)}td:last-child{text-align:right}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;gap:6px;width:92%;max-width:500px;pointer-events:none}
#toast div{background:#0f1913ee;border:1px solid var(--or);border-radius:10px;padding:8px 12px;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.log div{padding:3px 0;border-bottom:1px solid var(--line);font-size:13px}
</style>
</head>
<body>
<header id="top">
  <span class="c" id="hCash"></span>
  <span class="s" id="hRep"></span>
  <span class="s" id="hDate"></span>
  <span class="sp">
    <button class="sb" data-sp="0">⏸</button><button class="sb" data-sp="1">▶</button><button class="sb" data-sp="2">⏩</button><button class="sb" data-sp="3">⏭</button>
  </span>
</header>
<canvas id="cv"></canvas>
<nav id="tabs">
  <button data-t="ch"><b>🦺</b>Chantiers</button>
  <button data-t="ao"><b>📜</b>Offres SPW</button>
  <button data-t="eq"><b>👷</b>Équipe</button>
  <button data-t="mt"><b>🚚</b>Matériel</button>
  <button data-t="bi"><b>📊</b>Bureau</button>
</nav>
<main id="pane"></main>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eur=n=>Math.round(n).toLocaleString('fr-BE')+' €';
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const SAVE='accotements1';

// ---------- Données ----------
const EQ={
  van:{n:'Camionnette plateau',ic:'🚐',p:18000,u:25},
  fleche:{n:'Remorque flèche lumineuse',ic:'⚠️',p:9000,u:4},
  karcher:{n:'Nettoyeur haute pression',ic:'💦',p:4500,u:6},
  debrou:{n:'Débroussailleuses (lot)',ic:'🪚',p:3200,u:5},
  tracteur:{n:'Tracteur + faucheuse',ic:'🚜',p:68000,u:55},
  balayeuse:{n:'Balayeuse de voirie',ic:'🧹',p:75000,u:50},
  nacelle:{n:'Camion nacelle',ic:'🏗️',p:58000,u:45},
  hydro:{n:'Hydrocureuse',ic:'🚛',p:90000,u:70}
};
const RENT=0.015; // location : 1,5 % du prix par jour
const JOBS={
  dechets:{n:'Ramassage des déchets',ic:'🗑️',un:'km',q0:5,rate:1.5,pu:380,need:['van'],minW:2},
  panneaux:{n:'Nettoyage des panneaux',ic:'🪧',un:'panneaux',q0:50,rate:14,pu:32,need:['van','karcher'],minW:1},
  glissieres:{n:'Nettoyage des glissières',ic:'🛣️',un:'km',q0:3,rate:0.9,pu:850,need:['van','karcher','fleche'],minW:2},
  debrous:{n:'Débroussaillage',ic:'🌿',un:'km',q0:3,rate:0.6,pu:1300,need:['van','debrou'],minW:2,mo:[3,10]},
  fauchage:{n:'Fauchage des accotements',ic:'🌾',un:'km',q0:20,rate:4,pu:190,need:['tracteur','fleche'],minW:1,mo:[4,10]},
  balayage:{n:"Balayage des bandes d'arrêt",ic:'🧹',un:'km',q0:15,rate:6,pu:160,need:['balayeuse','fleche'],minW:1},
  elagage:{n:'Élagage le long des routes',ic:'🌳',un:'arbres',q0:20,rate:7,pu:170,need:['nacelle','fleche'],minW:2,mo:[10,3]},
  avaloirs:{n:'Curage des avaloirs',ic:'🕳️',un:'avaloirs',q0:60,rate:22,pu:30,need:['hydro','fleche'],minW:2}
};
const CL=[0,60000,200000,600000,2000000];
const CLUP={2:{c:5000,r:45},3:{c:15000,r:60},4:{c:40000,r:75}};
const ROADS=['N4','N5','N25','N40','N54','N63','N80','N89','N90','N97','N4','E411','E42','E25','E19','A15','R3','R9'];
const TOWNS=['Namur','Liège','Charleroi','Mons','Arlon','Bastogne','Dinant','Marche-en-Famenne','Wavre','Nivelles','Tournai','Verviers','Huy','Ciney','Libramont','Spa','Durbuy','Philippeville','Gembloux','Ath','Andenne','Rochefort','Neufchâteau','Waremme'];
const RIV=['Vert-Bord SRL','Routes Propres SA','Ardenne Entretien','Fauche & Fils','Mosan Services','Hainaut Voirie','EcoBerme SRL','Ets Lambotte','Condroz Paysage','Bermes du Sud'];
const PREN=['Kevin','Jordan','Mehdi','Steve','Dylan','Bryan','Julien','Maxime','Thomas','Sébastien','Rachid','Jonathan','Cédric','Michaël','Aurélie','Laura','Sarah','Ludovic','Grégory','Benoît','Fabrice','Yannick','Damien','Jessica','Loïc','Arnaud','Samir','Gaëtan'];

// ---------- État ----------
function mkW(n,sk,sal){sk=sk??+R(0.7,1.35).toFixed(2);return{id:st?st.nid++:1,n:n||pick(PREN)+' '+String.fromCharCode(65+RI(0,25))+'.',sk,sal:sal??Math.round(110+sk*70)}}
let st=null;
function newGame(){
  st={v:1,name:'Accotements & Cie',cash:25000,rep:30,day:0,cls:1,loan:0,nid:2,workers:[],eq:{van:1},tenders:[],contracts:[],cand:[],log:[],
      stats:{won:0,lost:0,done:0,ca:0},sel:null,wx:'☀️',wf:1,started:false};
  st.workers.push({id:1,n:'Toi (le patron)',sk:1.1,sal:0});
  st.workers.push(mkW());
  for(let i=0;i<4;i++)genTender(true);
  refreshCand();
}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(st))}catch(e){}}

const date=d=>{const x=new Date(2027,2,1+d);return x};
const month=()=>date(st.day).getMonth()+1;
const dstr=d=>{const x=date(d);return x.getDate()+' '+MOIS[x.getMonth()]};
function inSeason(J,m){if(!J.mo)return true;const[a,b]=J.mo;return a<=b?(m>=a&&m<=b):(m>=a||m<=b)}
const clsOf=v=>{for(let k=1;k<5;k++)if(v<=CL[k])return k;return 4};
function log(t,toast){st.log.unshift({d:st.day,t});st.log.length=Math.min(st.log.length,60);if(toast!==false)toastMsg(t)}
function toastMsg(t){const d=document.createElement('div');d.innerHTML=t;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3800)}

// ---------- Appels d'offres ----------
function genTender(init,forceJob,urgent){
  const m=month(),ok=Object.keys(JOBS).filter(k=>inSeason(JOBS[k],m));
  const j=forceJob||pick(ok),J=JOBS[j];
  const capCls=Math.min(4,st.cls+(Math.random()<0.25?1:0));
  const cap=CL[capCls],lo=CL[capCls-1]*0.5;
  let V=urgent?R(4000,12000):lo+(cap-lo)*Math.pow(Math.random(),1.7);
  V=Math.max(V,J.q0*J.pu);
  let q=Math.max(J.q0,Math.round(V/J.pu));
  const est=Math.round(q*J.pu*R(0.92,1.1)/10)*10;
  const dur=urgent?RI(4,7):clamp(Math.round(R(10,22)+est/25000),8,60);
  const nRef=Math.max(J.minW,Math.ceil(q/(J.rate*dur/1.35)));
  st.tenders.push({id:st.nid++,j,q,est,dur,nRef,road:pick(ROADS),town:pick(TOWNS),bidEnd:st.day+(urgent?2:RI(4,9)),bid:null,cls:clsOf(est),urgent:!!urgent});
}
function sets(j,n){return Math.max(1,Math.ceil(n/(JOBS[j].minW*2)))}
function freeEq(t,ex){let u=0;for(const c of st.contracts)if(c.st==='run'&&c!==ex)u+=(c.own[t]||0);return(st.eq[t]||0)-u}
function freeW(ex){const busy=new Set();for(const c of st.contracts)if(c.st==='run'&&c!==ex)c.crew.forEach(i=>busy.add(i));return st.workers.filter(w=>!busy.has(w.id))}
function eqPlan(j,n,ex){const s=sets(j,n),own={},rent={};let day=0;
  for(const t of JOBS[j].need){const f=Math.max(0,freeEq(t,ex)),o=Math.min(f,s),r=s-o;if(o)own[t]=o;if(r)rent[t]=r;day+=o*EQ[t].u+r*(EQ[t].p*RENT+EQ[t].u)}
  return{own,rent,day}}
function costEst(t){const J=JOBS[t.j],fw=st.workers;const avg=fw.reduce((a,w)=>a+w.sk,0)/fw.length;const avgSal=fw.reduce((a,w)=>a+w.sal,0)/fw.length||140;
  const days=Math.ceil(t.q/(J.rate*t.nRef*avg));const p=eqPlan(t.j,t.nRef);return{days,cost:days*(t.nRef*Math.max(avgSal,120)+p.day)}}

function resolveBid(t){
  const n=RI(2,5)+(t.est>100000?1:0);const bids=[{n:st.name,p:t.bid,r:st.rep,me:1}];
  const used=new Set();for(let i=0;i<n;i++){let nm;do nm=pick(RIV);while(used.has(nm));used.add(nm);bids.push({n:nm,p:Math.round(t.est*R(0.86,1.18)/10)*10,r:RI(30,85)})}
  const mn=Math.min(...bids.map(b=>b.p));bids.forEach(b=>b.s=70*mn/b.p+30*b.r/100);bids.sort((a,b)=>b.s-a.s);
  const win=bids[0].me,J=JOBS[t.j];
  const tbl='<table>'+bids.map((b,i)=>`<tr><td>${i+1}. ${b.me?'<b>'+b.n+'</b>':b.n}</td><td>${eur(b.p)}</td><td>${b.s.toFixed(1)} pts</td></tr>`).join('')+'</table>';
  if(win){st.stats.won++;
    const c={id:st.nid++,j:t.j,q:t.q,road:t.road,town:t.town,price:t.bid,prog:0,vis:0,deadline:st.day+3+t.dur,startBy:st.day+6,st:'wait',crew:[],own:{},rent:{},pen:0,paid:0,half:false,seed:RI(1,99999),tap:{},nRef:t.nRef};
    st.contracts.push(c);log(`🎉 Marché gagné : ${J.ic} ${J.n} (${t.road}) pour ${eur(t.bid)} ! Lance le chantier.`);
    showModal(`<h3>🎉 Marché attribué !</h3><p>${J.ic} <b>${J.n}</b><br>${t.road} — ${t.town}</p><p class="mut">Ouverture des offres :</p>${tbl}<p>Tu dois commencer avant le <b>${dstr(c.startBy)}</b> et finir avant le <b>${dstr(c.deadline)}</b>.</p><button class="btn" onclick="closeM();startUI(${c.id})">Lancer le chantier</button> <button class="btn s" onclick="closeM()">Plus tard</button>`);
  }else{st.stats.lost++;const i=bids.findIndex(b=>b.me);
    log(`❌ Marché perdu (${J.n}, ${t.road}) : ${bids[0].n} gagne à ${eur(bids[0].p)}. Tu es ${i+1}e.`);
    st.lastLost={t:`${J.ic} ${J.n} — ${t.road}`,tbl};}
}

// ---------- Simulation ----------
function weather(){const m=month(),r=Math.random(),w=m===12||m<=2;
  if(w&&r<0.2)return['❄️',0.25];if(r<0.05)return['⛈️',0];if(r<(w?0.45:0.3))return['🌧️',0.6];if(r<0.55)return['⛅',1];return['☀️',1]}
function tick(){
  st.day++;const[wx,wf]=weather();st.wx=wx;st.wf=wf;
  // coûts fixes
  let sal=st.workers.reduce((a,w)=>a+w.sal,0);st.cash-=sal+40+st.loan*0.0005;
  // chantiers
  for(const c of [...st.contracts]){const J=JOBS[c.j];
    if(c.st==='wait'&&st.day>c.startBy){st.contracts.splice(st.contracts.indexOf(c),1);st.rep=clamp(st.rep-10,0,100);const f=Math.round(c.price*0.05);st.cash-=f;
      log(`⚖️ Le SPW résilie le marché ${J.n} (${c.road}) : chantier jamais commencé. Amende ${eur(f)}, réputation -10.`);continue}
    if(c.st!=='run')continue;
    let eqc=0;for(const t in c.own)eqc+=c.own[t]*EQ[t].u;for(const t in c.rent)eqc+=c.rent[t]*(EQ[t].p*RENT+EQ[t].u);st.cash-=eqc;
    const crew=c.crew.map(i=>st.workers.find(w=>w.id===i)).filter(Boolean);
    const pw=crew.reduce((a,w)=>a+w.sk,0);c.prog=Math.min(c.q,c.prog+J.rate*pw*wf);
    crew.forEach(w=>w.sk=Math.min(1.7,+(w.sk+0.003).toFixed(3)));
    if(st.day>c.deadline){const p=c.price*0.01;c.pen=Math.min(c.price*0.2,c.pen+p)}
    if(!c.half&&c.prog>=c.q/2){c.half=true;const a=Math.round(c.price*0.4);c.paid+=a;st.cash+=a;log(`💶 État d'avancement payé par le SPW : +${eur(a)} (${J.n})`)}
    if(c.prog>=c.q)finish(c);
  }
  // appels d'offres
  for(const t of [...st.tenders])if(st.day>=t.bidEnd){st.tenders.splice(st.tenders.indexOf(t),1);if(t.bid)resolveBid(t)}
  if(st.tenders.length<9&&Math.random()<0.6)genTender();
  if(st.tenders.length<3)genTender();
  if(st.day%7===0)refreshCand();
  events();
  if(st.cash<-20000&&!st.over){st.over=true;showModal(`<h3>💀 Faillite</h3><p>Ta société <b>${st.name}</b> a trop de dettes (${eur(st.cash)}).</p><p class="mut">Tu as tenu ${st.day} jours et fini ${st.stats.done} chantiers.</p><button class="btn" onclick="localStorage.removeItem(SAVE);location.reload()">Recommencer</button>`,true)}
  save();render();
}
function finish(c){const J=JOBS[c.j];st.contracts.splice(st.contracts.indexOf(c),1);
  const crew=c.crew.map(i=>st.workers.find(w=>w.id===i)).filter(Boolean);const avg=crew.reduce((a,w)=>a+w.sk,0)/Math.max(1,crew.length);
  let rest=c.price-c.paid-c.pen,msg='';
  const late=st.day>c.deadline;let dr=late?-RI(3,7):RI(2,4)+(c.price>100000?2:0);
  if(Math.random()<(1.3-avg)*0.6){dr-=2;rest-=c.price*0.03;msg+=' Le contrôleur du SPW a trouvé des finitions à revoir.'}
  st.cash+=rest;st.rep=clamp(st.rep+dr,0,100);st.stats.done++;st.stats.ca+=c.price-c.pen;if(st.sel===c.id)st.sel=null;
  showModal(`<h3>✅ Chantier terminé</h3><p>${J.ic} <b>${J.n}</b> — ${c.road}, ${c.town}</p><table>
  <tr><td>Prix du marché</td><td>${eur(c.price)}</td></tr><tr><td>Déjà payé</td><td>${eur(c.paid)}</td></tr>
  ${c.pen?`<tr><td>Amendes de retard</td><td class="neg">-${eur(c.pen)}</td></tr>`:''}<tr><td><b>Paiement final</b></td><td class="money">+${eur(rest)}</td></tr>
  <tr><td>Réputation</td><td>${dr>0?'+':''}${dr}</td></tr></table><p class="mut">${late?'En retard sur le délai.':'Dans les délais, bravo !'}${msg}</p><button class="btn" onclick="closeM()">OK</button>`);
  log(`✅ ${J.n} (${c.road}) terminé : +${eur(rest)}, réputation ${dr>0?'+':''}${dr}`,false);
}
function events(){if(Math.random()>0.05)return;const run=st.contracts.filter(c=>c.st==='run');const r=Math.random();
  if(r<0.25){const k=RI(400,2500);st.cash-=k;log(`🔧 Panne de matériel : réparation ${eur(k)}`)}
  else if(r<0.5){genTender(false,'dechets',true);log('🚨 Dépôt clandestin signalé ! Marché urgent de ramassage dans les Offres SPW.')}
  else if(r<0.7&&run.length){st.rep=clamp(st.rep+2,0,100);log('🕵️ Contrôle du SPW sur chantier : travail impeccable, réputation +2')}
  else if(r<0.85&&run.length){const k=RI(300,1500);st.cash-=k;log(`🚗 Un automobiliste a heurté un cône. Assurance, franchise : ${eur(k)}`)}
  else{const k=RI(500,3000);st.cash+=k;log(`🏦 Remboursement de TVA reçu : +${eur(k)}`)}
}
function refreshCand(){st.cand=[mkW(),mkW(),mkW()]}

// ---------- Actions ----------
function bidUI(id){const t=st.tenders.find(x=>x.id===id);if(!t)return;const J=JOBS[t.j];
  if(t.cls>st.cls)return showModal(`<h3>🔒 Classe d'agréation insuffisante</h3><p>Ce marché demande la classe <b>${t.cls}</b>. Tu es en classe ${st.cls}.</p><p class="mut">Monte de classe dans le Bureau 📊.</p><button class="btn" onclick="closeM()">OK</button>`);
  const ce=costEst(t);const p=eqPlan(t.j,t.nRef);
  showModal(`<h3>${J.ic} ${J.n}</h3><p>${t.road} — ${t.town}<br><b>${t.q.toLocaleString('fr-BE')} ${J.un}</b> en <b>${t.dur} jours</b></p>
  <p class="mut">Estimation du SPW : ${eur(t.est)}<br>Équipe conseillée : ${t.nRef} ouvriers<br>Matériel : ${J.need.map(x=>EQ[x].ic+' '+EQ[x].n+' ×'+sets(t.j,t.nRef)).join(', ')}${Object.keys(p.rent).length?'<br>⚠️ Il te manque du matériel : il sera loué (cher).':''}</p>
  <p>Ton prix : <b id="bp"></b></p><input type="range" id="bs" min="70" max="130" value="100" oninput="bidUpd(${t.id})">
  <p class="mut" id="bm"></p><p class="mut">Le SPW choisit l'offre la plus intéressante : 70 % prix, 30 % réputation.</p>

  const sx=tx-camX;const tall=J&&(c.j==='fauchage'||c.j==='debrous');
  rect(0,yC,CW,CH-yC,'#5a9a43');
  if(J){rect(Math.max(0,sx),yC,CW,CH-yC,tall?'#2f6e27':'#4f8e3a');if(c.j==='fauchage'){for(let x=(-camX%24+24)%24-24;x<sx;x+=24)rect(x,yC+4,12,CH-yC,'#67ad4f')}}
  rect(0,CH-14,CW,14,'#7a6a3e');
  rect(0,yB,CW,yC-yB,'#55595f');rect(0,yB,CW,2,'#ddd');rect(0,yC-2,CW,2,'#ddd');
  g.fillStyle='#eee';const lane=(yC-yB)/3;for(let x=(-camX%40+40)%40-40;x<CW;x+=40){g.fillRect(x,yB+lane-1,20,2);g.fillRect(x,yB+lane*2-1,20,2)}
  rect(0,yA,CW,3,'#aab');for(let x=(-camX%50+50)%50-50;x<CW;x+=50)rect(x,yA-2,3,7,'#778');
  // objets
  const i0=Math.floor(camX/SEG)-2,i1=i0+Math.ceil(CW/SEG)+4,seed=c?c.seed:7;
  for(let i=i0;i<=i1;i++){const x=i*SEG-camX,r=hh(i*7+seed),r2=hh(i*13+seed*3),r3=hh(i*29+seed);
    if(r<0.1)tree(x,yA*0.45,0.8);else if(r<0.25)circ(x,yA*0.6,7,'#3a7a2e');
    if(!J){if(r2<0.08)tree(x,CH*0.85,0.9);continue}
    const done=i*SEG+SEG/2<tx||c.tap[i];const yv=yC+(CH-yC)*0.45;
    if(c.j==='dechets'){if(!done&&r2<0.5){const k=Math.floor(r3*4),xx=x+r3*20,yy=yC+8+r2*2*(CH-yC-24);
        if(k===0)rect(xx,yy,9,4,'#3c9a4a');else if(k===1)rect(xx,yy,6,4,'#d33');else if(k===2)circ(xx,yy,4,'#f4f4f4');else circ(xx,yy,5,'#222')}
      if(done&&!c.tap[i]&&r2<0.05)circ(x,yC+10,6,'#f4e04d')}
    else if(c.j==='fauchage'){if(!done){g.strokeStyle='#3f8a30';g.lineWidth=2;for(let k=0;k<6;k++){const bx=x+k*5,sw=Math.sin(t*2+bx*0.05)*3;g.beginPath();g.moveTo(bx,CH-14);g.lineTo(bx+sw,yC+6+hh(i*5+k)*10);g.stroke()}}}
    else if(c.j==='debrous'){if(!done&&r2<0.75){circ(x+10,yv,11+r3*6,'#245a20');circ(x+2,yv+6,8,'#2c6a24');circ(x+12,yv-6,3,'#7a2a6a')}else if(done&&r2<0.75){rect(x+6,yv,3,4,'#6b4a2a');rect(x+14,yv+3,3,3,'#6b4a2a')}}
    else if(c.j==='panneaux'){if(i%5===0){rect(x,yC+10,2,22,'#999');const sy=yC+4;if(r2<0.5){rect(x-9,sy-6,20,14,'#1d5bbf');g.strokeStyle='#fff';g.lineWidth=1.5;g.strokeRect(x-8,sy-5,18,12)}else{g.fillStyle='#fff';g.beginPath();g.moveTo(x+1,sy-9);g.lineTo(x+12,sy+8);g.lineTo(x-10,sy+8);g.fill();g.strokeStyle='#d22';g.lineWidth=2.5;g.stroke()}
        if(!done){g.fillStyle='rgba(90,70,40,.7)';g.fillRect(x-10,sy-9,22,18);circ(x-3,sy,2,'#3a5a20')}}}
    else if(c.j==='glissieres'){const gy=yC+10;rect(x,gy,SEG,5,done?'#d6dbe3':'#7d6c55');if(done)rect(x,gy,SEG,1.5,'#fff');else if(r2<0.5)circ(x+r3*SEG,gy+2,2.5,'#4e6a2a');if(i%2===0)rect(x+2,gy-2,3,9,'#888')}
    else if(c.j==='avaloirs'){if(i%4===0){const ay=yC-9;rect(x,ay,14,7,'#222');g.strokeStyle='#666';g.lineWidth=1;for(let k=2;k<14;k+=3){g.beginPath();g.moveTo(x+k,ay);g.lineTo(x+k,ay+7);g.stroke()}if(!done){circ(x+5,ay+3,5,'#7a5a2a');circ(x+10,ay+4,4,'#a07a30')}}}
    else if(c.j==='elagage'){if(i%3===0){tree(x,yC+30,done?0.8:1.1);if(!done){circ(x+4,yC-6,12,'#28602a');circ(x+14,yC-12,9,'#2e6b2a')}}}
    else if(c.j==='balayage'){if(!done){for(let k=0;k<6;k++)circ(x+hh(i*3+k)*SEG,yL3+4+hh(i*11+k)*(yC-yL3-8),1.6,'#a39370')}}
    if(J&&c.j!=='dechets'&&!done&&r3<0.08){const xx=x+r2*20;rect(xx,yC+12+r2*20,6,4,'#d33')}
  }
  // voitures
  if(Math.random()<0.015)cars.push({lane:Math.random()<0.5?0:1,x:0,v:R(110,170),c:pick(['#c33','#36c','#eee','#333','#888','#2a6','#d92'])});
  const dt=Math.min(0.05,t-lastT);
  for(const k of cars){if(k.x===0)k.x=k.lane?camX-60:camX+CW+60;k.x+=(k.lane?1:-1)*k.v*dt}
  cars=cars.filter(k=>k.x>camX-100&&k.x<camX+CW+100);
  for(const k of cars){const x=k.x-camX,y=yB+lane*(k.lane+0.5);rect(x-16,y-8,32,16,k.c);rect(x+(k.lane?4:-12),y-6,8,12,'#9fd3ff');rect(x+(k.lane?-12:6),y-6,6,12,'#9fd3ff')}
  // équipe
  if(J){const vy=yB+lane*2.5;for(let x=sx-300;x<sx+90;x+=26)cone(x-((camX%26)-(camX%26)),yL3+2);
    const kind=J.need.find(n=>EQ[n]&&['tracteur','balayeuse','nacelle','hydro'].includes(n))||'van';
    if(kind==='van'){truck(sx-60,vy,'van',t);fleche(sx-130,vy,t)}else{truck(sx-6,vy,kind,t);fleche(sx-80,vy,t)}
    const tool={dechets:'pince',panneaux:'lance',glissieres:'lance',debrous:'debrou',elagage:'scie',fauchage:'',balayage:'',avaloirs:''}[c.j];
    const n=Math.min(6,c.crew.length),showW=kind==='van'?n:Math.max(0,n-1);
    for(let k=0;k<showW;k++)worker(sx-k*20+Math.sin(t+k)*4,yC+16+(k%2)*16+(c.j==='avaloirs'?-30:0),t,k*1.7,tool);
    if(c.j==='fauchage'&&Math.random()<0.6)parts.push({x:sx+28+camX,y:yC+34,vx:R(-80,-20),vy:R(-40,10),l:0.5,c:'#79c04f',r:2});
    if(c.j==='balayage'&&Math.random()<0.6)parts.push({x:sx+20+camX,y:vy+8,vx:R(-60,-10),vy:R(-20,20),l:0.6,c:'rgba(200,190,160,.6)',r:4});
  }else{truck(CW*0.5,yB+lane*2.5,'van',0);}
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.l-=dt;if(p.txt){g.fillStyle='#ffd34d';g.font='bold 14px system-ui';g.fillText(p.txt,p.x-camX,p.y)}else circ(p.x-camX,p.y,p.r,p.c)}
  parts=parts.filter(p=>p.l>0);if(parts.length>200)parts.splice(0,parts.length-200);
  // bandeau
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,CW,22);g.fillStyle='#fff';g.font='13px system-ui';
  g.fillText(c?`${J.ic} ${J.n} — ${c.road} · ${Math.floor(c.prog/c.q*100)} %`:'🅿️ Au dépôt — pas de chantier en cours',8,15);
  lastT=t;
}
cv.addEventListener('pointerdown',e=>{const c=selC();if(!c)return;const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
  const yB=CH*0.27,yC=CH*0.66,yL3=yB+(yC-yB)*2/3;if(y<yL3-4)return;const wx=x+camX,tx=c.vis/c.q*LEN+200;
  if(wx<tx||wx>tx+CW*0.5)return;const i=Math.floor(wx/SEG);if(c.tap[i])return;c.tap[i]=1;c.prog=Math.min(c.q,c.prog+c.q*0.0015);
  parts.push({x:wx,y,vx:0,vy:-40,l:0.9,txt:'+1 👍'});for(let k=0;k<6;k++)parts.push({x:wx,y,vx:R(-60,60),vy:R(-80,-20),l:0.5,c:'#ffd34d',r:2})});

// ---------- Boucle ----------
const SPD=[0,3000,1200,400];let acc=0,prevT=performance.now();
function loop(now){const dt=now-prevT;prevT=now;if(!modalOpen&&speed&&!st.over){acc+=dt;if(acc>=SPD[speed]){acc=0;tick()}}draw(now/1000);requestAnimationFrame(loop)}
render();
if(!st.started){st.started=true;save();showModal(`<h3>🦺 Accotements & Cie</h3><p>Crée ton entreprise d'entretien des bords de route en Wallonie : ramassage des déchets, nettoyage des panneaux et des glissières, débroussaillage, fauchage, balayage, élagage, curage des avaloirs…</p><p>Ton client, c'est le <b>SPW</b> : il publie des marchés publics. Remets le meilleur prix, fais du bon travail dans les délais, et fais grandir ta boîte !</p><p class="mut">Choisis le nom de ta société :</p><input type="text" id="nm" value="${st.name}" maxlength="30"><p></p><button class="btn" onclick="st.name=$('#nm').value.trim()||st.name;closeM();save();render()">Commencer</button>`)}
requestAnimationFrame(loop);
</script>
