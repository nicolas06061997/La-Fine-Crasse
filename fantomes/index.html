  st.m-=b.c;L[u.k]+=b.n;snd(700,.08,'triangle',.06,1100);renderUI()})}
function renderUI(){
 $('money').textContent=fmt(st.m)+' €';const inc=income(true);$('ips').textContent='+'+fmt(inc)+' €/s';
 const P=PLACES[st.spot];$('place').textContent=P.ic+' '+P.n;$('ecto').textContent='🧪 '+fmt(st.ecto);
 const fz=$('fz');if(frenzy>0){fz.style.display='block';fz.textContent='🌕 Pleine lune ×3 · '+Math.ceil(frenzy)+' s'}else fz.style.display='none';
 const L=lv();UPS.forEach((u,i)=>{const el=document.querySelectorAll('.up')[i];if(!el)return;const l=L[u.k],b=buyInfo(u),mx=l>=u.mx;
  el.querySelector('.lv').textContent='Niv. '+l;el.querySelector('.ef').textContent=effTxt(u,l);
  el.classList.toggle('max',mx);el.classList.toggle('ok',!mx&&b.n>0&&b.c<=st.m);
  el.querySelector('.pr span').textContent=mx?'MAX':(b.n>1?'×'+b.n+' ':'')+fmt(b.c)+' €';el.querySelector('.pr i').style.width=mx?'0':Math.min(100,st.m/b.c*100)+'%'});
 const c=capRate(),sp=1/spnT(L.spn);
 $('info').innerHTML='<span>👥 '+st.hun.length+' chasseur'+(st.hun.length>1?'s':'')+'</span><span>👻 '+ghosts.filter(g=>!g.gold).length+'/'+maxG(L.spn)+'</span>'+
  (c.r>sp*1.25?'<span class="w">💤 Ils attendent : 🕯️ Encens !</span>':ghosts.length>=maxG(L.spn)?'<span class="w">😱 Trop de fantômes : ⚡ ou 👥</span>':'<span>⚡ '+(c.r).toFixed(1).replace('.',',')+' captures/s</span>');
 const bb=$('bossB');bb.style.display='block';const won=st.bc[st.spot]>0;
 if(bossCd>0){bb.classList.add('cd');bb.textContent='👹 '+P.boss.n+' revient dans '+Math.ceil(bossCd)+' s'}else{bb.classList.remove('cd');bb.textContent=(won?'👹 Rejouer contre ':'👹 Boss : ')+P.boss.n}
 bb.style.animation=won||bossCd>0?'none':'';
 $('bTeam').classList.toggle('dot',st.hun.length<HIRE.length&&st.m>=HIRE[st.hun.length]);
 $('bLab').classList.toggle('dot',RES.some(r=>st.res[r.k]<r.mx&&st.ecto>=resCost(r,st.res[r.k])));
 $('bMap').classList.toggle('dot',st.maxSpot>st.spot&&!(st.lvs[st.maxSpot]));
}
$('bossB').onclick=()=>{if(bossCd>0){toast('Le boss reprend des forces… '+Math.ceil(bossCd)+' s');return}openBoss()};

// Contrats (maisons)
function goPlace(i){st.spot=i;ghosts.slice().forEach(freeGhost);buildPlace();renderUI();save();toast(PLACES[i].ic+' Bienvenue à <b>'+PLACES[i].n+'</b> !');snd(220,.6,'sine',.06,440)}
function openMap(){let h='<h2>🏚️ Contrats</h2><p><small>Chaque maison a ses propres améliorations. Bats le boss pour débloquer la suivante.</small></p>';
 PLACES.forEach((P,i)=>{const lock=i>st.maxSpot,cur=i===st.spot;let got=0;for(let k=0;k<NG;k++)if(caughtN(i*NG+k))got++;
  h+='<div class="row '+(cur?'cur':'')+(lock?' lock':'')+'"><div class="ri">'+(lock?'🔒':P.ic)+'</div><div class="rt">'+(lock?'???':P.n)+'<small>'+(lock?'Bats le boss précédent':'👻 '+got+'/'+NG+' fantômes · boss '+(st.bc[i]>0?'✅':'❌'))+'</small>'+(lock?'':'<em>Fantôme commun : '+fmt(BASE(i))+' €</em>')+'</div>'+
  (lock?'':cur?'<button disabled>Ici</button>':'<button data-go="'+i+'">🚐 Aller</button>')+'</div>'});
 pop(h);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{closePop();goPlace(+b.dataset.go)})}
$('bMap').onclick=openMap;

// Équipe
function tTag(t){const T=TRAITS[t];return '<span class="trait" style="background:'+hex(T.c)+'">'+T.ic+' '+T.n+'</span>'}
function openTeam(){let h='<h2>👥 Ton équipe</h2>';
 st.hun.forEach((x,i)=>{const c=hLvCost(x.lv,x.s);h+='<div class="row"><div class="ri">'+TRAITS[x.t].ic+'</div><div class="rt">'+x.nm+' '+tTag(x.t)+'<small><span class="stars">'+'★'.repeat(x.s+1)+'</span> · Niv. '+x.lv+' · ×'+hm(x).toFixed(1).replace('.',',')+' argent</small><em>'+TRAITS[x.t].d+'</em></div><button data-up="'+i+'" '+(st.m>=c?'':'disabled')+'>⬆️ '+fmt(c)+' €</button></div>'});
 if(st.hun.length<HIRE.length){const pr=HIRE[st.hun.length];h+='<div class="sec"><h3>📋 Recruter ('+st.hun.length+'/'+HIRE.length+')</h3><p><small>Chaque chasseur capture en même temps que les autres. Choisis ton candidat :</small></p>';
  st.cand.forEach((x,i)=>{h+='<div class="row"><div class="ri">'+TRAITS[x.t].ic+'</div><div class="rt">'+x.nm+' '+tTag(x.t)+'<small><span class="stars">'+'★'.repeat(x.s+1)+'</span> ×'+hm(x).toFixed(2).replace('.',',')+'</small><em>'+TRAITS[x.t].d+'</em></div><button data-hire="'+i+'" '+(st.m>=pr?'':'disabled')+'>'+fmt(pr)+' €</button></div>'});
  h+='<button class="bb b" id="bReroll" '+(st.ecto>=1?'':'disabled')+'>🔄 Autres candidats (1 🧪)</button></div>'}
 else h+='<p>✅ Ton équipe est au complet !</p>';
 pop(h);
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const x=st.hun[+b.dataset.up],c=hLvCost(x.lv,x.s);if(st.m<c)return;st.m-=c;x.lv++;snd(700,.1,'triangle',.06,1200);openTeam();renderUI()});
 document.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>{const pr=HIRE[st.hun.length];if(st.m<pr)return;st.m-=pr;const x=st.cand[+b.dataset.hire];st.hun.push(x);st.cand=[newCand(),newCand(),newCand()];placeHunters();jingle([523,784,1046]);toast('🎉 <b>'+x.nm+'</b> rejoint l’équipe !');openTeam();renderUI();save()});
 if($('bReroll'))$('bReroll').onclick=()=>{if(st.ecto<1)return;st.ecto--;st.cand=[newCand(),newCand(),newCand()];openTeam();renderUI()}}
$('bTeam').onclick=openTeam;

// Labo
function openLab(){let h='<h2>🧪 Labo</h2><p>Ectoplasme : <b>'+fmt(st.ecto)+' 🧪</b><br><small>Il tombe des fantômes rares, des boss et des fantômes dorés.</small></p>';
 RES.forEach(r=>{const l=st.res[r.k],c=resCost(r,l),mx=l>=r.mx;h+='<div class="row"><div class="ri">'+r.ic+'</div><div class="rt">'+r.n+' <small>Niv. '+l+(r.k==='van'?' · '+vanH(l)+' h':'')+'</small><em>'+r.d+'</em></div>'+(mx?'<button class="mx" disabled>MAX</button>':'<button data-r="'+r.k+'" '+(st.ecto>=c?'':'disabled')+'>'+c+' 🧪</button>')+'</div>'});
 pop(h);document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=RES.find(x=>x.k===b.dataset.r),c=resCost(r,st.res[r.k]);if(st.ecto<c)return;st.ecto-=c;st.res[r.k]++;snd(500,.3,'sine',.07,1500);openLab();renderUI();save()})}
$('bLab').onclick=openLab;

// Collection
let colTab=0;
function openCol(t){if(t!==undefined)colTab=t;const s=colTab,P=PLACES[s],lock=s>st.maxSpot;
 let h='<h2>👻 Collection</h2><div class="tabs">'+PLACES.map((p,i)=>'<button data-t="'+i+'" class="'+(i===s?'on':'')+'">'+(i>st.maxSpot?'🔒':p.ic)+'</button>').join('')+'</div>';
 h+='<p><b>'+(lock?'???':P.n)+'</b><br><small>Chaque étoile ★ = +1 % d’argent pour toujours (★ 1 capture, ★★ 50, ★★★ 500)</small></p><div class="grid">';
 for(let k=0;k<NG;k++){const c=caughtN(s*NG+k),n=starsOf(c);h+=c?'<div class="fc"><div class="e" style="background:'+hex(RCOL[k])+';--g:'+hex(RCOL[k])+'">👻</div><b>'+P.g[k]+'</b><small>'+RAR[k]+'<br>×'+fmt(c)+'</small><div class="st">'+'★'.repeat(n)+'☆'.repeat(3-n)+'</div></div>':'<div class="fc lock"><div class="e">?</div><b>???</b><small>'+RAR[k]+'</small></div>'}
 const bc=st.bc[s]||0;h+='<div class="fc boss"><div class="e" style="background:'+hex(P.boss.c)+';--g:'+hex(P.boss.c)+'">'+(bc?'👹':'?')+'</div><b>'+(bc?P.boss.n:'Boss ???')+'</b><small>'+(bc?'Vaincu '+bc+' fois':'Pas encore vaincu')+'</small></div></div>';
 pop(h);document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>openCol(+b.dataset.t))}
$('bCol').onclick=()=>openCol(st.spot);

// Succès
const ACH=[
 ['🪤','Première capture',()=>st.caps>=1],['👻','100 fantômes',()=>st.caps>=100],['👻','1 000 fantômes',()=>st.caps>=1000],['💀','10 000 fantômes',()=>st.caps>=1e4],['☠️','100 000 fantômes',()=>st.caps>=1e5],
 ['👥','Équipe de 3',()=>st.hun.length>=3],['👥','Équipe de 5',()=>st.hun.length>=5],['🏢','Équipe complète',()=>st.hun.length>=8],
 ['👹','Premier boss',()=>st.bc.some(x=>x>0)],['🏰','5 maisons nettoyées',()=>st.bc.filter(x=>x>0).length>=5],['👑','Toutes les maisons',()=>st.bc.filter(x=>x>0).length>=10],
 ['🌕','Fantôme doré',()=>st.gold>=1],['🌕','10 fantômes dorés',()=>st.gold>=10],['🌟','Un légendaire',()=>PLACES.some((p,i)=>caughtN(i*NG+5)>0)],
 ['💰','Millionnaire',()=>st.life>=1e6],['💎','Milliardaire',()=>st.life>=1e9],['🤑','1 000 milliards',()=>st.life>=1e12],['🏪','Première franchise',()=>st.fr>=1],
];
function chkAch(){ACH.forEach((a,i)=>{if(st.ach.indexOf(i)<0&&a[2]()){st.ach.push(i);toast('🏆 Succès : <b>'+a[1]+'</b><br><small>+2 % d’argent pour toujours</small>');jingle([784,988,1175])}})}

// Plus + Franchise
function openMore(){const g=badgeGain(st.run),ok=st.maxSpot>=4;
 pop('<h2>⭐ Plus</h2>'+
 '<div class="sec"><h3>🏪 Ouvrir une franchise</h3><p>Tu ouvres une agence dans une nouvelle ville : tu repars de la première maison, mais tu gagnes des <b>badges 🎖️</b>. Chaque badge = <b>+10 % d’argent pour toujours</b>. Tu gardes ton équipe (niveaux remis à 0), le labo, l’ectoplasme, la collection et les succès.</p>'+
 (ok?'<p>Badges : <b>🎖️ '+st.badges+'</b> · tu gagnerais <b>+'+g+'</b>'+(g?'':'<br><small>(1er badge à '+fmt(1e9)+' € gagnés, déjà '+fmt(st.run)+' €)</small>')+'</p>':'<p><small>Disponible après avoir battu le boss de l’<b>École Abandonnée</b>.</small></p>')+
 '<button class="bb" id="bFr" '+(ok&&g?'':'disabled')+'>🏪 Ouvrir la franchise (+'+g+' 🎖️)</button></div>'+
 '<div class="sec"><h3>🏆 Succès ('+st.ach.length+'/'+ACH.length+')</h3><p style="text-align:left;font-size:13px">'+ACH.map((a,i)=>(st.ach.indexOf(i)>=0?a[0]+' <b>':'<span style="opacity:.45">🔒 ')+a[1]+(st.ach.indexOf(i)>=0?'</b>':'</span>')).join('<br>')+'</p></div>'+
 '<div class="sec"><h3>📊 Statistiques</h3><p style="text-align:left">Argent gagné en tout : <b>'+fmt(st.life)+' €</b><br>Fantômes capturés : <b>'+fmt(st.caps)+'</b><br>Boss vaincus : <b>'+st.bc.reduce((a,b)=>a+(b||0),0)+'</b><br>Fantômes dorés : <b>'+st.gold+'</b><br>Bonus total : <b>×'+gainMult(false).toFixed(2).replace('.',',')+'</b> (labo, badges, étoiles, succès)</p></div>'+
 '<button class="bb b" id="bSnd">'+(st.snd?'🔊 Son : activé':'🔇 Son : coupé')+'</button>'+
 '<button class="bb b" id="bHelp">❓ Comment jouer</button>'+
 '<button class="bb b" id="bUpd">🔄 Vérifier les mises à jour</button>'+
 '<button class="bb r" id="bRst">🗑️ Recommencer à zéro</button><p><small>Version '+APPV+'</small></p>');
 $('bFr').onclick=()=>{const g=badgeGain(st.run);if(!g||!ok)return;if(!confirm('Ouvrir une franchise ? Ton argent, tes améliorations et tes maisons repartent à zéro.'))return;
  st.badges+=g;st.fr++;st.m=0;st.run=0;st.lvs=[];st.spot=0;st.maxSpot=0;st.bc=[];st.hun.forEach(h=>h.lv=0);bossCd=0;
  ghosts.slice().forEach(freeGhost);buildPlace();closePop();renderUI();save();toast('🏪 Nouvelle franchise ! <b>+'+g+' 🎖️</b>');jingle([523,659,784,1046])};
 $('bSnd').onclick=()=>{st.snd=st.snd?0:1;save();openMore()};
 $('bHelp').onclick=help;
 $('bUpd').onclick=()=>chkUpd(true);
 $('bRst').onclick=()=>{if(confirm('Effacer toute ta partie ?')){try{localStorage.removeItem(KEY)}catch(e){}window.__rst=1;location.reload()}}}
$('bMore').onclick=openMore;
function help(){pop('<h2>❓ Comment jouer</h2><p style="text-align:left">👻 Les fantômes sortent des fenêtres. Tes <b>chasseurs</b> les aspirent tout seuls et tu gagnes de l’argent.<br><br>👆 <b>Touche un fantôme</b> pour l’attraper toi-même : ça rapporte <b>×2</b> !<br><br>🌕 Un <b>fantôme doré</b> passe parfois : touche-le vite pour la <b>Pleine lune</b> (×3 pendant 20 s).<br><br>🪤 Pièges = plus d’argent · ⚡ Aspirateur = captures plus rapides · 🕯️ Encens = plus de fantômes · 📡 Détecteur = plus de fantômes rares.<br><br>👥 Recrute des chasseurs et choisis bien leur spécialité.<br><br>👹 Bats le <b>boss</b> de la maison pour débloquer la suivante.<br><br>🧪 L’ectoplasme sert au <b>labo</b>.</p><button class="bb" id="bOk">C’est parti !</button>');$('bOk').onclick=closePop}

// Gains pendant l'absence
function offline(sec){const lim=vanH(st.res.van)*3600,s=Math.min(sec,lim),g=income(false)*s;if(g<=0)return;earn(g);
 if(sec>=60){pop('<h2>👋 Bon retour !</h2><p>Ton équipe a chassé pendant <b>'+fmtH(s/3600)+'</b>'+(sec>lim?'<br><small>(le van n’a que '+fmtH(lim/3600)+' d’essence : améliore 🚐 Grand van au labo !)</small>':'')+'</p><p style="font-family:var(--gf);font-size:30px;color:#b9ffcb">+'+fmt(g)+' €</p><button class="bb" id="bOk">💰 Récupérer</button>');
  $('bOk').onclick=()=>{closePop();snd(660,.1,'triangle',.1,1320)}}save()}

// Mises à jour
let SWR=null;
function chkUpd(man){fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
 if(!j||!j.v||j.v===APPV){if(man)toast('Le jeu est à jour ✓');return}closePop();$('updn').textContent=j.notes||'';$('upd').classList.add('on')}).catch(()=>{if(man)toast('Pas de connexion')})}
$('updB').onclick=()=>{try{SWR&&SWR.update()}catch(e){}setTimeout(()=>location.reload(),300)};
if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js?v='+APPV).then(r=>{SWR=r}).catch(()=>{})});
setInterval(()=>chkUpd(false),5*60e3);setTimeout(()=>chkUpd(false),4000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(fight)fight.hold=false;save()}else chkUpd(false)});
addEventListener('pagehide',save);

const camT=new V3();
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?62:45;cam.updateProjectionMatrix();
 const vf=cam.fov*Math.PI/180,hf=2*Math.atan(Math.tan(vf/2)*cam.aspect),need=HD.fw*(w<h?.82:1)+4,needH=Math.min(HD.fh,13)+8;
 let d=Math.max(need/2/Math.tan(hf/2),needH/2/Math.tan(vf/2),21);d=Math.min(d,60);
 camT.set(HD.cx*.6,HD.fh*.38+(w<h?-1.2:.8),HD.d/2+2);cam.position.set(camT.x,camT.y+d*.28,camT.z+d)}
addEventListener('resize',resize);

// ===================== Boucle =====================
buildCards();buildPlace();renderUI();
(()=>{const s=(Date.now()-(st.t||Date.now()))/1000;if(s>5)offline(s)})();
if(!st.life)setTimeout(help,600);
let T=0,last=performance.now(),uiT=0,saveT=0,achT=1,spT=0,goldT=rnd(40,70),lightT=rnd(15,30);
function updGhosts(dt){const L=lv(),B=bounds();
 spT-=dt;if(spT<=0){spT=spnT(L.spn)*rnd(.7,1.3);if(ghosts.filter(g=>!g.gold).length<maxG(L.spn))spawnGhost(false)}
 goldT-=dt;if(goldT<=0){goldT=rnd(60,120)/(1+.2*st.res.moon+.3*countT('luck'));spawnGhost(true)}
 ghosts.slice().forEach(gh=>{const o=gh.o;gh.t+=dt;
  if(gh.gold){gh.life-=dt;if(gh.life<=0){freeGhost(gh);return}}
  if(gh.hunter){ // en cours d'aspiration
   const u=gh.hunter;const k=u.t/u.d;if(k>.6){u.tip.getWorldPosition(_a);o.position.lerp(_a,(k-.6)*dt*6);o.scale.setScalar(gh.sc*(1-(k-.6)*2))}
   o.userData.b.rotation.z=Math.sin(T*25)*.25;o.userData.mouth.scale.set(1.5,2.2,.5)}
  else{o.userData.mouth.scale.set(1.5,1.1,.5);
   const s=Math.min(1,gh.t/.6)*gh.sc;o.scale.setScalar(s);
   _b.copy(gh.tgt).sub(o.position);const d=_b.length();if(d<.4)rTgt(gh.tgt);else o.position.addScaledVector(_b.normalize(),Math.min(d,(gh.gold?4:1.6)*dt));
   o.userData.b.position.y=Math.sin(T*2.5+gh.ph)*.18;o.userData.b.rotation.z=Math.sin(T*1.7+gh.ph)*.15;o.rotation.y=Math.sin(T*.8+gh.ph)*.5;
   if(gh.gold)o.rotation.y+=T*3}
 });
 // chasseurs
 HUN.forEach(u=>{if(u.g&&ghosts.indexOf(u.g)<0){u.g=null;u.t=0}
  if(!u.g){let best=null,bd=1e9;ghosts.forEach(gh=>{if(gh.hunter||gh.gold||gh.t<.6)return;const d=gh.o.position.distanceTo(u.o.position);if(d<bd){bd=d;best=gh}});
   if(best){u.g=best;best.hunter=u;u.t=0;u.d=htime(u.h)}}
  if(u.g){u.t+=dt;faceTo(u,u.g.o.position);aimBeam(u,u.g.o.position,true);if(u.t>=u.d){const gh=u.g;u.g=null;gh.hunter=null;captured(gh,hm(u.h),false)}}
  else{aimBeam(u,null,false);u.o.rotation.y=lerp(u.o.rotation.y,Math.PI+Math.sin(T*.5+u.o.id)*.4,.05);u.gun.rotation.x=lerp(u.gun.rotation.x,.3,.05)}
  u.o.position.y=0})}
function step(dt){
 T+=dt;if(frenzy>0)frenzy-=dt;if(bossCd>0)bossCd-=dt;
 if(fight)updFight(dt);else updGhosts(dt);
 updFX(dt);
 // ambiance : fenêtres qui clignotent, éclairs, nuages, feux follets
 WINM.forEach((m,i)=>{const f=.75+.25*Math.sin(T*(3+i*2.3)+i)*Math.sin(T*7.1+i*3);m.color.copy(LIN(PLACES[st.spot].h.win)).multiplyScalar(Math.random()<.01?.2:f)});
 lightT-=dt;if(lightT<=0){lightT=rnd(18,40);flash();HEMI.intensity=2.5;setTimeout(thunder,rnd(200,900))}HEMI.intensity=lerp(HEMI.intensity,.7,dt*4);
 clouds.forEach(c=>{c.position.x+=dt*2;if(c.position.x>160)c.position.x=-160});
 if(beacon)beacon.rotation.y+=dt*.8;
 const wp=wisps.geometry.attributes.position;for(let i=0;i<wp.count;i++){wp.setY(i,wp.getY(i)+Math.sin(T*1.5+i)*dt*.3);wp.setX(i,wp.getX(i)+Math.cos(T+i*2)*dt*.25)}wp.needsUpdate=true;wisps.material.opacity=.5+.4*Math.sin(T*2);
 YARD.position.set(Math.sin(T*.4)*5,3,HD.d/2+4);
 uiT-=dt;if(uiT<=0){uiT=.2;renderUI()}
 achT-=dt;if(achT<=0){achT=1;chkAch()}
 saveT-=dt;if(saveT<=0){saveT=3;save()}
}
function loop(now){
 let dt=(now-last)/1000;last=now;
 if(dt>2){if(!fight)offline(dt);dt=0}
 step(Math.min(dt,.1));
 cam.lookAt(camT.x+Math.sin(T*.15)*.4,camT.y,camT.z);
 R.render(scene,cam);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body></html>
