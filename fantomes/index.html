<style>
:root{--gf:'Lilita One','Nunito',system-ui,sans-serif;--sp:'Creepster','Lilita One',system-ui,sans-serif;--pu:#7e57c2;--gr:#76ff9a}
html,body{margin:0;height:100%;overflow:hidden;background:#3a2a6a;color:#eee;font-family:'Nunito',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--gf);letter-spacing:.3px;border:0;cursor:pointer;color:inherit}
#top{position:fixed;left:64px;right:64px;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:5}
.money{background:rgba(25,15,50,.88);border-radius:22px;padding:4px 18px 5px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.4),0 0 18px rgba(118,255,154,.25);border:3px solid var(--gr);max-width:100%}
.money b{font-family:var(--gf);font-weight:400;font-size:30px;color:#b9ffcb;line-height:1.1;white-space:nowrap}
.money small{display:block;font-weight:900;font-size:13px;color:#d1c4e9;margin-top:-2px}
#chips{margin-top:6px;display:flex;gap:6px}
#chips span{font-weight:900;font-size:12px;color:#fff;background:rgba(20,10,40,.7);border-radius:999px;padding:3px 10px;white-space:nowrap}
#fz{margin-top:6px;display:none;font-family:var(--gf);font-size:16px;color:#3a2a00;background:linear-gradient(#fff59d,#ffca28);border-radius:999px;padding:3px 12px;box-shadow:0 3px 0 #a07800,0 0 16px #ffd54f}
.side{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:8px;z-index:6}
.side.r{right:10px}.side.l{left:10px}
.side button{position:relative;width:46px;height:46px;border-radius:15px;background:rgba(40,25,75,.92);font-size:23px;box-shadow:0 4px 0 rgba(0,0,0,.45);padding:0;border:2px solid rgba(179,157,219,.5)}

.side button.dot::after{content:'';position:absolute;right:-4px;top:-4px;width:14px;height:14px;border-radius:50%;background:#ff5252;border:2px solid #fff}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(rgba(20,10,45,0),rgba(20,10,45,.6) 40%)}
#info{display:flex;justify-content:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
#info span{font-weight:900;font-size:12px;color:#fff;background:rgba(40,25,75,.8);border-radius:999px;padding:3px 10px}
#info span.w{background:#ff8f00;color:#2a1600}
#bossB{display:none;margin:0 auto 7px;padding:8px 18px;border-radius:16px;font-size:17px;color:#fff;background:linear-gradient(#ab47bc,#6a1b9a);box-shadow:0 4px 0 #3c0d5a,0 0 16px rgba(206,147,216,.6);text-shadow:0 2px 0 rgba(0,0,0,.3);animation:pulse .7s infinite alternate}
#bossB.cd{animation:none;filter:grayscale(.6);opacity:.8}
#buy{display:flex;justify-content:center;gap:6px;margin-bottom:7px}
#buy button{font-size:14px;padding:4px 14px;border-radius:999px;background:rgba(60,40,100,.9);color:#d1c4e9;box-shadow:0 3px 0 rgba(0,0,0,.4)}
#buy button.on{background:var(--gr);color:#063a17}
#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:560px;margin:0 auto}
.up{position:relative;background:#2a1c4e;border-radius:18px;padding:7px 3px 6px;text-align:center;box-shadow:0 5px 0 #0d0820;border-top:5px solid var(--c);overflow:hidden}
.up:active{transform:translateY(3px);box-shadow:0 2px 0 #0d0820}
.up .ic{font-size:26px;line-height:1.1}
.up .nm{font-family:var(--gf);font-size:14px;color:#fff;line-height:1.1}
.up .lv{font-size:11px;font-weight:800;color:#b39ddb}
.up .ef{font-size:11px;font-weight:900;color:#80deea;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .pr{position:relative;margin-top:4px;border-radius:11px;background:#43356a;color:#b0a4cc;font-family:var(--gf);font-size:14px;padding:4px 2px;overflow:hidden;white-space:nowrap}

.up.max .pr{background:#ffd54f;color:#5a3700;font-size:12px}
.up.no{animation:shake .3s}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%) scale(.9);z-index:30;background:#2a1c4e;color:#fff;font-family:var(--gf);font-size:17px;padding:8px 16px;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.4);border:3px solid var(--gr);opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:78vw}
#toast.on{opacity:1;transform:translateX(-50%) scale(1)}
.ft{position:fixed;z-index:4;pointer-events:none;font-family:var(--gf);font-size:18px;color:#b9ffcb;text-shadow:0 2px 0 #0b3d1c,0 0 8px rgba(0,0,0,.6);transform:translate(-50%,-50%);animation:ft 1.1s ease-out forwards;white-space:nowrap;text-align:center}
.ft.big{font-size:26px;color:#ffe066;text-shadow:0 3px 0 #7a4a00,0 0 10px rgba(0,0,0,.5)}
.ft.ec{color:#80ffea}
.ft small{display:block;font-size:12px;color:#e1d5ff}
@keyframes ft{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-70px}}
.pop{position:fixed;inset:0;z-index:40;background:rgba(5,2,15,.7);display:none;align-items:center;justify-content:center;padding:14px}
.pop.on{display:flex}
.pop>div{position:relative;background:#22173f;border-radius:24px;padding:16px 14px;max-width:440px;width:100%;max-height:82vh;overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.5),0 0 30px rgba(126,87,194,.4);border:4px solid var(--pu);touch-action:pan-y;box-sizing:border-box}
.pop h2{margin:0 34px 10px;font-family:var(--gf);font-weight:400;font-size:23px;color:var(--gr);text-align:center}
.pop p{margin:8px 0;font-weight:700;color:#d6cdee;text-align:center}
.pop b{color:#fff}
.x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:#ef5350;color:#fff;font-size:18px;box-shadow:0 3px 0 #b71c1c}
.bb{display:block;width:100%;margin-top:10px;padding:12px;border-radius:16px;font-size:19px;background:linear-gradient(#69f08f,#1f9e48);color:#04260f;box-shadow:0 4px 0 #0c5a25}
.bb:disabled{filter:grayscale(1);opacity:.5}
.bb.r{background:linear-gradient(#ef5350,#c62828);color:#fff;box-shadow:0 4px 0 #8e1b1b;font-size:16px}
.bb.b{background:linear-gradient(#9575cd,#5e35b1);color:#fff;box-shadow:0 4px 0 #311b92;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fc{background:#30245a;border-radius:14px;padding:7px 3px;text-align:center}
.fc .e{width:44px;height:44px;margin:0 auto 3px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:3px solid #fff;box-shadow:0 0 10px var(--g,transparent)}
.fc b{display:block;font-size:12px;font-weight:900;color:#fff;line-height:1.1}
.fc small{display:block;font-size:10.5px;font-weight:700;color:#b39ddb;line-height:1.25}
.fc .st{color:#ffd54f;font-size:12px;letter-spacing:-1px;min-height:14px}
.fc.lock{background:#1c1535}.fc.lock .e{background:#4a4066;color:#aaa;font-family:var(--gf)}
.fc.boss{background:linear-gradient(#4a1f5e,#2e1446);grid-column:span 3}
.tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:8px;padding-bottom:3px}
.tabs button{flex:none;padding:6px 10px;border-radius:12px;background:#3a2d63;font-size:13px;color:#b39ddb}
.tabs button.on{background:var(--pu);color:#fff}
.row{display:flex;align-items:center;gap:10px;background:#30245a;border-radius:16px;padding:9px 10px;margin:7px 0}
.row .ri{font-size:28px;width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:13px;background:#1c1535;position:relative}
.row .rt{flex:1;min-width:0;font-weight:900;font-size:14px;color:#fff}
.row .rt small{display:block;font-weight:700;font-size:11.5px;color:#b39ddb}
.row .rt em{display:block;font-style:normal;font-weight:800;font-size:11.5px;color:#80deea}
.row button{flex:none;min-width:86px;padding:8px 8px;border-radius:13px;font-size:14px;background:linear-gradient(#69f08f,#1f9e48);color:#04260f;box-shadow:0 3px 0 #0c5a25}
.row button:disabled{background:#4a4066;color:#8d84a8;box-shadow:0 3px 0 #1c1535}
.row button.mx{background:#ffd54f;color:#5a3700;box-shadow:0 3px 0 #c49000}
.row.cur{outline:3px solid var(--gr)}
.row.lock{opacity:.55}
.sec{background:#2c2152;border-radius:16px;padding:10px;margin:10px 0}
.sec h3{margin:0;font-family:var(--gf);font-weight:400;color:var(--gr);font-size:19px}
.stars{color:#ffd54f;font-size:11px;letter-spacing:-1px}
.trait{display:inline-block;font-size:11px;font-weight:900;border-radius:8px;padding:1px 6px;margin-left:3px;color:#120c24}
#fight{position:fixed;inset:0;z-index:20;display:none;touch-action:none}

#fight .fb{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;pointer-events:none}

.hpb{height:18px;border-radius:10px;background:rgba(0,0,0,.5);border:3px solid #fff;overflow:hidden;margin:4px auto 0;max-width:340px}
.hpb i{display:block;height:100%;width:100%;background:linear-gradient(#ce93d8,#7b1fa2);transition:width .1s}
#fInfo{display:block;margin-top:4px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6);font-size:14px}
#fHelp{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);text-align:center;font-family:var(--gf);font-size:19px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.6);pointer-events:none}
#cross{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:4px solid var(--gr);box-shadow:0 0 14px var(--gr),inset 0 0 14px var(--gr);pointer-events:none;display:none}

#cross::before{width:4px;height:20px}#cross::after{width:20px;height:4px}
#cross.on{border-color:#ffeb3b;box-shadow:0 0 22px #ffeb3b,inset 0 0 14px #ffeb3b;animation:pulse .15s infinite alternate}
#beam{position:absolute;height:12px;margin-top:-6px;transform-origin:0 50%;border-radius:6px;background:linear-gradient(rgba(118,255,154,0),rgba(200,255,215,.95),rgba(118,255,154,0));box-shadow:0 0 18px var(--gr);pointer-events:none;display:none}
body.fighting #top,body.fighting .side,body.fighting #bottom{display:none}
#upd{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:60;display:none;align-items:center;gap:10px;background:#22173f;border-radius:16px;padding:10px 12px;font-weight:900;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.5);border:3px solid var(--gr)}
#upd.on{display:flex}#upd>div{flex:1}#upd small{display:block;font-weight:700;color:#b39ddb;font-size:13px}
#upd button{padding:9px 12px;border-radius:12px;background:linear-gradient(#69f08f,#1f9e48);color:#04260f;font-size:15px}
#enq{display:block;margin:0 auto 7px;padding:7px 14px;border-radius:14px;font-size:15px;color:#fff;background:linear-gradient(#5c6bc0,#303f9f);box-shadow:0 4px 0 #1a237e;max-width:96%}
#enq.ang{background:linear-gradient(#ef5350,#b71c1c);box-shadow:0 4px 0 #6d0f0f}
#enq.ok{background:linear-gradient(#66bb6a,#2e7d32);box-shadow:0 4px 0 #1b5e20}
#enq.go{animation:pulse .6s infinite alternate}
.cl{display:inline-block;min-width:26px;padding:2px 4px;margin:1px;border-radius:8px;background:#1c1535;font-size:15px;text-align:center}
.cl.on{background:#2e7d32;box-shadow:0 0 0 2px #76ff9a}
.cl.no{background:#5d1a1a;opacity:.6}
.row.out{opacity:.38}
.var{display:inline-block;font-size:10.5px;font-weight:900;border-radius:7px;padding:1px 5px;margin:2px 2px 0 0;background:#1c1535;color:#8d84a8}
.var.got{color:#120c24}
#dark{position:absolute;inset:0;pointer-events:none;display:none}
#fWarn{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--gf);font-size:26px;color:#fff;text-shadow:0 3px 0 #4a148c,0 0 14px #e040fb;pointer-events:none;display:none;padding:0 10px}
#flash{position:fixed;inset:0;z-index:3;background:var(--fl,#e8eaff);opacity:0;pointer-events:none;transition:opacity .08s}
</style></head><body>

$('bossB').onclick=()=>{if(bossCd>0){toast('Le boss reprend des forces… '+Math.ceil(bossCd)+' s');return}openBoss()};

// Lieux
function goPlace(i){st.spot=i;ghosts.slice().forEach(freeGhost);buildPlace();renderUI();save();toast(PLACES[i].ic+' Bienvenue : <b>'+PLACES[i].n+'</b> !');snd(220,.6,'sine',.06,440)}
function openMap(){let h='<h2>🏚️ Lieux hantés</h2><p><small>Chaque lieu a ses propres améliorations. Bats le boss pour débloquer le suivant.</small></p>';
 PLACES.forEach((P,i)=>{const lock=i>st.maxSpot,cur=i===st.spot;let got=0;P.pool.forEach(t=>{if(typeN(t))got++});
  h+='<div class="row '+(cur?'cur':'')+(lock?' lock':'')+'"><div class="ri">'+(lock?'🔒':P.ic)+'</div><div class="rt">'+(lock?'???':P.n)+'<small>'+(lock?'Bats le boss précédent':'👻 '+got+'/'+NG+' fantômes · '+P.boss.n+' '+(st.bc[i]>0?'✅':'❌'))+'</small>'+(lock?'':'<em>Fantôme commun : '+fmt(BASE(i))+' €</em>')+'</div>'+
  (lock?'':cur?'<button disabled>Ici</button>':'<button data-go="'+i+'">🚐 Aller</button>')+'</div>'});

// Équipe
function tTag(t){const T0=TRAITS[t];return '<span class="trait" style="background:'+hex(T0.c)+'">'+T0.ic+' '+T0.n+'</span>'}
function openTeam(){let h='<h2>👥 Ton équipe</h2>';
 st.hun.forEach((x,i)=>{const c=hLvCost(x.lv,x.s);h+='<div class="row"><div class="ri">'+TRAITS[x.t].ic+'</div><div class="rt">'+x.nm+' '+tTag(x.t)+'<small><span class="stars">'+'★'.repeat(x.s+1)+'</span> · Niv. '+x.lv+' · ×'+hm(x).toFixed(1).replace('.',',')+' argent</small><em>'+TRAITS[x.t].d+'</em></div><button data-up="'+i+'" '+(st.m>=c?'':'disabled')+'>⬆️ '+fmt(c)+' €</button></div>'});
 if(st.hun.length<HIRE.length){const pr=HIRE[st.hun.length];h+='<div class="sec"><h3>📋 Recruter ('+st.hun.length+'/'+HIRE.length+')</h3><p><small>Chaque chasseur capture en même temps que les autres. Choisis ton candidat :</small></p>';
  st.cand.forEach((x,i)=>{h+='<div class="row"><div class="ri">'+TRAITS[x.t].ic+'</div><div class="rt">'+x.nm+' '+tTag(x.t)+'<small><span class="stars">'+'★'.repeat(x.s+1)+'</span> ×'+hm(x).toFixed(2).replace('.',',')+'</small><em>'+TRAITS[x.t].d+'</em></div><button data-hire="'+i+'" '+(st.m>=pr?'':'disabled')+'>'+fmt(pr)+' €</button></div>'});
  h+='<button class="bb b" id="bReroll" '+(st.ecto>=1?'':'disabled')+'>🔄 Autres candidats (1 🧪)</button></div>'}
 else h+='<p>✅ Ton équipe est au complet !</p>';
 pop(h);
 document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const x=st.hun[+b.dataset.up],c=hLvCost(x.lv,x.s);if(st.m<c)return;st.m-=c;x.lv++;snd(700,.1,'triangle',.06,1200);openTeam();renderUI()});
 document.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>{const pr=HIRE[st.hun.length];if(st.m<pr)return;st.m-=pr;const x=st.cand[+b.dataset.hire];st.hun.push(x);st.cand=[newCand(),newCand(),newCand()];placeHunters();jingle([523,784,1046]);toast('🎉 <b>'+x.nm+'</b> rejoint l’équipe !');openTeam();renderUI();save()});
 if($('bReroll'))$('bReroll').onclick=()=>{if(st.ecto<1)return;st.ecto--;st.cand=[newCand(),newCand(),newCand()];openTeam();renderUI()}}
$('bTeam').onclick=openTeam;

// Labo
function openLab(){let h='<h2>🧪 Labo</h2><p>Ectoplasme : <b>'+fmt(st.ecto)+' 🧪</b><br><small>Il tombe des fantômes rares, des variantes, des boss, des enquêtes et des esprits de lune.</small></p>';
 RES.forEach(r=>{const l=st.res[r.k],c=resCost(r,l),mx=l>=r.mx;h+='<div class="row"><div class="ri">'+r.ic+'</div><div class="rt">'+r.n+' <small>Niv. '+l+(r.k==='van'?' · '+vanH(l)+' h':'')+'</small><em>'+r.d+'</em></div>'+(mx?'<button class="mx" disabled>MAX</button>':'<button data-r="'+r.k+'" '+(st.ecto>=c?'':'disabled')+'>'+c+' 🧪</button>')+'</div>'});
 pop(h);document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=RES.find(x=>x.k===b.dataset.r),c=resCost(r,st.res[r.k]);if(st.ecto<c)return;st.ecto-=c;st.res[r.k]++;snd(500,.3,'sine',.07,1500);openLab();renderUI();save()})}
$('bLab').onclick=openLab;

// Musée
let colTab=0;
function openCol(t){if(t!==undefined)colTab=t;const f=colTab;
 let h='<h2>🏛️ Musée</h2><div class="tabs">'+FAM.map((F,i)=>'<button data-t="'+i+'" class="'+(i===f?'on':'')+'">'+F[0]+' '+F[1]+'</button>').join('')+'<button data-t="5" class="'+(f===5?'on':'')+'">👑 Boss</button></div>';
 if(f<5){h+='<p><small>'+FAM[f][1]+' : '+FAM[f][2]+'.<br>★ = +2 % d’argent (1, 50, 500 captures) · chaque variante trouvée = +3 %</small></p>';
  GT.forEach((G0,t)=>{if(G0.f!==f)return;const n=typeN(t),s=starsOf(n),where=PLACES.map((P,i)=>P.pool.indexOf(t)>=0?P.ic:'').join('');
   h+='<div class="row'+(n?'':' lock')+'"><div class="ri" style="background:'+(n?hex(G0.dark?0x3a2a5c:G0.c):'#1c1535')+'">'+(n?'👻':'?')+'</div><div class="rt">'+(n?G0.n:'???')+' <span class="stars">'+'★'.repeat(s)+'☆'.repeat(3-s)+'</span><small>'+G0.d+'</small>'+
   '<small>Indices : '+clIc(G0.cl)+' · Faiblesse : '+G0.w+'</small><small>Où : '+where+(n?' · capturé ×'+fmt(n):'')+'</small><div>'+VAR.map((V,v)=>{const c=musN(t,v);return '<span class="var'+(c?' got':'')+'" style="'+(c?'background:'+V.c:'')+'">'+V.ic+' '+(c?V.n+' ×'+fmt(c):'???')+'</span>'}).join('')+'</div></div></div>'})}
 else{h+='<div class="grid">';PLACES.forEach((P,i)=>{const bc=st.bc[i]||0;h+='<div class="fc"><div class="e" style="background:'+hex(P.boss.c)+';--g:'+hex(P.boss.c)+'">'+(bc?'👑':'?')+'</div><b>'+(bc?P.boss.n:'???')+'</b><small>'+P.ic+' '+(bc?'Vaincu '+bc+' fois':'Pas encore vaincu')+'</small></div>'});h+='</div>'}
 pop(h);document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>openCol(+b.dataset.t))}
$('bCol').onclick=()=>openCol();

// Succès
const ACH=[
 ['🪤','Première capture',()=>st.caps>=1],['👻','100 fantômes',()=>st.caps>=100],['👻','1 000 fantômes',()=>st.caps>=1000],['💀','10 000 fantômes',()=>st.caps>=1e4],['☠️','100 000 fantômes',()=>st.caps>=1e5],
 ['👥','Équipe de 3',()=>st.hun.length>=3],['👥','Équipe de 5',()=>st.hun.length>=5],['🏢','Équipe complète',()=>st.hun.length>=8],
 ['📓','Première enquête',()=>st.enq>=1],['🕵️','10 enquêtes',()=>st.enq>=10],['🔍','100 enquêtes',()=>st.enq>=100],
 ['👑','Premier boss',()=>st.bc.some(x=>x>0)],['🗼','3 lieux nettoyés',()=>st.bc.filter(x=>x>0).length>=3],['🏝️','La Reine vaincue',()=>st.bc[4]>0],
 ['🌕','Esprit de lune',()=>st.moon>=1],['🟡','Variante dorée',()=>GT.some((g,t)=>musN(t,1))],['🌈','Variante arc-en-ciel',()=>GT.some((g,t)=>musN(t,2))],['💎','Variante cristal',()=>GT.some((g,t)=>musN(t,3))],
 ['🏛️','Les 15 fantômes',()=>GT.every((g,t)=>typeN(t)>0)],
 ['💰','Millionnaire',()=>st.life>=1e6],['💎','Milliardaire',()=>st.life>=1e9],['🤑','1 000 milliards',()=>st.life>=1e12],['🏪','Première franchise',()=>st.fr>=1],
];
function chkAch(){ACH.forEach((a,i)=>{if(st.ach.indexOf(i)<0&&a[2]()){st.ach.push(i);toast('🏆 Succès : <b>'+a[1]+'</b><br><small>+2 % d’argent pour toujours</small>');jingle([784,988,1175])}})}

// Plus + Franchise
function openMore(){const g=badgeGain(st.run),ok=st.maxSpot>=2;
 pop('<h2>⭐ Plus</h2>'+
 '<div class="sec"><h3>🏪 Ouvrir une franchise</h3><p>Tu ouvres une agence dans une nouvelle ville : tu repars du premier lieu, mais tu gagnes des <b>badges 🎖️</b>. Chaque badge = <b>+10 % d’argent pour toujours</b>. Tu gardes ton équipe (niveaux remis à 0), le labo, l’ectoplasme, le musée et les succès.</p>'+
 (ok?'<p>Badges : <b>🎖️ '+st.badges+'</b> · tu gagnerais <b>+'+g+'</b>'+(g?'':'<br><small>(1er badge à '+fmt(1e9)+' € gagnés, déjà '+fmt(st.run)+' €)</small>')+'</p>':'<p><small>Disponible après avoir battu <b>la Sorcière du Marais</b>.</small></p>')+
 '<button class="bb" id="bFr" '+(ok&&g?'':'disabled')+'>🏪 Ouvrir la franchise (+'+g+' 🎖️)</button></div>'+
 '<div class="sec"><h3>🏆 Succès ('+st.ach.length+'/'+ACH.length+')</h3><p style="text-align:left;font-size:13px">'+ACH.map((a,i)=>(st.ach.indexOf(i)>=0?a[0]+' <b>':'<span style="opacity:.45">🔒 ')+a[1]+(st.ach.indexOf(i)>=0?'</b>':'</span>')).join('<br>')+'</p></div>'+
 '<div class="sec"><h3>📊 Statistiques</h3><p style="text-align:left">Argent gagné en tout : <b>'+fmt(st.life)+' €</b><br>Fantômes capturés : <b>'+fmt(st.caps)+'</b><br>Enquêtes résolues : <b>'+st.enq+'</b><br>Boss vaincus : <b>'+st.bc.reduce((a,b)=>a+(b||0),0)+'</b><br>Esprits de lune : <b>'+st.moon+'</b><br>Bonus total : <b>×'+gainMult(false).toFixed(2).replace('.',',')+'</b> (labo, badges, musée, succès)</p></div>'+
 '<button class="bb b" id="bSnd">'+(st.snd?'🔊 Son : activé':'🔇 Son : coupé')+'</button>'+
 '<button class="bb b" id="bHelp">❓ Comment jouer</button>'+
 '<button class="bb b" id="bUpd">🔄 Vérifier les mises à jour</button>'+
 '<button class="bb r" id="bRst">🗑️ Recommencer à zéro</button><p><small>Version '+APPV+'</small></p>');
 $('bFr').onclick=()=>{const g=badgeGain(st.run);if(!g||!ok)return;if(!confirm('Ouvrir une franchise ? Ton argent, tes améliorations et tes lieux repartent à zéro.'))return;
  st.badges+=g;st.fr++;st.m=0;st.run=0;st.lvs=[];st.spot=0;st.maxSpot=0;st.bc=[];st.hun.forEach(h=>h.lv=0);bossCd=0;
  ghosts.slice().forEach(freeGhost);buildPlace();closePop();renderUI();save();toast('🏪 Nouvelle franchise ! <b>+'+g+' 🎖️</b>');jingle([523,659,784,1046])};
 $('bSnd').onclick=()=>{st.snd=st.snd?0:1;save();openMore()};
 $('bHelp').onclick=help;
 $('bUpd').onclick=()=>chkUpd(true);
 $('bRst').onclick=()=>{if(confirm('Effacer toute ta partie ?')){try{localStorage.removeItem(KEY)}catch(e){}window.__rst=1;location.reload()}}}
$('bMore').onclick=openMore;
function help(){pop('<h2>❓ Comment jouer</h2><p style="text-align:left">👻 Les fantômes sortent des fenêtres. Tes <b>chasseurs</b> les aspirent tout seuls et tu gagnes de l’argent.<br><br>👆 <b>Touche un fantôme</b> pour l’attraper toi-même : ça rapporte <b>×2</b> !<br><br>📓 <b>Enquête</b> : ton équipe trouve des indices (💡 ❄️ 🎙️ 🟣 📦 📼). Ouvre le carnet et devine <b>qui hante la maison</b>. Bonne réponse = gros bonus. Mauvaise arme = le fantôme s’énerve !<br><br>🌕 Un <b>esprit de lune</b> passe parfois : touche-le vite pour la <b>Pleine lune</b> (×3 pendant 20 s).<br><br>🟡🌈💎 Les <b>variantes rares</b> valent beaucoup plus et remplissent ton <b>musée</b> 🏛️.<br><br>🪤 Pièges = plus d’argent · ⚡ Aspirateur = captures plus rapides · 🕯️ Encens = plus de fantômes · 📡 Détecteur = plus de rares.<br><br>👥 Recrute des chasseurs et choisis bien leur spécialité.<br><br>👑 Bats le <b>boss</b> du lieu pour débloquer le suivant.</p><button class="bb" id="bOk">C’est parti !</button>');$('bOk').onclick=closePop}

// Gains pendant l'absence
function offline(sec){const lim=vanH(st.res.van)*3600,s=Math.min(sec,lim),g=income(false)*s;if(g<=0)return;earn(g);
 if(sec>=60){pop('<h2>👋 Bon retour !</h2><p>Ton équipe a chassé pendant <b>'+fmtH(s/3600)+'</b>'+(sec>lim?'<br><small>(le van n’a que '+fmtH(lim/3600)+' d’essence : améliore 🚐 Grand van au labo !)</small>':'')+'</p><p style="font-family:var(--gf);font-size:30px;color:#b9ffcb">+'+fmt(g)+' €</p><button class="bb" id="bOk">💰 Récupérer</button>');
  $('bOk').onclick=()=>{closePop();snd(660,.1,'triangle',.1,1320)}}save()}

// Mises à jour
let SWR=null;
function chkUpd(man){fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
 if(!j||!j.v||j.v===APPV){if(man)toast('Le jeu est à jour ✓');return}closePop();$('updn').textContent=j.notes||'';$('upd').classList.add('on')}).catch(()=>{if(man)toast('Pas de connexion')})}
$('updB').onclick=()=>{try{SWR&&SWR.update()}catch(e){}setTimeout(()=>location.reload(),300)};
if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js?v='+APPV).then(r=>{SWR=r}).catch(()=>{})});
setInterval(()=>chkUpd(false),5*60e3);setTimeout(()=>chkUpd(false),4000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(fight)fight.hold=false;save()}else chkUpd(false)});
addEventListener('pagehide',save);

const camT=new V3();
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?62:45;cam.updateProjectionMatrix();
 const vf=cam.fov*Math.PI/180,hf=2*Math.atan(Math.tan(vf/2)*cam.aspect),need=HD.fw*(w<h?.82:1)+4,needH=Math.min(HD.fh,13)+8;
 let d=Math.max(need/2/Math.tan(hf/2),needH/2/Math.tan(vf/2),19);d=Math.min(d,60);
 camT.set(HD.cx*.6,HD.fh*.38+(w<h?-1.2:.8),HD.d/2+2);cam.position.set(camT.x,camT.y+d*.28,camT.z+d)}
addEventListener('resize',resize);

// ===================== Boucle =====================
buildCards();buildPlace();renderUI();
(()=>{const s=(Date.now()-(st.t||Date.now()))/1000;if(s>5)offline(s)})();
if(!st.life)setTimeout(help,600);
let T=0,last=performance.now(),uiT=0,saveT=0,achT=1,spT=0,moonT=rnd(40,70),lightT=rnd(15,30);
function updGhosts(dt){const L=lv();
 spT-=dt;if(spT<=0){spT=spnT(L.spn)*rnd(.7,1.3);if(ghosts.filter(g=>!g.moon).length<maxG(L.spn))spawnGhost(false)}
 moonT-=dt;if(moonT<=0){moonT=rnd(60,120)/(1+.2*st.res.moon+.3*countT('luck'));spawnGhost(true)}
 ghosts.slice().forEach(gh=>{const o=gh.o;gh.t+=dt;
  if(gh.moon){gh.life-=dt;if(gh.life<=0){freeGhost(gh);return}}
  if(gh.v===2)o.userData.body.forEach(p=>p.material.color.setHSL((T*.4)%1,.9,.7));
  if(gh.hunter){const u=gh.hunter;const k=u.t/u.d;if(k>.6){u.tip.getWorldPosition(_a);o.position.lerp(_a,(k-.6)*dt*6);o.scale.setScalar(gh.sc*(1-(k-.6)*2))}
   o.userData.b.rotation.z=Math.sin(T*25)*.25;o.userData.mouth.scale.set(1.5,2.2,.5)}
  else{o.userData.mouth.scale.set(1.5,1.1,.5);
   const s=Math.min(1,gh.t/.6)*gh.sc;o.scale.setScalar(s);
   _b.copy(gh.tgt).sub(o.position);const d=_b.length();if(d<.4)rTgt(gh.tgt);else o.position.addScaledVector(_b.normalize(),Math.min(d,(gh.moon?4:1.6)*gh.fast*(angry>0?2.2:1)*dt));
   o.userData.b.position.y=Math.sin(T*2.5+gh.ph)*.18;o.userData.b.rotation.z=Math.sin(T*1.7+gh.ph)*.15;o.rotation.y=Math.sin(T*.8+gh.ph)*.5;
   if(gh.moon)o.rotation.y+=T*3;if(GT[gh.ty].spark&&Math.random()<dt*3)burst(o.position,0xfff35c,2)}
 });
 HUN.forEach(u=>{if(u.g&&ghosts.indexOf(u.g)<0){u.g=null;u.t=0}
  if(!u.g){let best=null,bd=1e9;ghosts.forEach(gh=>{if(gh.hunter||gh.moon||gh.t<.6)return;const d=gh.o.position.distanceTo(u.o.position);if(d<bd){bd=d;best=gh}});
   if(best){u.g=best;best.hunter=u;u.t=0;u.d=htime(u.h)}}
  if(u.g){u.t+=dt;faceTo(u,u.g.o.position);aimBeam(u,u.g.o.position,true);animHunter(u,true);if(u.t>=u.d){const gh=u.g;u.g=null;gh.hunter=null;captured(gh,hm(u.h),false)}}
  else{aimBeam(u,null,false);animHunter(u,false);u.o.rotation.y=lerp(u.o.rotation.y,Math.PI+Math.sin(T*.5+u.ph)*.4,.05);u.gun.rotation.x=lerp(u.gun.rotation.x,.3,.05)}})}
function step(dt){
 T+=dt;if(frenzy>0)frenzy-=dt;if(bossCd>0)bossCd-=dt;if(buff>0)buff-=dt;if(angry>0)angry-=dt;
 if(fight)updFight(dt);else{updGhosts(dt);updEnq(dt)}
 updFX(dt);
 const dim=fight&&fight.dark>0?.05:1;
 WINM.forEach((m,i)=>{const f=.8+.2*Math.sin(T*(3+i*2.3)+i)*Math.sin(T*7.1+i*3);m.color.copy(LIN(PLACES[st.spot].h.win)).multiplyScalar((Math.random()<.01?.25:f)*dim)});
 lightT-=dt;if(lightT<=0){lightT=rnd(20,45);flash();HEMI.intensity=3;setTimeout(thunder,rnd(200,900))}HEMI.intensity=lerp(HEMI.intensity,1.15,dt*4);
 clouds.forEach(c=>{c.position.x+=dt*2;if(c.position.x>160)c.position.x=-160});
 if(beacon)beacon.rotation.y+=dt*.8;
 const wp=wisps.geometry.attributes.position;for(let i=0;i<wp.count;i++){wp.setY(i,wp.getY(i)+Math.sin(T*1.5+i)*dt*.3);wp.setX(i,wp.getX(i)+Math.cos(T+i*2)*dt*.25)}wp.needsUpdate=true;wisps.material.opacity=.5+.4*Math.sin(T*2);
 YARD.position.set(Math.sin(T*.4)*5,3,HD.d/2+4);
 uiT-=dt;if(uiT<=0){uiT=.2;renderUI()}
 achT-=dt;if(achT<=0){achT=1;chkAch()}
 saveT-=dt;if(saveT<=0){saveT=3;save()}
}
function loop(now){
 let dt=(now-last)/1000;last=now;
 if(dt>2){if(!fight)offline(dt);dt=0}
 step(Math.min(dt,.1));
 cam.lookAt(camT.x+Math.sin(T*.15)*.4,camT.y,camT.z);
 R.render(scene,cam);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body></html>
