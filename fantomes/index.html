 else if(h.phase==='plan'){const nC=h.dev.filter(d=>d.k==='cam').length,nM=h.dev.filter(d=>d.k==='mic').length,nT=h.dev.filter(d=>d.k==='th').length;

 else if(h.phase==='hunt'&&curRoom<0){const left=h.rooms.filter(r=>r.g&&!r.g.cap).length;

   (g&&g.boss&&!g.cap?'':'<div class="tools">'+toolBtn('obs','👀','Observer',true)+toolBtn('mic','🎙️','Micro',st.eq.mic>0)+toolBtn('th','🌡️','Thermo',st.eq.th>0)+toolBtn('uv','🟣','Lampe UV',st.eq.lamp>0)+'</div>')+

 else if(h.phase==='fix'){

 pc.innerHTML=html;bindPanel();renderTop()}
function toolBtn(k,ic,n,ok){return '<button class="tool'+(scan&&scan.k===k?' on':'')+'" data-t="'+k+'" '+(ok?'':'disabled')+'><span class="i">'+ic+'</span>'+(ok?n:'à acheter')+'</button>'}

function bindPanel(){const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('nPrev',()=>{camX=Math.max(0,Math.round(camX/DX)*DX-DX);renderPanel()});on('nNext',()=>{camX=Math.min(5*DX,Math.round(camX/DX)*DX+DX);renderPanel()});
 on('bGoH',goHouse);on('bNight',startNight);on('bSkip',()=>{st.h.phase='hunt';setLight();updDevSprites();updRoomLabels();renderPanel()});
 on('bClr',()=>{st.h.dev=[];updDevSprites();renderPanel()});on('bFast',()=>{if(night)night.fast=true});
 on('bCar',()=>openCarnet(-1));on('bReN',()=>{st.h.phase='plan';setLight();updDevSprites();updRoomLabels();renderPanel()});
 on('bArm',()=>openCarnet(curRoom));on('bOut',leaveRoom);on('bFix',openFix);on('bSell',sell);
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{devSel=b.dataset.d;renderPanel()});
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>startScan(b.dataset.t))}

function placeDev(i){const h=st.h,k=devSel,mx=k==='cam'?camN():k==='mic'?micN():thN();if(!mx)return;
 const ex=h.dev.findIndex(d=>d.k===k&&d.r===i);if(ex>=0)h.dev.splice(ex,1);else{if(h.dev.filter(d=>d.k===k).length>=mx)h.dev.splice(h.dev.findIndex(d=>d.k===k),1);h.dev.push({k,r:i})}
 snd(800,.06,'square',.04);updDevSprites();renderPanel()}
function startNight(){const h=st.h;if(!h.dev.length){toast('Pose au moins une caméra 📷');return}h.phase='night';h.nights++;setLight();
 night={t:0,fast:false,tiles:h.dev.map(d=>({d,last:'…',ev:0})),thDone:{}};
 if(st.tm.med){h.rooms.forEach((r,i)=>{if(r.g&&!r.g.cap&&Math.random()<.35+.13*st.tm.med){h.cn[i].p=true;if(r.g.boss)h.cn[i].boss=1}});toast('🔮 Le médium sent des présences…')}
 $('mon').style.display='block';drawTiles();renderPanel();updRoomLabels();sfx.door()}
function drawTiles(){const h=st.h;$('tiles').innerHTML=night.tiles.map(t=>'<div class="tile'+(t.ev>0?(t.scary?' scary':' ev'):'')+'"><b>'+DEVI[t.d.k]+' '+h.rooms[t.d.r].nm+'</b>'+t.last+'</div>').join('');
 const hh=Math.floor(22+night.t/NIGHT*8)%24,mm=Math.floor((night.t/NIGHT*8*60)%60);$('clock').textContent='🌙 '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')}
function nightEvent(j,txt,scary){const t=night.tiles[j];t.last=txt;t.ev=1.2;t.scary=scary;const o=roomObjs[t.d.r];
 if(scary){sfx.scare();flash('#ff1744',.35);shakeT=.4}else if(Math.random()<.5)sfx.door();else snd(rnd(200,400),.3,'sine',.05,rnd(100,200));
 const r=st.h.rooms[t.d.r];if(r.g&&t.d.k==='cam'){if(r.g.boss)skinBoss(SHADE,LIEUX[st.h.L].boss);else skinGhost(SHADE,r.g.ty,r.g.v);SHADE.visible=true;SHADE.scale.setScalar(r.g.boss?1.6:.9);SHADE.position.copy(o.p).add(HOME).add(new V3(rnd(-1.5,1.5),1.4,rnd(-1,1)));SHADE.userData.t=.7}
 o.bulb.material.color.setRGB(.2,.2,.2);setTimeout(()=>o.bulb.material.color.copy(LIN(0xfff0c0)),300);drawTiles()}
function updNight(dt){const h=st.h,n=night,rate=1+.25*st.tm.tec+.15*st.eq.cam,k=n.fast?6:1;n.t+=dt*k;
 n.tiles.forEach((t,j)=>{t.ev-=dt;const r=h.rooms[t.d.r],g=r.g&&!r.g.cap?r.g:null,cn=h.cn[t.d.r],cl=g&&!g.boss?GT[g.ty].cl:'';
  if(t.d.k==='th'){if(!n.thDone[j]&&n.t>2){n.thDone[j]=1;if(g&&(g.boss||cl.indexOf('F')>=0)){nightEvent(j,'❄️ La température chute : '+Math.floor(rnd(-4,4))+' °C !');if(!g.boss)addF(cn,'F')}else{t.last='🌡️ 19 °C, normal';if(g)addX(cn,'F')}}return}
  if(!g)return;const p=dt*k*(t.d.k==='cam'?.32*rate:.28);if(Math.random()>p)return;
  if(g.boss){nightEvent(j,'👁️ Quelque chose de TRÈS GROS bouge…',true);cn.p=true;cn.boss=1;return}
  if(t.d.k==='cam'){const ev=['p','p'];if(cl.indexOf('L')>=0)ev.push('L','L');if(cl.indexOf('O')>=0)ev.push('O','O');const e=pick(ev);cn.p=true;
   if(e==='L'){addF(cn,'L');nightEvent(j,'💡 Les lumières clignotent !')}else if(e==='O'){addF(cn,'O');nightEvent(j,'📦 Un objet bouge tout seul !')}else nightEvent(j,pick(['🚪 Une porte claque !','👤 Une silhouette passe…']),Math.random()<.08)}
  else{const ev=[];if(cl.indexOf('M')>=0)ev.push('M');if(cl.indexOf('V')>=0&&st.eq.mic>=2)ev.push('V');if(!ev.length)return;const e=pick(ev);addF(cn,e);if(e==='M')nightEvent(j,'🎙️ Toc… toc… toc… dans les murs');else nightEvent(j,'📼 Une voix : « va-t’en… »',Math.random()<.3)}});
 if(SHADE.visible){SHADE.userData.t-=dt;SHADE.userData.b.position.y=Math.sin(T*6)*.1;if(SHADE.userData.t<=0)SHADE.visible=false}
 if(n.t>=NIGHT)endNight()}
function endNight(){const h=st.h;h.dev.forEach(d=>{const r=h.rooms[d.r],g=r.g&&!r.g.cap?r.g:null,cn=h.cn[d.r];
  if(d.k==='cam'){if(g){cn.p=true;if(g.boss)cn.boss=1;else{const cl=GT[g.ty].cl;'LO'.split('').forEach(c=>cl.indexOf(c)>=0?addF(cn,c):addX(cn,c))}}else if(cn.p!==true)cn.p=false}
  if(d.k==='mic'&&g&&!g.boss){const cl=GT[g.ty].cl;['M'].concat(st.eq.mic>=2?['V']:[]).forEach(c=>cl.indexOf(c)>=0?addF(cn,c):addX(cn,c))}});
 night=null;SHADE.visible=false;$('mon').style.display='none';h.phase='hunt';setLight();updDevSprites();updRoomLabels();renderPanel();save();
 toast('🌅 Le matin se lève.<br>Pièces hantées repérées : <b>'+h.cn.filter(c=>c.p===true).length+'</b>');snd(523,.4,'triangle',.07,784)}

function showRooms(){roomObjs.forEach((o,j)=>{o.g.visible=curRoom<0||j===curRoom;o.lab.visible=curRoom<0})}
function enterRoom(i){const h=st.h;curRoom=i;viewRoom(i);showRooms();const r=h.rooms[i],g=r.g&&!r.g.cap?r.g:null;scan=null;
 gs=g?{t:0,weak:!!g.boss,angry:0,atk:rnd(4,7),ab:4,curse:0,dark:0,lock:0,abi:0,seen:false,tgt:new V3(),rt:0,lunge:0}:null;
 GO.visible=false;if(g){if(g.boss)skinBoss(GO,LIEUX[h.L].boss);else skinGhost(GO,g.ty,g.v);GO.position.copy(roomObjs[i].p).add(HOME).setY(1.6);GO.scale.setScalar(.01)}
 snd(150,.4,'sine',.05,90);renderPanel()}
function leaveRoom(){if(gs&&gs.lock>0){warn('🔒 La porte est fermée !');return}curRoom=-1;gs=null;scan=null;GO.visible=false;stopAim();MINI.forEach(m=>m.visible=false);$('ghp').style.display='none';$('dark').style.display='none';showRooms();viewHouse();renderPanel()}
function visibleGhost(g){return g.boss||!GT[g.ty].inv||st.eq.lamp>=1}
function startScan(k){if(scan||curRoom<0)return;const g=st.h.rooms[curRoom].g;if(g&&g.boss&&!g.cap)return;scan={k,t:2.5};sfx.scan();renderPanel()}
function endScan(){const h=st.h,i=curRoom,r=h.rooms[i],g=r.g&&!r.g.cap?r.g:null,cn=h.cn[i],k=scan.k;scan=null;
 const cs=k==='obs'?['L','O']:k==='mic'?(st.eq.mic>=2?['M','V']:['M']):k==='th'?['F']:['U'];
 if(!g){if(cn.p!==true)cn.p=false;toast('Rien… cette pièce a l’air vide.');updRoomLabels();renderPanel();return}
 cn.p=true;const cl=GT[g.ty].cl,res=cs.map(c=>{const y=cl.indexOf(c)>=0;y?addF(cn,c):addX(cn,c);return (y?'✅ ':'❌ ')+CLUES[c][0]+' '+CLUES[c][1]});
 if(k==='uv'&&GT[g.ty].inv&&!gs.seen){gs.seen=true;toast('🟣 La lampe UV révèle une silhouette !<br>'+res.join('<br>'))}else toast(res.join('<br>'));
 if(cs.some(c=>cl.indexOf(c)>=0)&&Math.random()<.35){sfx.scare();shakeT=.35;h.fear=Math.min(100,h.fear+6*fearM())}
 updRoomLabels();renderPanel()}
function clueLine(cn){return cn.f.split('').map(c=>'<span class="cl y">'+CLUES[c][0]+'</span>').join('')+cn.x.split('').map(c=>'<span class="cl n">'+CLUES[c][0]+'</span>').join('')}
function openCarnet(i){const h=st.h,Lx=LIEUX[h.L];
 if(i<0){let s='<h2>📓 Carnet de chasseur</h2><p><small>'+Object.keys(CLUES).map(c=>CLUES[c][0]+' '+CLUES[c][1]).join(' · ')+'</small></p>';
  h.rooms.forEach((r,j)=>{const cn=h.cn[j],done=r.g&&r.g.cap,cands=Lx.pool.filter(t=>consistent(t,cn));s+='<div class="row"><div class="ri">'+roomStatus(j)+'</div><div class="rt">'+r.nm+'<small>'+(done?'Libérée : '+(r.g.boss?Lx.boss.n:GT[r.g.ty].n):cn.p===false?'Sans doute vide':cn.boss?'💀 LE BOSS est ici !':cn.p?'Hantée · indices : '+(cn.f||cn.x?clueLine(cn):'aucun'):'Pas encore inspectée')+'</small>'+(cn.p&&!cn.boss&&!done?'<em>Possibles : '+cands.map(t=>GT[t].n).join(', ')+'</em>':'')+'</div></div>'});
  pop(s);return}
 const r=h.rooms[i],cn=h.cn[i];
 let s='<h2>📓 '+r.nm+'</h2><p>Indices : '+(cn.f||cn.x?clueLine(cn):'<small>aucun pour l’instant (utilise 👀 🎙️ 🌡️ 🟣)</small>')+'</p><p><small>Choisis le fantôme qui correspond : tu sortiras son arme. Si tu te trompes, il s’énerve !</small></p>';
 if(gs&&gs.angry>0)s+='<p style="color:#ff8a80">😡 Il est énervé : attends '+Math.ceil(gs.angry)+' s</p>';
 Lx.pool.forEach(t=>{const G0=GT[t],ok=consistent(t,cn);s+='<div class="row'+(ok?'':' out')+'"><div class="ri" style="background:'+hex(G0.dark?0x3a2a5c:G0.c)+'">'+FAM[G0.f][0]+'</div><div class="rt">'+G0.n+'<small>'+G0.cl.split('').map(c=>'<span class="cl'+(cn.f.indexOf(c)>=0?' y':cn.x.indexOf(c)>=0?' n':'')+'">'+CLUES[c][0]+'</span>').join('')+'</small><em>'+G0.w+'</em></div><button data-w="'+t+'" '+(gs&&(gs.weak||gs.angry>0)?'disabled':'')+'>Utiliser</button></div>'});
 pop(s);document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>useWeapon(+b.dataset.w))}
function useWeapon(t){closePop();const h=st.h,r=h.rooms[curRoom],g=r.g&&!r.g.cap?r.g:null;
 if(!g){toast('Tu sors '+GT[t].w+'… mais il n’y a personne ici. 🙄');h.fear=Math.min(100,h.fear+4);return}

function updRoom(dt){const h=st.h,r=h.rooms[curRoom],g=r.g&&!r.g.cap?r.g:null,o=roomObjs[curRoom],c0=o.p.clone().add(HOME);
 // peur
 let fr=1.2;if(g){fr+=1.2;if(gs.angry>0)fr+=3;if(g.boss)fr+=4.5;if(gs.lock>0)fr+=5}if(scan)fr+=1;h.fear+=fr*fearM()*dt;
 if(scan){scan.t-=dt;if(Math.random()<dt*6)sfx.scan();if(scan.t<=0)endScan()}
 // la lumière clignote si le fantôme a l'indice 💡
 const off=(g&&!g.boss&&GT[g.ty].cl.indexOf('L')>=0&&Math.random()<.08)||(gs&&gs.dark>0);o.bulb.material.color.copy(LIN(0xfff0c0)).multiplyScalar(off?.1:1);o.bh.visible=!off;
 if(!g){$('ghp').style.display='none';return}
 gs.t+=dt;gs.angry-=dt;gs.curse-=dt;gs.dark-=dt;gs.lock-=dt;
 const vis=visibleGhost(g)||gs.seen;
 if(gs.t>1.2&&vis&&!GO.visible){GO.visible=true;h.cn[curRoom].p=true;if(g.boss){h.cn[curRoom].boss=1;sfx.roar();flash('#d50000',.6);shakeT=1;h.fear=Math.min(100,h.fear+15*fearM());warn('💀 '+LIEUX[h.L].boss.n+' !',2.2)}else{GT[g.ty].f===0?sfx.giggle():sfx.bouh();toast('👻 Un fantôme apparaît !')}updRoomLabels();renderPanel()}
 else if(gs.t>1.2&&!vis&&!gs.hint){gs.hint=1;toast('😨 Tu as des frissons… une présence invisible ?')}
 // déplacement
 const sc=g.boss?2.3:.95*(GT[g.ty].sc||1);GO.scale.setScalar(Math.min(1,gs.t/.8)*sc);
 gs.rt-=dt;if(gs.rt<=0){gs.rt=rnd(.6,1.5);gs.tgt.set(c0.x+rnd(-1.8,1.8),rnd(1,g.boss?2.6:2.2),c0.z+rnd(-1.8,1.2))}
 const sp=(g.boss?2.6+h.L*.3:1.4)*(!g.boss&&GT[g.ty].sh==='ball'?2:1)*(gs.angry>0?2:1);
 if(gs.lunge>0){gs.lunge-=dt;_b.copy(cam.position).lerp(c0,g.boss?.75:.55);GO.position.lerp(_b,Math.min(1,dt*4))}else{_b.copy(gs.tgt).sub(GO.position);const d=_b.length();if(d>.05)GO.position.addScaledVector(_b.normalize(),Math.min(d,sp*dt))}
 GO.userData.b.position.y=Math.sin(T*3)*.12;GO.userData.b.rotation.z=Math.sin(T*2)*.15;GO.lookAt(cam.position.x,GO.position.y,cam.position.z);
 if(!g.boss&&GT[g.ty].spark&&Math.random()<dt*4)burst(GO.position,0xfff35c,2);
 // attaques
 if(gs.t>2){gs.atk-=dt;if(gs.atk<=0){gs.atk=g.boss?rnd(3,5):gs.angry>0?rnd(2.5,4):rnd(6,10);if(GO.visible)gs.lunge=.5;const scream=!g.boss&&GT[g.ty].scream;h.fear=Math.min(100,h.fear+(g.boss?10:scream?14:7)*(gs.angry>0?2:1)*fearM());
  if(g.boss||scream||gs.angry>0||Math.random()<.3){sfx.scare();flash('#ff1744',.3)}else sfx.bouh();shakeT=.35;if(scream)warn('😱 AAAAAAH !',1)}}
 if(g.boss){gs.ab-=dt;if(gs.ab<=0&&gs.t>3){gs.ab=rnd(6,8.5)-h.L*.3;bossAbility()}}
 MINI.forEach(m=>{if(!m.visible)return;m.userData.t-=dt;const a=T*4+m.userData.k*2.1;m.position.set(GO.position.x+Math.cos(a)*2,GO.position.y+Math.sin(a*2)*.4,GO.position.z+Math.sin(a));if(m.userData.t<=0)m.visible=false});
 const dk=$('dark');if(gs.dark>0){dk.style.display='block';dk.style.background='radial-gradient(circle at '+(aim.hold?aim.x:innerWidth/2)+'px '+(aim.hold?aim.y:innerHeight/2)+'px, rgba(0,0,0,0) 55px, rgba(0,0,0,.96) 140px)'}else dk.style.display='none';
 // barre de vie
 const gh=$('ghp');if(GO.visible){gh.style.display='block';gh.classList.toggle('boss',!!g.boss);$('gN').textContent=g.boss?LIEUX[h.L].boss.n:(gs.weak?GT[g.ty].n:'???')+(gs.angry>0?' 😡':gs.weak?' (affaibli)':'');$('gH').style.width=Math.max(0,g.hp/g.mx*100)+'%'}else gh.style.display='none';
 // aspiration
 const cr=$('cross'),bm=$('beam');
 if(aim.hold&&GO.visible){const s=scr(GO.position);_a.copy(GO.position);_a.x+=.8*GO.scale.x;const e=scr(_a),rad=Math.max(38,Math.abs(e.x-s.x)*1.2),on=Math.hypot(aim.x-s.x,aim.y-s.y)<rad&&gs.curse<=0;
  cr.style.display='block';cr.style.left=aim.x+'px';cr.style.top=aim.y+'px';cr.classList.toggle('on',on);cr.classList.toggle('off',gs.curse>0);
  const x0=innerWidth/2,y0=innerHeight+10,dx=aim.x-x0,dy=aim.y-y0;bm.style.display=gs.curse>0?'none':'block';bm.style.left=x0+'px';bm.style.top=y0+'px';bm.style.width=Math.hypot(dx,dy)+'px';bm.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';bm.style.opacity=on?1:.4;
  if(on){const mult=gs.angry>0?0:gs.weak?1:.15;g.hp-=power()*mult*dt;GO.userData.b.position.x=rnd(-.06,.06);if(Math.random()<dt*15)burst(GO.position,0x9dffb8,2);if(Math.random()<dt*10)snd(rnd(600,900),.05,'square',.02);
   if(mult===0&&!gs.tip0){gs.tip0=1;toast('😡 Il est trop énervé : l’aspirateur ne fait rien !')}else if(mult>0&&mult<1&&!gs.tip){gs.tip=1;toast('Il résiste ! Trouve d’abord la bonne arme 📓')}}
  else g.hp=Math.min(g.mx,g.hp+g.mx*.02*dt)}
 else{cr.style.display='none';bm.style.display='none';g.hp=Math.min(g.mx,g.hp+g.mx*.02*dt)}
 if(g.hp<=0)captureGhost()}

function openFix(){const h=st.h;let s='<h2>🔨 Réparations</h2><p>Beauté de la maison : <b>'+Math.round(beauty(h)*100)+' %</b><br>Prix de vente actuel : <b>'+fmt(salePrice(h))+' €</b></p>';
 h.rooms.forEach((r,i)=>{const c=repCost(h,r),busy=r.rep;s+='<div class="row"><div class="ri">'+(r.cond>=.99?'✨':busy?'⏳':'🔨')+'</div><div class="rt">'+r.nm+'<small>'+Math.round(r.cond*100)+' %'+(busy?' · travaux : '+Math.ceil(busy.t)+' s':'')+'</small><div class="bar"><i style="width:'+r.cond*100+'%"></i></div></div>'+(r.cond>=.99?'<button disabled>Neuf</button>':'<button data-f="'+i+'" '+(!busy&&st.m>=c?'':'disabled')+'>'+fmt(c)+' €</button>')+'</div>'});
 const tot=h.rooms.reduce((a,r)=>a+(r.cond<.99&&!r.rep?repCost(h,r):0),0);
 s+='<button class="btn" id="bAll" '+(tot>0&&st.m>=tot?'':'disabled')+'>🔨 Tout réparer ('+fmt(tot)+' €)</button>';
 pop(s);document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{repair(+b.dataset.f);openFix()});$('bAll').onclick=()=>{h.rooms.forEach((r,i)=>{if(r.cond<.99&&!r.rep)repair(i)});openFix()}}
function repair(i){const h=st.h,r=h.rooms[i],c=repCost(h,r);if(r.rep||r.cond>=.99||st.m<c)return;st.m-=c;h.spent+=c;r.rep={t:repTime(r)};snd(300,.15,'square',.05,200)}
function updFix(dt){const h=st.h;let ch=false;h.rooms.forEach((r,i)=>{if(!r.rep)return;r.rep.t-=dt;
  if(mode==='house'&&roomObjs[i]&&Math.random()<dt*3){snd(rnd(200,400),.06,'square',.03);burst(roomObjs[i].p.clone().add(HOME).setY(1),0xffd54f,2)}
  if(r.rep.t<=0){r.rep=null;r.cond=1;ch=true;if(mode==='house'&&roomObjs[i]){inside.remove(roomObjs[i].g);disposeG(roomObjs[i].g);roomObjs[i]=buildRoom(h,i);roomObjs[i].lab.visible=false;burst(roomObjs[i].p.clone().add(HOME).setY(1.5),0x76ff9a,20);sfx.coin()}}});
 if(ch){updRoomLabels();save();if($('pop').classList.contains('on')&&$('bAll'))openFix()}

 askYes('Vendre <b>'+h.name+'</b> pour <b>'+fmt(p)+' €</b> ?'+(b<.99?'<br><small>Elle n’est retapée qu’à '+Math.round(b*100)+' % : tu gagnerais plus en réparant tout.</small>':''),()=>{
  const prof=p-h.paid-h.spent;earn(p);st.sold++;let unl='';if(h.L===0){st.s0++;if(st.lmax===0&&st.s0>=SALES0){st.lmax=1;genMarket(1);unl='<p>🔓 Nouveau quartier : <b>'+LIEUX[1].ic+' '+LIEUX[1].d+'</b> ('+LIEUX[1].n+') !</p>'}}st.best=Math.max(st.best,prof);const nm=h.name,paid=h.paid,sp=h.spent;st.h=null;sfx.coin();jingle([523,659,784,1046,1318]);goTown();
  pop('<h2>💰 Vendue !</h2><p><b>'+nm+'</b></p><div class="sec"><p style="text-align:left">Achat : <b>−'+fmt(paid)+' €</b><br>Travaux : <b>−'+fmt(sp)+' €</b><br>Vente : <b>+'+fmt(p)+' €</b></p></div><p style="font-family:var(--gf);font-size:28px;color:'+(prof>=0?'#b9ffcb':'#ff8a80')+'">'+(prof>=0?'Bénéfice : +':'Perte : −')+fmt(Math.abs(prof))+' €</p>'+(unl||(h.L===0&&st.lmax===0?'<p>Encore <b>'+(SALES0-st.s0)+'</b> maison(s) de ville à vendre pour débloquer la campagne.</p>':''))+'<p><small>Avec cet argent, améliore ton matos 🧰 et achète des maisons plus hantées !</small></p><button class="btn" id="bOk">Super !</button>');$('bOk').onclick=closePop})}

$('bMore').onclick=openMore;
$('bTown').onclick=()=>{if(night){toast('Attends la fin de la nuit 🌙');return}if(curRoom>=0){if(gs&&gs.lock>0){warn('🔒 La porte est fermée !');return}leaveRoom()}goTown()};
function help(){pop('<h2>👻 Chasseur de Maisons Hantées</h2><p style="text-align:left">Bienvenue à <b>'+TOWN+'</b> !<br><br>🔑 <b>1. Acheter</b> : sur la carte, touche une maison à vendre. Moins elle coûte, plus elle est hantée.<br><br>🌙 <b>2. Enquêter</b> : pose des 📷 caméras et des détecteurs dans les pièces, puis regarde les écrans pendant la nuit.<br><br>🔦 <b>3. Chasser</b> : entre dans les pièces, cherche les indices (💡 ❄️ 🎙️ 🟣 📦 📼), choisis la bonne arme dans le 📓 carnet, puis <b>maintiens le doigt sur le fantôme</b> pour l’aspirer. Mauvaise arme = il s’énerve !<br><br>😱 Si ta <b>peur</b> est pleine, tu t’enfuis.<br><br>🔨 <b>4. Retaper</b> la maison libérée.<br><br>💰 <b>5. Revendre</b> : plus elle est belle et plus les fantômes étaient dangereux, plus tu gagnes.<br><br>🏛️ Les fantômes vont au <b>musée</b> et rapportent de l’argent.</p><button class="btn" id="bOk">C’est parti !</button>');$('bOk').onclick=closePop}

// ===================== Effets =====================
const FX=[];const PG=new THREE.SphereGeometry(.1,6,4);const _a=new V3(),_b=new V3();
function burst(p,c,n){for(let i=0;i<(n||12);i++){const m=new THREE.Mesh(PG,new THREE.MeshBasicMaterial({color:LIN(c),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));m.position.copy(p);scene.add(m);FX.push({m,v:new V3(rnd(-3,3),rnd(-1,4),rnd(-3,3)),t:0,d:rnd(.5,.9)})}}
function updFX(dt){for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.t+=dt;f.m.position.addScaledVector(f.v,dt);f.v.y-=5*dt;f.m.material.opacity=1-f.t/f.d;if(f.t>=f.d){scene.remove(f.m);f.m.material.dispose();FX.splice(i,1)}}}

// ===================== Toucher l'écran =====================
const RC=new THREE.Raycaster(),_m=new THREE.Vector2();let pd=null;
function rayAt(x,y,objs){_m.set(x/innerWidth*2-1,-y/innerHeight*2+1);RC.setFromCamera(_m,cam);const h=RC.intersectObjects(objs,false);return h.length?h[0].object:null}
$('c').addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,cx:camX,moved:false};
 if(mode==='house'&&curRoom>=0&&GO.visible){aim.hold=true;aim.x=e.clientX;aim.y=e.clientY-(e.pointerType==='touch'?50:0)}});
addEventListener('pointermove',e=>{if(!pd)return;const dx=e.clientX-pd.x;if(Math.abs(dx)+Math.abs(e.clientY-pd.y)>10)pd.moved=true;
 if(mode==='town'&&pd.moved)camX=clamp(pd.cx-dx*.06,0,5*DX);
 if(aim.hold){aim.x=e.clientX;aim.y=e.clientY-(e.pointerType==='touch'?50:0)}});
addEventListener('pointerup',e=>{const p=pd;pd=null;stopAim();if(!p)return;if(mode==='town'&&p.moved){renderPanel();return}if(p.moved)return;if(e.target===$('c'))tap(e.clientX,e.clientY)});
addEventListener('pointercancel',()=>{pd=null;stopAim()});
function tap(x,y){if($('pop').classList.contains('on'))return;
 if(mode==='town'){const o=rayAt(x,y,houseHits);if(o)openBuy(o.userData.L,o.userData.i);else if(st.h&&Math.abs(camX-st.h.L*DX)<DX/2)goHouse();return}
 const h=st.h;if(!h||curRoom>=0)return;const o=rayAt(x,y,roomObjs.map(r=>r.fl));if(!o)return;const i=o.userData.room;
 if(h.phase==='plan')placeDev(i);else if(h.phase==='hunt')enterRoom(i);else if(h.phase==='fix')openFix()}

// ===================== Hors ligne, mises à jour =====================
function offline(sec){const lim=(2+2*st.eq.van)*3600,s=Math.min(sec,lim),g=st.mi*s;if(g<=0)return;earn(g);
 if(sec>=60){pop('<h2>👋 Bon retour !</h2><p>Ton musée a accueilli des visiteurs pendant ton absence.</p><p style="font-family:var(--gf);font-size:30px;color:#b9ffcb">+'+fmt(g)+' €</p>'+(sec>lim?'<p><small>(limité à '+(lim/3600)+' h : améliore la 🚐 camionnette)</small></p>':'')+'<button class="btn" id="bOk">💰 Merci !</button>');$('bOk').onclick=closePop}save()}
let SWR=null;
function chkUpd(man){fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
 if(!j||!j.v||j.v===APPV){if(man)toast('Le jeu est à jour ✓');return}closePop();$('updn').textContent=j.notes||'';$('upd').classList.add('on')}).catch(()=>{if(man)toast('Pas de connexion')})}
$('updB').onclick=()=>{try{SWR&&SWR.update()}catch(e){}setTimeout(()=>location.reload(),300)};
if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js?v='+APPV).then(r=>{SWR=r}).catch(()=>{})});
setInterval(()=>chkUpd(false),5*60e3);setTimeout(()=>chkUpd(false),4000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAim();save()}else chkUpd(false)});
addEventListener('pagehide',save);
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?62:45;cam.updateProjectionMatrix();if(mode==='house'&&st.h){curRoom>=0?viewRoom(curRoom):viewHouse()}}
addEventListener('resize',resize);

// ===================== Boucle =====================
let T=0,last=performance.now(),uiT=0,saveT=0,thT=rnd(25,50);
function step(dt){T+=dt;earn(st.mi*dt);const h=st.h;
 if(mode==='town'){const port=innerWidth<innerHeight;camPosT.set(camX,port?31:20,port?36:27);camLookT.set(camX,1,port?-1:0);
  floaters.forEach(f=>{f.position.y=f.userData.y0+Math.sin(T*2+f.userData.ph)*.3;f.rotation.y=Math.sin(T+f.userData.ph)*.5});
  if(h&&h.fear>0)h.fear=Math.max(0,h.fear-5*dt)}
 else if(h){if(h.phase==='night'&&night)updNight(dt);
  if(curRoom>=0)updRoom(dt);else if(h.fear>0)h.fear=Math.max(0,h.fear-3*dt);
  if(h.fear>=100&&st.h)flee()}
 if(st.h&&st.h.phase==='fix')updFix(dt);
 updFX(dt);
 thT-=dt;if(thT<=0){thT=rnd(30,60);flash('#e8eaff',.35);HEMI.intensity+=1.5;setTimeout(sfx.thunder,rnd(200,800))}
 HEMI.intensity=lerp(HEMI.intensity,hemiTarget(),Math.min(1,dt*3));
 uiT-=dt;if(uiT<=0){uiT=.25;renderTop();if(night)drawTiles();if(mode==='town'){const L=clamp(Math.round(camX/DX),0,5);if(renderPanel.L!==L){renderPanel.L=L;renderPanel()}}}
 saveT-=dt;if(saveT<=0){saveT=3;save()}
}
function loop(now){let dt=(now-last)/1000;last=now;if(dt>2){offline(dt);dt=0}
 step(Math.min(dt,.1));const k=Math.min(1,dt*5);
 camPos.lerp(camPosT,k);camLook.lerp(camLookT,k);
 cam.position.copy(camPos);if(shakeT>0){shakeT-=Math.min(dt,.05);cam.position.x+=rnd(-.25,.25);cam.position.y+=rnd(-.2,.2)}cam.lookAt(camLook);
 LAMP.position.copy(cam.position);LAMP.target.position.copy(camLook);
 R.render(scene,cam);requestAnimationFrame(loop)}
if(st.h&&st.h.phase==='night')st.h.phase='plan';
resize();goTown();camPos.copy(camPosT);camLook.copy(camLookT);
(()=>{const s=(Date.now()-(st.t||Date.now()))/1000;if(s>5)offline(s)})();
if(!st.sold&&!st.h&&!st.caps)setTimeout(help,500);
requestAnimationFrame(loop);
</script>
</body></html>
