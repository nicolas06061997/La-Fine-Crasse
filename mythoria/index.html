<h1>MYTHORIA a déménagé ✨</h1>
<p>Ta progression est conservée. Redirection…</p>
<p><a href="https://nicolas06061997.github.io/mythoria-game/">Ouvrir MYTHORIA</a></p>
<script>
// L'ancienne version installée disparaît proprement (service worker et cache), puis on part à la nouvelle adresse.
(async () => {
  try { const regs = await navigator.serviceWorker.getRegistrations(); for (const r of regs) if (r.scope.includes('/La-Fine-Crasse/mythoria/')) await r.unregister(); } catch (e) {}
  try { for (const k of await caches.keys()) if (k.startsWith('mythoria-')) await caches.delete(k); } catch (e) {}
  location.replace('https://nicolas06061997.github.io/mythoria-game/');
})();
</script>
