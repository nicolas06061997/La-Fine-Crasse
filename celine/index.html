<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Céline</title>
<meta name="theme-color" content="#e8779c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Céline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#fff5f8;--card:#fff;--ink:#4a3940;--mut:#a08c94;--pri:#e8779c;--pri2:#fbd9e4;--pri3:#fff0f5;--ok:#6cc39b;--line:#f3dfe7;--sh:0 4px 18px rgba(232,119,156,.13)}
@media (prefers-color-scheme:dark){:root{--bg:#1f1a1d;--card:#2b2428;--ink:#f6e9ee;--mut:#b49fa8;--pri:#f08fb0;--pri2:#4a3440;--pri3:#352a30;--line:#3d3237;--sh:0 4px 18px rgba(0,0,0,.3)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);background:var(--pri3);border:2px solid transparent;border-radius:14px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--pri2)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px}
header h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.5px}
header h1 span{color:var(--pri)}
.gear{font-size:22px;width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh)}
main{padding:8px 16px 20px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.card h2 small{margin-left:auto;font-weight:600;color:var(--mut);font-size:13px}
.hero{background:linear-gradient(135deg,#f7a9c4,#e8779c);color:#fff;border-radius:26px;padding:20px;margin:8px 0 12px;box-shadow:var(--sh)}
.hero .hi{font-size:24px;font-weight:800}
.hero .date{opacity:.9;text-transform:capitalize;margin-top:2px}
.hero .quote{margin-top:12px;background:rgba(255,255,255,.2);border-radius:14px;padding:10px 12px;font-size:14.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin:0}
.big{font-size:30px;font-weight:800;color:var(--pri)}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item .e{font-size:22px;width:28px;text-align:center}
.item.done .t{text-decoration:line-through;color:var(--mut)}
.item.done .e{opacity:.5}
.ck{width:28px;height:28px;flex:none;border-radius:50%;border:2.5px solid var(--pri2);display:grid;place-items:center;font-size:15px;color:#fff;transition:.15s}
.done .ck{background:var(--ok);border-color:var(--ok)}
.x{width:32px;height:32px;flex:none;border-radius:50%;color:var(--mut);font-size:18px}
.rep{font-size:12px;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--sh);font-size:14.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff}
.chip .n{display:inline-block;min-width:18px;margin-left:4px;font-size:12px;opacity:.75}
.bar{height:10px;border-radius:9px;background:var(--pri2);overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f7a9c4,var(--pri));border-radius:9px;transition:width .4s}
.cat{font-size:13px;font-weight:800;color:var(--pri);text-transform:uppercase;letter-spacing:.6px;margin:14px 4px 0}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.empty b{display:block;font-size:40px;margin-bottom:6px}
.btn{background:var(--pri);color:#fff;font-weight:700;border-radius:16px;padding:13px 18px;flex:1}
.btn.soft{background:var(--pri2);color:var(--ink)}
.btn.del{background:transparent;color:#d9534f;flex:none}
.addrow{display:flex;gap:8px}
.addrow button{flex:none;width:52px;border-radius:14px;background:var(--pri);color:#fff;font-size:26px;font-weight:700}
.meal{display:grid;grid-template-columns:44px 1fr 40px;gap:8px;align-items:center;margin:6px 0}
.meal input{padding:10px 12px}
.meal .lb{font-size:13px;color:var(--mut);font-weight:700}
.dice{font-size:20px;height:40px;border-radius:12px;background:var(--pri3)}
.today{outline:2.5px solid var(--pri);outline-offset:-2.5px}
.ev{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{width:52px;flex:none;text-align:center;background:var(--pri3);border-radius:14px;padding:6px 0;line-height:1.1}
.ev .d b{display:block;font-size:20px;color:var(--pri)}
.ev .d span{font-size:12px;text-transform:uppercase;color:var(--mut);font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:9px;background:var(--pri2);margin-top:3px}
.tag.now{background:var(--pri);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(232,119,156,.12);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:700;color:var(--mut);padding:4px 0;border-radius:14px}
nav button b{font-size:22px;filter:grayscale(.7);opacity:.7;transition:.15s}
nav button.on{color:var(--pri)}
nav button.on b{filter:none;opacity:1;transform:translateY(-2px) scale(1.12)}
#fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--pri);color:#fff;font-size:34px;box-shadow:0 8px 22px rgba(232,119,156,.45);display:none;align-items:center;justify-content:center;z-index:6}
#ov{position:fixed;inset:0;background:rgba(60,30,45,.35);opacity:0;pointer-events:none;transition:.2s;z-index:10}
#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .25s,visibility .25s;z-index:11;max-width:640px;margin:0 auto}
#sh.on{transform:none;visibility:visible}
#sh:before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
#sh h3{margin:0 0 12px;font-size:20px}
.lbl{font-size:13px;font-weight:800;color:var(--mut);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.5px}
.tog{display:flex;align-items:center;gap:10px;margin:16px 2px;font-weight:600}
.tog input{width:22px;height:22px;accent-color:var(--pri)}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:700;transition:.3s;z-index:20;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
textarea{min-height:90px;resize:vertical}
.link{color:var(--pri);font-weight:700;font-size:14px}
.ring{flex:none}
.ring text{font-weight:800;fill:var(--ink)}
</style>
</head>
<body>
<header><h1>Céline <span>✿</span></h1><button class="gear" onclick="settings()" aria-label="Réglages">⚙️</button></header>
<main id="main"></main>
<button id="fab" onclick="fab()" aria-label="Ajouter">+</button>
<nav>
  <button data-t="home" onclick="go('home')"><b>🏠</b>Accueil</button>
  <button data-t="menage" onclick="go('menage')"><b>🧹</b>Ménage</button>
  <button data-t="courses" onclick="go('courses')"><b>🛒</b>Courses</button>
  <button data-t="repas" onclick="go('repas')"><b>🍽️</b>Repas</button>
  <button data-t="agenda" onclick="go('agenda')"><b>📅</b>Agenda</button>
</nav>
<div id="ov" onclick="closeSheet()"></div>
<div id="sh"></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" hidden onchange="restore(this)">
<script>
// ---------- Outils ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const todayI=()=>(new Date().getDay()+6)%7;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const day0=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
function weekKey(){const d=day0(new Date());d.setDate(d.getDate()-todayI());return ymd(d)}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};

// ---------- Idées ----------
const SUG=[['🧹','Passer l\'aspirateur'],['🪣','Laver le sol'],['🪶','Faire la poussière'],['🛁','Nettoyer la salle de bain'],['🚽','Nettoyer les toilettes'],['🛏️','Changer les draps'],['🧺','Faire une lessive'],['👕','Repassage'],['🪟','Laver les vitres'],['🗑️','Sortir les poubelles'],['🧊','Nettoyer le frigo'],['🍳','Nettoyer la cuisine'],['🪴','Arroser les plantes'],['♻️','Trier le recyclage'],['🧽','Nettoyer le four'],['🛋️','Ranger le salon'],['👟','Ranger l\'entrée'],['🐾','Litière / animaux']];
const CATS=[
 ['Fruits & légumes','🥦','pomme banane poire orange citron fraise raisin kiwi melon pêche abricot fruit légume salade tomate carotte courgette poivron oignon ail échalote pomme de terre patate brocoli chou épinard concombre champignon poireau avocat aubergine haricot persil basilic herbe'],
 ['Boulangerie','🥖','pain baguette croissant brioche biscotte pain de mie viennoiserie'],
 ['Viande & poisson','🥩','viande poulet boeuf bœuf porc jambon steak haché saucisse lardon dinde poisson saumon thon crevette cabillaud charcuterie'],
 ['Crèmerie','🧀','lait beurre fromage yaourt yogourt crème oeuf œuf oeufs œufs emmental mozzarella gruyère dessert lacté'],
 ['Épicerie','🍝','pâtes riz farine sucre sel poivre huile vinaigre sauce conserve céréale café thé chocolat biscuit confiture miel épice moutarde ketchup mayonnaise semoule lentille'],
 ['Boissons','🥤','eau jus soda coca bière vin sirop limonade'],
 ['Surgelés','🧊','surgelé glace pizza frites'],
 ['Hygiène & beauté','🧴','shampoing shampooing gel douche savon dentifrice brosse déodorant coton maquillage crème visage rasoir mouchoir serviette hygiénique tampon'],
 ['Maison & entretien','🧽','papier toilette essuie-tout sac poubelle lessive adoucissant liquide vaisselle éponge javel nettoyant ampoule pile'],
 ['Bébé & animaux','🍼','couche lingette lait bébé croquette pâtée litière'],
 ['Autre','🛍️','']];
const MEALS=['Pâtes bolognaise','Poulet rôti & pommes de terre','Croque-monsieur & salade','Quiche lorraine','Gratin dauphinois','Saumon & riz','Soupe de légumes','Lasagnes','Chili con carne','Omelette & salade','Boulettes sauce tomate','Raclette','Pizza maison','Stoemp & saucisse','Hachis parmentier','Curry de poulet','Wraps poulet crudités','Carbonnade & frites','Salade composée','Risotto aux champignons','Poisson pané & purée','Tacos maison','Crêpes salées','Vol-au-vent'];
const QUOTES=['Un petit pas chaque jour, et tout avance 🌷','Pense aussi à toi aujourd\'hui 💗','Tu fais déjà beaucoup, sois fière de toi ✨','Une tâche à la fois, tranquillement ☕','La maison n\'a pas besoin d\'être parfaite, elle doit être heureuse 🏡','Prends 5 minutes rien que pour toi aujourd\'hui 🌸','Ce qui est fait n\'est plus à faire 💪','Souris, tu gères ! 😊'];

// ---------- Données ----------
const KEY='celine1';
function def(){
  const t=(e,n,d)=>({id:uid(),e,t:n,day:d,rep:true,done:null});
  return {tasks:[t('🧺','Faire une lessive',0),t('🧹','Passer l\'aspirateur',2),t('🗑️','Sortir les poubelles',3),t('🛁','Nettoyer la salle de bain',4),t('🛏️','Changer les draps',5),t('🪴','Arroser les plantes',7)],
    shop:[],hist:{},meals:{},events:[],memo:''};
}
let st=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tasks)return Object.assign(def(),s)}catch(e){}return def()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
// Nouvelle semaine : les tâches répétées repartent à zéro, les tâches uniques déjà faites disparaissent.
function tidy(){
  const wk=weekKey();
  st.tasks=st.tasks.filter(t=>t.rep||!t.done||t.done===wk);
  if(st.mealWeek&&st.mealWeek!==wk&&st.mealsAuto){st.meals={}}
  st.mealWeek=wk;
  const yest=ymd(new Date(Date.now()-864e5));
  st.events=st.events.filter(e=>e.yearly||e.date>=yest);
  save();
}
tidy();
const isDone=t=>t.done===weekKey();

// ---------- Navigation ----------
let tab='home',dayF=todayI(),ed={};
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#main').innerHTML=V[tab]();
  $('#fab').style.display=(tab==='menage'||tab==='agenda')?'flex':'none';
}
function fab(){tab==='menage'?taskSheet():evSheet()}
function sheet(h){$('#sh').innerHTML=h;$('#sh').classList.add('on');$('#ov').classList.add('on');$('#sh').scrollTop=0}
function closeSheet(){$('#sh').classList.remove('on');$('#ov').classList.remove('on')}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}

function ring(p,size=64){const r=size/2-6,c=2*Math.PI*r;
  return `<svg class="ring" width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pri2)" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--pri)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${size/4.2}">${Math.round(p*100)}%</text></svg>`}

// ---------- Ménage ----------
function taskRow(t){
  return `<div class="item ${isDone(t)?'done':''}"><button class="ck" onclick="toggleTask('${t.id}')" aria-label="Fait">✓</button><span class="e">${esc(t.e)}</span><span class="t" onclick="taskSheet('${t.id}')">${esc(t.t)}${t.rep?' <span class="rep">🔁</span>':''}</span></div>`}
function toggleTask(id){
  const t=st.tasks.find(x=>x.id===id);if(!t)return;
  t.done=isDone(t)?null:weekKey();buzz();save();render();
  if(t.done){const list=st.tasks.filter(x=>x.day===t.day);
    if(list.every(isDone))toast(t.day===7?'Toutes les tâches de la semaine sont faites ! 🎉':'Bravo Céline, tout est fait pour '+DAYS[t.day].toLowerCase()+' ! 🎉');}
}
function taskSheet(id){
  const t=id?st.tasks.find(x=>x.id===id):{e:'🧹',t:'',day:dayF,rep:true};
  ed={id:id||'',e:t.e,day:t.day};
  sheet(`<h3>${id?'Modifier la tâche':'Nouvelle tâche'}</h3>
  <div class="row"><button class="chip" style="font-size:22px;padding:8px 12px" id="fe">${esc(t.e)}</button><input id="ft" value="${esc(t.t)}" placeholder="Ex : Passer l'aspirateur" oninput="guessEmoji(this.value)"></div>
  ${id?'':`<div class="lbl">Idées</div><div class="chips">${SUG.map((s,i)=>`<button class="chip" onclick="pickSug(${i})">${s[0]} ${esc(s[1])}</button>`).join('')}</div>`}
  <div class="lbl">Quel jour ?</div><div class="chips wrap">${[...DAYS,'N\'importe quand'].map((d,i)=>`<button class="chip dch ${i===t.day?'on':''}" onclick="setDay(${i},this)">${i<7?d.slice(0,3)+'.':'🗓️ '+d}</button>`).join('')}</div>
  <label class="tog"><input type="checkbox" id="fr" ${t.rep?'checked':''}> 🔁 Revient chaque semaine</label>
  <div class="row"><button class="btn" onclick="saveTask()">Enregistrer</button>${id?`<button class="btn del" onclick="delTask()">Supprimer</button>`:''}</div>`);
  if(!id)setTimeout(()=>$('#ft').focus(),250);
}
function pickSug(i){ed.e=SUG[i][0];$('#fe').textContent=ed.e;$('#ft').value=SUG[i][1]}
function guessEmoji(v){v=v.toLowerCase();const s=SUG.find(s=>s[1].toLowerCase().split(' ').some(w=>w.length>4&&v.includes(w)));if(s){ed.e=s[0];$('#fe').textContent=s[0]}}
function setDay(i,b){ed.day=i;document.querySelectorAll('.dch').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function saveTask(){
  const n=$('#ft').value.trim();if(!n){$('#ft').focus();return}
  const rep=$('#fr').checked;
  if(ed.id){Object.assign(st.tasks.find(x=>x.id===ed.id),{t:n,e:ed.e,day:ed.day,rep})}
  else st.tasks.push({id:uid(),t:n,e:ed.e,day:ed.day,rep,done:null});
  dayF=ed.day;save();closeSheet();render();
}
function delTask(){st.tasks=st.tasks.filter(x=>x.id!==ed.id);save();closeSheet();render();toast('Tâche supprimée')}

// ---------- Courses ----------
function catOf(name){const n=' '+name.toLowerCase()+' ';
  let best=CATS.length-1,len=0;
  CATS.forEach((c,i)=>c[2].split(' ').forEach(k=>{if(k&&n.includes(k)&&k.length>len){best=i;len=k.length}}));
  return best}
function addItem(name){
  name=(name||'').trim();if(!name)return;
  const ex=st.shop.find(i=>i.t.toLowerCase()===name.toLowerCase());
  if(ex){ex.done=false}else st.shop.push({id:uid(),t:name,c:catOf(name),done:false});
  const k=name.toLowerCase();st.hist[k]=(st.hist[k]||0)+1;
  buzz();save();render();
  const i=$('#ni');if(i){i.focus()}
}
function toggleItem(id){const i=st.shop.find(x=>x.id===id);i.done=!i.done;buzz();save();render()}
function delItem(id){st.shop=st.shop.filter(x=>x.id!==id);save();render()}
function clearTaken(){st.shop=st.shop.filter(x=>!x.done);save();render();toast('Articles pris retirés 🧺')}
function shareList(){
  const left=st.shop.filter(i=>!i.done);if(!left.length){toast('La liste est vide');return}
  let txt='🛒 Liste de courses\n';
  CATS.forEach((c,ci)=>{const l=left.filter(i=>i.c===ci);if(l.length)txt+='\n'+c[1]+' '+c[0]+'\n'+l.map(i=>'• '+i.t).join('\n')+'\n'});
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else navigator.clipboard.writeText(txt).then(()=>toast('Liste copiée 📋'),()=>toast('Impossible de copier'));
}
function changeCat(id){
  const it=st.shop.find(x=>x.id===id);
  sheet(`<h3>Rayon pour « ${esc(it.t)} »</h3><div class="chips wrap">${CATS.map((c,i)=>`<button class="chip ${i===it.c?'on':''}" onclick="setCat('${id}',${i})">${c[1]} ${c[0]}</button>`).join('')}</div>`);
}
function setCat(id,i){st.shop.find(x=>x.id===id).c=i;save();closeSheet();render()}

// ---------- Repas ----------
function setMeal(d,k,v){(st.meals[d]=st.meals[d]||{})[k]=v;save()}
function dice(d,k){const v=MEALS[Math.floor(Math.random()*MEALS.length)];setMeal(d,k,v);const i=document.getElementById('m'+d+k);if(i)i.value=v;buzz()}
function mealsToShop(){
  const all=[];for(let d=0;d<7;d++){const m=st.meals[d]||{};['m','s'].forEach(k=>m[k]&&all.push(m[k]))}
  if(!all.length){toast('Aucun repas prévu');return}
  sheet(`<h3>Ajouter aux courses</h3><p class="mut">Tape les ingrédients à acheter pour tes repas, séparés par des virgules.</p>
  <p class="mut">${all.map(esc).join(' · ')}</p><textarea id="ing" placeholder="Ex : pâtes, haché, tomates, parmesan"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="addIng()">Ajouter à la liste</button></div>`);
}
function addIng(){const v=$('#ing').value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);v.forEach(n=>{const ex=st.shop.find(i=>i.t.toLowerCase()===n.toLowerCase());if(ex)ex.done=false;else st.shop.push({id:uid(),t:n,c:catOf(n),done:false})});save();closeSheet();toast(v.length+' article(s) ajouté(s) 🛒');render()}
function clearMeals(){if(confirm('Vider tous les repas de la semaine ?')){st.meals={};save();render()}}
function autoMeals(b){st.mealsAuto=b.checked;save()}

// ---------- Agenda ----------
const TYPES=[['rdv','📅','Rendez-vous'],['anniv','🎂','Anniversaire'],['ecole','🎒','École'],['sante','🩺','Santé'],['autre','⭐','Autre']];
function nextOcc(e){
  const t=day0(new Date());
  const [y,m,d]=e.date.split('-').map(Number);
  let dt=new Date(y,m-1,d);
  if(e.yearly){dt=new Date(t.getFullYear(),m-1,d);if(dt<t)dt=new Date(t.getFullYear()+1,m-1,d)}
  return {dt,n:Math.round((dt-t)/864e5),age:e.yearly&&y>1900?dt.getFullYear()-y:0};
}
function upcoming(){return st.events.map(e=>({e,...nextOcc(e)})).filter(x=>x.n>=-1).sort((a,b)=>a.n-b.n||(a.e.time||'').localeCompare(b.e.time||''))}
function when(n){return n<0?'Hier':n===0?'Aujourd\'hui !':n===1?'Demain':'Dans '+n+' jours'}
function evRow(x){const ty=TYPES.find(t=>t[0]===x.e.type)||TYPES[4];
  return `<div class="ev" onclick="evSheet('${x.e.id}')"><div class="d"><b>${x.dt.getDate()}</b><span>${MOIS[x.dt.getMonth()]}</span></div>
  <div style="flex:1;min-width:0"><div style="font-weight:700;overflow-wrap:anywhere">${ty[1]} ${esc(x.e.t)}${x.age?' <span class="mut">('+x.age+' ans)</span>':''}</div>
  <div class="mut">${x.e.time?'🕐 '+esc(x.e.time)+' · ':''}<span class="tag ${x.n<=1?'now':''}">${when(x.n)}</span></div></div></div>`}
function evSheet(id){
  const e=id?st.events.find(x=>x.id===id):{t:'',date:ymd(new Date()),time:'',type:'rdv',yearly:false};
  ed={id:id||'',type:e.type};
  sheet(`<h3>${id?'Modifier':'Nouvel événement'}</h3>
  <div class="chips wrap">${TYPES.map(t=>`<button class="chip tch ${t[0]===e.type?'on':''}" onclick="setType('${t[0]}',this)">${t[1]} ${t[2]}</button>`).join('')}</div>
  <div class="lbl">Quoi ?</div><input id="et" value="${esc(e.t)}" placeholder="Ex : Dentiste, Anniversaire de maman…">
  <div class="lbl">Quand ?</div><div class="row"><input type="date" id="ed" value="${e.date}"><input type="time" id="eh" value="${esc(e.time)}" style="max-width:130px"></div>
  <label class="tog"><input type="checkbox" id="ey" ${e.yearly?'checked':''}> 🔁 Revient chaque année</label>
  <div class="row"><button class="btn" onclick="saveEv()">Enregistrer</button>${id?`<button class="btn del" onclick="delEv()">Supprimer</button>`:''}</div>`);
}
function setType(t,b){ed.type=t;document.querySelectorAll('.tch').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(t==='anniv')$('#ey').checked=true}
function saveEv(){
  const t=$('#et').value.trim(),d=$('#ed').value;if(!t){$('#et').focus();return}if(!d){$('#ed').focus();return}
  const o={t,date:d,time:$('#eh').value,type:ed.type,yearly:$('#ey').checked};
  if(ed.id)Object.assign(st.events.find(x=>x.id===ed.id),o);else st.events.push({id:uid(),...o});
  save();closeSheet();render();
}
function delEv(){st.events=st.events.filter(x=>x.id!==ed.id);save();closeSheet();render();toast('Événement supprimé')}

// ---------- Vues ----------
const V={
home(){
  const d=new Date(),h=d.getHours(),ti=todayI();
  const hi=h<5?'Bonne nuit':h<12?'Bonjour':h<18?'Bon après-midi':'Bonsoir';
  const doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  const tdy=st.tasks.filter(t=>t.day===ti),dn=tdy.filter(isDone).length;
  const left=st.shop.filter(i=>!i.done).length;
  const m=st.meals[ti]||{};
  const ev=upcoming().filter(x=>x.n>=0&&x.n<=14).slice(0,4);
  const wk=st.tasks.length?st.tasks.filter(isDone).length/st.tasks.length:0;
  return `<div class="hero"><div class="hi">${hi} Céline 🌸</div><div class="date">${d.toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'})}</div><div class="quote">${QUOTES[doy%QUOTES.length]}</div></div>
  ${installBanner()}
  <div class="card"><h2>🧹 Ménage d'aujourd'hui<small onclick="dayF=${ti};go('menage')" class="link">Tout voir ›</small></h2>
    ${tdy.length?`<div class="row" style="align-items:flex-start;gap:14px">${ring(dn/tdy.length)}<div style="flex:1;min-width:0">${tdy.map(taskRow).join('')}</div></div>`:`<div class="mut">Rien de prévu aujourd'hui, profite ! ☕</div>`}
  </div>
  <div class="grid2">
    <div class="card" onclick="go('courses')"><h2>🛒 Courses</h2><div class="big">${left}</div><div class="mut">article${left>1?'s':''} à acheter</div></div>
    <div class="card" onclick="go('menage')"><h2>✨ Semaine</h2><div class="big">${Math.round(wk*100)}%</div><div class="mut">du ménage fait</div></div>
  </div>
  <div class="card" onclick="go('repas')"><h2>🍽️ Au menu aujourd'hui</h2>
    <div class="item"><span class="e">☀️</span><span class="t">${m.m?esc(m.m):'<span class="mut">Midi : pas encore prévu</span>'}</span></div>
    <div class="item"><span class="e">🌙</span><span class="t">${m.s?esc(m.s):'<span class="mut">Soir : pas encore prévu</span>'}</span></div></div>
  <div class="card"><h2>📅 À venir<small onclick="go('agenda')" class="link">Agenda ›</small></h2>${ev.length?ev.map(evRow).join(''):'<div class="mut">Rien dans les 2 prochaines semaines.</div>'}</div>
  <div class="card"><h2>📝 Pense-bête</h2><textarea placeholder="Une idée, un truc à ne pas oublier…" oninput="st.memo=this.value;save()">${esc(st.memo)}</textarea></div>`;
},
menage(){
  const all=st.tasks,dn=all.filter(isDone).length,ti=todayI();
  const cnt=i=>{const l=all.filter(t=>t.day===i);return l.length?l.filter(isDone).length+'/'+l.length:''};
  const list=dayF===8?all:all.filter(t=>t.day===dayF);
  const sorted=[...list].sort((a,b)=>isDone(a)-isDone(b));
  return `<div class="card"><h2>✨ Ma semaine<small>${dn}/${all.length} faites</small></h2><div class="bar"><i style="width:${all.length?dn/all.length*100:0}%"></i></div></div>
  <div class="chips">${[...DAYS.map(d=>d.slice(0,3)),'🗓️ Semaine','Tout'].map((d,i)=>`<button class="chip ${i===dayF?'on':''}" onclick="dayF=${i};render()">${i===ti?'⭐ ':''}${d}${i<8&&cnt(i)?`<span class="n">${cnt(i)}</span>`:''}</button>`).join('')}</div>
  <div class="card">
    <h2>${dayF<7?(dayF===ti?'Aujourd\'hui · ':'')+DAYS[dayF]:dayF===7?'🗓️ N\'importe quand cette semaine':'Toutes les tâches'}</h2>
    ${sorted.length?sorted.map(t=>dayF===8?taskRow(t).replace('</span></div>',` <span class="rep">· ${t.day<7?DAYS[t.day]:'Semaine'}</span></span></div>`):taskRow(t)).join(''):`<div class="empty"><b>🌷</b>Aucune tâche ici.<br>Appuie sur <b style="display:inline;font-size:inherit;color:var(--pri)">+</b> pour en ajouter une.</div>`}
  </div>
  <p class="mut" style="text-align:center">Les tâches 🔁 repartent à zéro chaque lundi.<br>Appuie sur le nom d'une tâche pour la modifier.</p>`;
},
courses(){
  const left=st.shop.filter(i=>!i.done),got=st.shop.filter(i=>i.done);
  const inList=new Set(left.map(i=>i.t.toLowerCase()));
  const fav=Object.entries(st.hist).filter(([k])=>!inList.has(k)).sort((a,b)=>b[1]-a[1]).slice(0,14).map(x=>x[0]);
  const row=i=>`<div class="item ${i.done?'done':''}"><button class="ck" onclick="toggleItem('${i.id}')">✓</button><span class="t" onclick="toggleItem('${i.id}')">${esc(i.t)}</span><button class="x" onclick="changeCat('${i.id}')" aria-label="Rayon">${CATS[i.c][1]}</button><button class="x" onclick="delItem('${i.id}')" aria-label="Supprimer">✕</button></div>`;
  let groups='';
  CATS.forEach((c,ci)=>{const l=left.filter(i=>i.c===ci);if(l.length)groups+=`<div class="cat">${c[1]} ${c[0]}</div>${l.map(row).join('')}`});
  return `<div class="card"><div class="addrow"><input id="ni" placeholder="Ajouter un article…" enterkeyhint="done" onkeydown="if(event.key==='Enter')addItem(this.value)"><button onclick="addItem($('#ni').value)">+</button></div>
    ${fav.length?`<div class="lbl">Souvent acheté</div><div class="chips">${fav.map(f=>`<button class="chip" onclick="addItem(this.dataset.n)" data-n="${esc(f)}">+ ${esc(f)}</button>`).join('')}</div>`:''}</div>
  <div class="card"><h2>🛒 À acheter<small>${left.length} article${left.length>1?'s':''}</small></h2>
    ${left.length?groups:'<div class="empty"><b>🧺</b>La liste est vide.</div>'}</div>
  ${got.length?`<div class="card"><h2>✅ Dans le caddie<small class="link" onclick="clearTaken()">Retirer</small></h2>${got.map(row).join('')}</div>`:''}
  <div class="row"><button class="btn soft" onclick="shareList()">📤 Envoyer la liste</button></div>`;
},
repas(){
  const ti=todayI();
  return `<p class="mut" style="margin:6px 4px">Prévois les repas de la semaine. Le 🎲 te donne une idée si tu manques d'inspiration.</p>
  ${DAYS.map((d,i)=>{const m=st.meals[i]||{};return `<div class="card ${i===ti?'today':''}"><h2>${i===ti?'⭐ ':''}${d}</h2>
  ${['m','s'].map(k=>`<div class="meal"><span class="lb">${k==='m'?'☀️ Midi':'🌙 Soir'}</span><input id="m${i}${k}" value="${esc(m[k]||'')}" placeholder="…" oninput="setMeal(${i},'${k}',this.value)"><button class="dice" onclick="dice(${i},'${k}')" aria-label="Idée">🎲</button></div>`).join('')}</div>`}).join('')}
  <div class="row"><button class="btn soft" onclick="mealsToShop()">🛒 Ingrédients → courses</button></div>
  <label class="tog"><input type="checkbox" ${st.mealsAuto?'checked':''} onchange="autoMeals(this)"> Vider les repas automatiquement chaque lundi</label>
  <div class="row"><button class="btn del" style="flex:1" onclick="clearMeals()">Vider la semaine</button></div>`;
},
agenda(){
  const up=upcoming();
  return `<div class="card"><h2>📅 Mes rendez-vous & dates</h2>${up.length?up.map(evRow).join(''):'<div class="empty"><b>🗓️</b>Rien de prévu.<br>Ajoute tes rendez-vous et les anniversaires avec <b style="display:inline;font-size:inherit;color:var(--pri)">+</b></div>'}</div>
  <p class="mut" style="text-align:center">Les anniversaires 🎂 reviennent chaque année tout seuls.</p>`;
}};

// ---------- Réglages / sauvegarde ----------
function settings(){
  sheet(`<h3>⚙️ Réglages</h3>
  <div class="lbl">Sauvegarde</div>
  <p class="mut">Tes données restent sur ce téléphone. Fais une sauvegarde de temps en temps pour ne rien perdre.</p>
  <div class="row"><button class="btn" onclick="backup()">💾 Sauvegarder</button><button class="btn soft" onclick="$('#file').click()">📂 Restaurer</button></div>
  <div class="lbl">Installer</div>
  <p class="mut">${installHelp()}</p>${dp?'<div class="row"><button class="btn" onclick="install()">📲 Installer Céline</button></div>':''}
  <div class="lbl">Tout recommencer</div>
  <div class="row"><button class="btn del" onclick="wipe()">🗑️ Effacer toutes les données</button></div>
  <p class="mut" style="text-align:center;margin-top:18px">Céline · version ${APPV}<br>Faite avec 💗</p>`);
}
function backup(){
  const b=new Blob([JSON.stringify(st,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='celine-sauvegarde-'+ymd(new Date())+'.json';
  document.body.appendChild(a);a.click();a.remove();toast('Sauvegarde téléchargée 💾');
}
function restore(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.tasks)throw 0;st=Object.assign(def(),s);tidy();closeSheet();render();toast('Données restaurées ✅')}catch(e){toast('Fichier non reconnu ❌')}inp.value=''};
  r.readAsText(f);
}
function wipe(){if(confirm('Effacer toutes les données de Céline ? Cette action est définitive.')){st=def();save();closeSheet();go('home');toast('Tout est remis à zéro')}}

// ---------- Installation ----------
let dp=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(tab==='home')render()});
addEventListener('appinstalled',()=>{dp=null;toast('Céline est installée 🎉');render()});
function install(){if(!dp)return;dp.prompt();dp.userChoice.finally(()=>{dp=null;closeSheet();render()})}
function installHelp(){return standalone()?'Céline est déjà installée sur ton écran d\'accueil ✅':isIOS?'Dans Safari : touche le bouton Partager ⬆️ puis « Sur l\'écran d\'accueil ».':dp?'Ajoute Céline sur ton écran d\'accueil comme une vraie application.':'Dans Chrome : menu ⋮ puis « Ajouter à l\'écran d\'accueil » ou « Installer l\'application ».'}
function installBanner(){if(standalone()||st.noBanner||(!dp&&!isIOS))return '';
  return `<div class="card" style="display:flex;gap:12px;align-items:center"><span style="font-size:30px">📲</span><div style="flex:1"><b>Installe Céline</b><div class="mut">${isIOS&&!dp?'Partager ⬆️ → « Sur l\'écran d\'accueil »':'Pour l\'ouvrir comme une vraie appli.'}</div></div>${dp?'<button class="chip on" onclick="install()">Installer</button>':''}<button class="x" onclick="st.noBanner=1;save();render()">✕</button></div>`}

// Au retour sur l'appli (le lendemain, nouvelle semaine…), tout se remet à jour.
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tidy();if(!$('#sh').classList.contains('on')&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){dayF=tab==='menage'?dayF:todayI();render()}}});

const APPV='2026-10-31.1';
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v='+APPV).catch(()=>{});
render();
</script>
</body>
</html>
