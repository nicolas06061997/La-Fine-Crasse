function fmt(n){

 if(n<1000)return (n<10&&n%1?(Math.round(n*10)/10).toString():Math.floor(n).toString()).replace('.',',');
 const u=['K','M','Md','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UD','DD','TD','QaD','QiD'];let i=-1;
 while(n>=1000&&i<u.length-1){n/=1000;i++}

}

 SPOTS.forEach((S,i)=>h+='<button data-t="'+i+'" class="'+(i===colTab?'on':'')+'">'+(i<=st.maxSpot?S.ic+' '+S.n.split(' ').pop():'🔒')+'</button>');
 h+='</div><div class="grid">';const i=colTab;
 for(let k=0;k<NF;k++){const f=ALLF[i*NF+k],c=st.caught[f.j]||0;
  if(c)h+='<div class="fc"><div class="e" style="background:'+hex(f.c)+'">'+f.e+'</div><b>'+f.n+'</b><div class="st">'+'★'.repeat((c>=10)+(c>=100)+(c>=1000))+'☆'.repeat(3-(c>=10)-(c>=100)-(c>=1000))+'</div><small>×'+fmt(c)+'<br>🏆 '+fmtKg(st.rec[f.j]||0)+'<br>'+fmt(f.v*gainMult())+' €</small></div>';
  else h+='<div class="fc lock"><div class="e">?</div><b>???</b><small>'+(i<=st.maxSpot?'Lancer à '+fmt(dist(fishLvl(i,k)))+' m':'Lieu verrouillé')+'</small></div>'}
 const B=SPOTS[i].boss,bc=st.bc[i]||0;
 h+=bc?'<div class="fc boss"><div class="e" style="background:'+hex(B.c)+'">👑</div><b>BOSS : '+B.n+'</b><small>Attrapé ×'+bc+' · 🏆 '+fmtKg(st.brec[i])+'</small></div>':'<div class="fc lock boss"><div class="e">👑</div><b>BOSS : ???</b><small>Attrape les 7 poissons pour le défier</small></div>';
 h+='</div><p><small>⭐ = 10 pêchés · ⭐⭐ = 100 · ⭐⭐⭐ = 1000. Chaque étoile : +1 % d’argent.</small></p>';
 pop(h);document.querySelectorAll('#popC .tabs button').forEach(b=>b.onclick=()=>openCol(+b.dataset.t))}
$('bCol').onclick=()=>openCol(st.spot);

// Succès
function openAch(){let h='<h2>🏆 Succès</h2><p>'+st.ach.length+' / '+ACH.length+' · +'+st.ach.length*3+' % d’argent</p>';
 ACH.slice().sort((a,b)=>(st.ach.indexOf(b.id)>=0)-(st.ach.indexOf(a.id)>=0)).forEach(a=>{const ok=st.ach.indexOf(a.id)>=0;h+='<div class="row'+(ok?' done':' lock')+'"><div class="ri">'+(ok?a.ic:'🔒')+'</div><div class="rt">'+a.n+'<small>'+a.d+'</small></div>'+(ok?'✅':'')+'</div>'});
 pop(h)}
$('bAch').onclick=openAch;

// Plus + Championnat
function openMore(){const g=cupGain();
 pop('<h2>⭐ Plus</h2>'+
 '<div class="sec"><h3>🏆 Championnat</h3><p>Tu recommences au premier étang avec ton vieux matos, mais tu gagnes des <b>coupes 🏆</b> : chacune donne <b>+10 % d’argent pour toujours</b>. Tu gardes ta collection, tes records, tes succès et ton carburant.</p>'+
 (st.ever.length<3?'<p><small>Disponible après avoir battu le boss du <b>Grand Lac</b>.</small></p>':'<p>Tu gagnerais : <b>🏆 '+g+'</b>'+(g?'':'<br><small>Gagne encore de l’argent ('+fmt(1e10)+' € pour la 1re coupe, déjà '+fmt(st.run)+' €)</small>')+'</p>')+
 '<button class="bb" id="bPres" '+(g?'':'disabled')+'>🏆 Lancer le championnat (+'+g+')</button></div>'+
 '<div class="sec"><h3>📊 Statistiques</h3><p style="text-align:left">Argent gagné en tout : <b>'+fmt(st.life)+' €</b><br>Poissons pêchés : <b>'+fmt(tot())+'</b><br>Boss vaincus : <b>'+st.bc.reduce((a,b)=>a+(b||0),0)+'</b><br>Poissons dorés : <b>'+st.gold+'</b><br>Bonus total : <b>×'+bonusMult().toFixed(2).replace('.',',')+'</b> (étoiles, succès, coupes)</p></div>'+
 '<button class="bb b" id="bSnd">'+(st.snd?'🔊 Son : activé':'🔇 Son : coupé')+'</button>'+
 '<button class="bb b" id="bUpd">🔄 Vérifier les mises à jour</button>'+
 '<button class="bb r" id="bRst">🗑️ Recommencer à zéro</button><p><small>Version '+APPV+'</small></p>');
 $('bPres').onclick=()=>{const g=cupGain();if(!g)return;if(!confirm('Lancer le championnat ? Ton argent, tes améliorations, ton matos et tes lieux repartent à zéro.'))return;
  st.cups+=g;st.m=0;st.run=0;st.lvs=[];EQ.forEach(e=>st.eq[e.k]=0);st.spot=0;st.maxSpot=0;st.beaten=[];st.bcd=[];
  applySpot();buildBoat();closePop();renderUI();save();toast('🏆 Championnat lancé ! <b>+'+g+' coupes</b>');jingle([523,659,784,1046])};
 $('bSnd').onclick=()=>{st.snd=st.snd?0:1;save();openMore()};
 $('bUpd').onclick=()=>chkUpd(true);
 $('bRst').onclick=()=>{if(confirm('Effacer toute ta partie ?')){try{localStorage.removeItem(KEY)}catch(e){}window.__rst=1;location.reload()}}}
$('bMore').onclick=openMore;

// Gains pendant l'absence
function offline(sec){const lim=fuelH(st.fuel)*3600,s=Math.min(sec,lim),g=income()*s;if(g<=0)return;earn(g);
 if(sec>=60){pop('<h2>👋 Bon retour !</h2><p>Ton pêcheur a pêché pendant <b>'+fmtH(s/3600)+'</b>'+(sec>lim?'<br><small>(il est tombé en panne d’essence après '+fmtH(lim/3600)+' : améliore le ⛽ Carburant !)</small>':'')+'</p><p style="font-family:var(--gf);font-size:30px;color:#2e7d32">+'+fmt(g)+' €</p><button class="bb" id="bOk">💰 Récupérer</button>');
  $('bOk').onclick=()=>{closePop();snd(660,.1,'triangle',.1,1320)}}save()}

// Mises à jour
let SWR=null;
function chkUpd(man){fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
 if(!j||!j.v||j.v===APPV){if(man)toast('Le jeu est à jour ✓');return}closePop();$('updn').textContent=j.notes||'';$('upd').classList.add('on')}).catch(()=>{if(man)toast('Pas de connexion')})}
$('updB').onclick=()=>{try{SWR&&SWR.update()}catch(e){}setTimeout(()=>location.reload(),300)};
if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js?v='+APPV).then(r=>{SWR=r}).catch(()=>{})});
setInterval(()=>chkUpd(false),5*60e3);setTimeout(()=>chkUpd(false),4000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(fight){fight.hold=false}save()}else chkUpd(false)});
addEventListener('pagehide',save);

function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?56:42;cam.updateProjectionMatrix()}
addEventListener('resize',resize);

// ===================== Boucle =====================
applySpot();buildBoat();resize();renderUI();
(()=>{const s=(Date.now()-(st.t||Date.now()))/1000;if(s>5)offline(s)})();
if(!st.life&&!tot())setTimeout(()=>toast('🎣 Ton pêcheur pêche tout seul !<br>Améliore-le avec les cases du bas.'),800);
let last=performance.now(),uiT=0,saveT=0,achT=1;
function step(dt){
 T+=dt;if(frenzy>0)frenzy-=dt;
 updSea(T);
 if(fixedBoat){boat.position.y=0;boat.rotation.z=0;boat.rotation.x=0}else{boat.position.y=waveY(0,0,T)-.05;boat.rotation.z=.05*Math.sin(T*1.1);boat.rotation.x=.03*Math.sin(T*.85+1)}
 if(boat.userData.flag)boat.userData.flag.rotation.y=.3*Math.sin(T*4);
 if(boat.userData.fan)boat.userData.fan.rotation.z+=dt*20;
 if(fight)updFight(dt);else updFishing(dt);
 updGold(dt);updJumps(dt);
 for(let i=fx.length-1;i>=0;i--){const e=fx[i];e.t+=dt;const k=Math.min(1,e.t/e.d);e.f(k);if(k>=1){fx.splice(i,1);e.end&&e.end()}}
 rings.forEach(r=>{if(!r.visible)return;const u=r.userData;u.t+=dt;const k=u.t/.7;r.scale.setScalar(1+k*2.5*u.b);r.material.opacity=.85*(1-k);if(k>=1)r.visible=false});
 clouds.forEach(c=>{c.position.x+=dt*1.5;if(c.position.x>170)c.position.x=-170});
 ducks.forEach(g=>{const u=g.userData;u.a+=dt*u.sp;g.position.set(u.cx+Math.cos(u.a)*u.r,waveY(g.position.x,g.position.z,T),u.cz+Math.sin(u.a)*u.r*.4);g.rotation.y=-u.a+Math.PI})
 pads.forEach(p=>p.position.y=waveY(p.position.x,p.position.z,T)+.02);
 if(mill)mill.rotation.z+=dt*.8;
 if(flies){const a=flies.geometry.attributes.position;for(let i=0;i<a.count;i++){a.setY(i,a.getY(i)+Math.sin(T*2+i)*dt*.4);a.setX(i,a.getX(i)+Math.cos(T*1.3+i*2)*dt*.3)}a.needsUpdate=true;flies.material.opacity=.6+.4*Math.sin(T*3)}
 uiT-=dt;if(uiT<=0){uiT=.2;renderUI()}
 achT-=dt;if(achT<=0){achT=1;chkAch()}
 saveT-=dt;if(saveT<=0){saveT=3;save()}
}
function loop(now){
 let dt=(now-last)/1000;last=now;
 if(dt>2){if(!fight)offline(dt);dt=0}
 step(Math.min(dt,.1));R.render(scene,cam);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body></html>
