<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pêche Paradis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--gf:'Lilita One','Nunito',system-ui,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd6f0;color:#123;font-family:'Nunito',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--gf);letter-spacing:.3px;border:0;cursor:pointer;color:inherit}
#top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:5}
.money{background:#fff;border-radius:22px;padding:4px 20px 5px;text-align:center;box-shadow:0 5px 0 rgba(0,60,90,.25);border:3px solid #ffd54f}
.money b{font-family:var(--gf);font-weight:400;font-size:32px;color:#2e7d32;line-height:1.1}
.money small{display:block;font-weight:900;font-size:13px;color:#00838f;margin-top:-2px}
#sea{margin-top:6px;font-weight:900;font-size:12px;color:#fff;background:rgba(0,60,90,.45);border-radius:999px;padding:3px 10px}
#fz{margin-top:6px;display:none;font-family:var(--gf);font-size:16px;color:#fff;background:linear-gradient(#ff8a00,#e53935);border-radius:999px;padding:3px 12px;box-shadow:0 3px 0 #9a1c1c}
.side{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:8px;z-index:6}
.side button{width:46px;height:46px;border-radius:15px;background:#fff;font-size:23px;box-shadow:0 4px 0 rgba(0,60,90,.3);padding:0}
.side button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,60,90,.3)}
#sonar{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
#sonar .sl{font-weight:900;font-size:11px;color:#fff;background:rgba(0,40,70,.55);border-radius:8px;padding:1px 6px}
#sbar{position:relative;width:24px;height:30vh;border-radius:12px;background:linear-gradient(#7fe3f5,#1976d2 45%,#0b1d4d);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,40,70,.3)}
#sline{position:absolute;left:50%;top:0;width:2px;margin-left:-1px;background:rgba(255,255,255,.85)}
#hook{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);font-size:18px;filter:drop-shadow(0 1px 1px #000)}
.zd{position:absolute;left:-9px;width:8px;height:8px;margin-top:-4px;border-radius:50%;border:2px solid #fff}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(rgba(0,60,90,0),rgba(0,60,90,.45) 40%)}
#buy{display:flex;justify-content:center;gap:6px;margin-bottom:7px}
#buy button{font-size:14px;padding:4px 14px;border-radius:999px;background:rgba(255,255,255,.75);color:#00576b;box-shadow:0 3px 0 rgba(0,40,70,.25)}
#buy button.on{background:#ffd54f;color:#5a3700}
#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:560px;margin:0 auto}
.up{position:relative;background:#fff;border-radius:18px;padding:7px 3px 6px;text-align:center;box-shadow:0 5px 0 #90a4ae;border-top:5px solid var(--c);overflow:hidden;font-family:'Nunito',system-ui,sans-serif}
.up:active{transform:translateY(3px);box-shadow:0 2px 0 #90a4ae}
.up .ic{font-size:27px;line-height:1.1}
.up .nm{font-family:var(--gf);font-size:14px;color:#263238;line-height:1.1}
.up .lv{font-size:11px;font-weight:800;color:#78909c}
.up .ef{font-size:11px;font-weight:900;color:#0277bd;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .pr{position:relative;margin-top:4px;border-radius:11px;background:#cfd8dc;color:#455a64;font-family:var(--gf);font-size:14px;padding:4px 2px;overflow:hidden}
.up .pr i{position:absolute;left:0;top:0;bottom:0;width:0;background:#a5d6a7}
.up .pr span{position:relative}
.up.ok .pr{background:linear-gradient(#66bb6a,#2e7d32);color:#fff;box-shadow:0 2px 0 #1b5e20}
.up.max .pr{background:#ffd54f;color:#5a3700}
.up.no{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%) scale(.9);z-index:30;background:#fff;color:#00576b;font-family:var(--gf);font-size:18px;padding:8px 18px;border-radius:16px;box-shadow:0 5px 0 rgba(0,40,70,.3);border:3px solid #ffd54f;opacity:0;transition:.25s;pointer-events:none;text-align:center;max-width:80vw}
#toast.on{opacity:1;transform:translateX(-50%) scale(1)}
.ft{position:fixed;z-index:4;pointer-events:none;font-family:var(--gf);font-size:20px;color:#fff;text-shadow:0 2px 0 #1b5e20,0 0 6px rgba(0,0,0,.4);transform:translate(-50%,-50%);animation:ft 1s ease-out forwards;white-space:nowrap}
.ft.big{font-size:28px;color:#ffe066;text-shadow:0 3px 0 #a35f00,0 0 8px rgba(0,0,0,.4)}
@keyframes ft{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-70px}}
#gold{position:fixed;z-index:7;display:none;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:radial-gradient(rgba(255,240,150,.9),rgba(255,215,0,.35) 55%,rgba(255,215,0,0) 70%);font-size:30px;padding:0;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.pop{position:fixed;inset:0;z-index:40;background:rgba(0,30,50,.55);display:none;align-items:center;justify-content:center;padding:16px}
.pop.on{display:flex}
.pop>div{position:relative;background:#fff;border-radius:24px;padding:16px;max-width:420px;width:100%;max-height:80vh;overflow:auto;box-shadow:0 8px 0 rgba(0,40,70,.35);border:4px solid #4fc3f7;touch-action:pan-y}
.pop h2{margin:0 0 10px;font-family:var(--gf);font-weight:400;font-size:24px;color:#0277bd;text-align:center}
.pop p{margin:8px 0;font-weight:700;color:#37474f;text-align:center}
.x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:#ef5350;color:#fff;font-size:18px;box-shadow:0 3px 0 #b71c1c}
.big-b{display:block;width:100%;margin-top:10px;padding:12px;border-radius:16px;font-size:20px;background:linear-gradient(#66bb6a,#2e7d32);color:#fff;box-shadow:0 4px 0 #1b5e20;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big-b:disabled{filter:grayscale(1);opacity:.5}
.big-b.r{background:linear-gradient(#ef5350,#c62828);box-shadow:0 4px 0 #8e1b1b;font-size:16px}
.big-b.b{background:linear-gradient(#4fc3f7,#0277bd);box-shadow:0 4px 0 #01579b;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fc{background:#e1f5fe;border-radius:14px;padding:8px 4px;text-align:center}
.fc .e{width:46px;height:46px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;font-size:26px;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.fc b{display:block;font-size:12px;font-weight:900;color:#01579b;line-height:1.1}
.fc small{display:block;font-size:11px;font-weight:700;color:#546e7a}
.fc.lock{background:#eceff1}.fc.lock .e{background:#90a4ae;color:#fff;font-family:var(--gf)}
.sec{background:#e1f5fe;border-radius:16px;padding:10px;margin:10px 0}
.sec h3{margin:0;font-family:var(--gf);font-weight:400;color:#01579b;font-size:19px}
#upd{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:60;display:none;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 12px;font-weight:900;color:#01579b;box-shadow:0 5px 0 rgba(0,40,70,.35);border:3px solid #ffd54f}
#upd.on{display:flex}#upd>div{flex:1}#upd small{display:block;font-weight:700;color:#546e7a;font-size:13px}
#upd button{padding:9px 12px;border-radius:12px;background:linear-gradient(#66bb6a,#2e7d32);color:#fff;font-size:15px}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><div class="money"><b id="money">0</b><small id="ips">+0 €/s</small></div><div id="sea"></div><div id="fz"></div></div>
<div class="side"><button id="bAq" title="Mes poissons">🐠</button><button id="bMore" title="Plus">⭐</button></div>
<div id="sonar"><div class="sl">0 m</div><div id="sbar"><div id="szones"></div><div id="sline"></div><div id="hook">🪝</div></div><div class="sl" id="smax">5 m</div></div>
<button id="gold">✨</button>
<div id="bottom"><div id="buy"><button data-b="1" class="on">×1</button><button data-b="10">×10</button><button data-b="max">MAX</button></div><div id="cards"></div></div>
<div id="toast"></div>
<div class="pop" id="pop"><div><button class="x" id="popX">✕</button><div id="popC"></div></div></div>
<div id="upd"><div>🎣 Nouvelle mise à jour disponible<small id="updn"></small></div><button id="updB">Mettre à jour</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// Version du jeu : à changer à chaque mise à jour, avec la même valeur dans version.json.
var APPV="2026-11-06.1";
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), lerp=(a,b,k)=>a+(b-a)*k, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ================= Règles =================
// Poissons : profondeur où on peut les attraper (m), valeur (€), couleur, taille, forme.
const FISH=[
 {n:'Sardine',e:'🐟',d:0,v:1,c:0x9fb8c9,s:.5},
 {n:'Maquereau',e:'🐟',d:8,v:2.5,c:0x3f7fa8,s:.6},
 {n:'Dorade',e:'🐠',d:16,v:6,c:0xf2c14e,s:.7},
 {n:'Saumon',e:'🐟',d:30,v:14,c:0xff8a65,s:.8},
 {n:'Poisson-clown',e:'🐠',d:55,v:32,c:0xff6d00,s:.6},
 {n:'Thon',e:'🐟',d:95,v:75,c:0x2c4a7a,s:1},
 {n:'Espadon',e:'🐟',d:160,v:170,c:0x5b6ee1,s:1.2},
 {n:'Requin',e:'🦈',d:270,v:400,c:0x7d8a99,s:1.5},
 {n:'Raie manta',e:'🐟',d:450,v:900,c:0x34495e,s:1.3,sh:'flat'},
 {n:'Poulpe géant',e:'🐙',d:720,v:2100,c:0xe0533a,s:1.2,sh:'squid'},
 {n:'Poisson-lanterne',e:'🐡',d:1150,v:5000,c:0x2b2b5a,s:.9},
 {n:'Calamar colossal',e:'🦑',d:1900,v:12000,c:0xd35d9a,s:1.6,sh:'squid'},
 {n:'Kraken',e:'🐙',d:3300,v:30000,c:0x7b1fa2,s:2.1,sh:'squid'},
];
const cycle=l=>2.5*Math.pow(.95,l);                      // secondes pour un poisson
const mult=l=>(1+.25*l)*Math.pow(2,Math.floor(l/10));   // ×2 tous les 10 niveaux
const depth=l=>Math.round(5*Math.pow(1.12,l));          // mètres
const fuelH=l=>.5+.5*l;                                 // heures de pêche en ton absence
const UPS=[
 {k:'spd',ic:'⚡',n:'Vitesse',c:'#fbc02d',c0:5,g:1.45,max:42,f:l=>cycle(l).toFixed(2).replace('.',',')+' s'},
 {k:'val',ic:'💰',n:'Argent',c:'#43a047',c0:8,g:1.3,max:1e9,f:l=>'×'+fmt(mult(l))},
 {k:'dep',ic:'🎣',n:'Profondeur',c:'#1e88e5',c0:10,g:1.6,max:60,f:l=>fmt(depth(l))+' m'},
 {k:'fuel',ic:'⛽',n:'Carburant',c:'#fb8c00',c0:30,g:1.65,max:23,f:l=>fmtH(fuelH(l))},
];
const cost=(u,l)=>Math.ceil(u.c0*Math.pow(u.g,l));
const TIERS=[
 {n:'Barque',min:0,s:1,hull:0x9c6430,stripe:0xd99a5b,deck:0xc08a52},
 {n:'Bateau à moteur',min:15,s:1.12,hull:0xffffff,stripe:0xe53935,deck:0xd7ccc8,cab:0xffffff,roof:0x1e88e5},
 {n:'Chalutier',min:45,s:1.25,hull:0x1565c0,stripe:0xffffff,deck:0xbcaaa4,cab:0xffffff,roof:0xe53935},
 {n:'Yacht de pêche',min:95,s:1.4,hull:0xfafafa,stripe:0xffb300,deck:0x8d6e63,cab:0xfafafa,roof:0x263238},
];
const SEAS=[
 {n:'Lagon Turquoise',top:0x2f9ef0,bot:0xc4ecff,water:0x1689b8,sun:0xfff4d6,si:1,amb:.6},
 {n:'Mer du Couchant',top:0x4a3584,bot:0xffb27a,water:0x236f9e,sun:0xffb36b,si:.95,amb:.5},
 {n:'Mer Arctique',top:0x6fa8de,bot:0xf0f7ff,water:0x3f7fa8,sun:0xffffff,si:.9,amb:.7,ice:1},
 {n:'Océan des Étoiles',top:0x070c2b,bot:0x2c3f7a,water:0x154a80,sun:0xa8bbff,si:.6,amb:.45,stars:1},
];

// ================= Sauvegarde =================
const KEY='pp_save';
let st={m:0,lv:{spd:0,val:0,dep:0,fuel:0},caught:[],pearls:0,sea:0,run:0,life:0,t:Date.now(),snd:1,buy:'1'};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){Object.assign(st,s);st.lv=Object.assign({spd:0,val:0,dep:0,fuel:0},s.lv||{})}}catch(e){}
function save(){st.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

// ================= Formules =================
function fmt(n){
 if(!isFinite(n))return '∞';
 if(n<1000)return (n<10&&n%1?(Math.round(n*10)/10).toString():Math.floor(n).toString()).replace('.',',');
 const u=['K','M','Md','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];let i=-1;
 while(n>=1000&&i<u.length-1){n/=1000;i++}
 return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n).toString()).replace('.',',')+' '+u[i];
}
function fmtH(h){const m=Math.round(h*60);return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60):'')}
function topFish(){const d=depth(st.lv.dep);let i=0;while(i+1<FISH.length&&FISH[i+1].d<=d)i++;return i}
function gainMult(){return mult(st.lv.val)*(1+.1*st.pearls)}
function avgVal(){const t=topFish();let sw=0,sv=0;for(let i=0;i<=t;i++){const w=Math.pow(2,i);sw+=w;sv+=w*FISH[i].v}return sv/sw}
function income(){return avgVal()*gainMult()/cycle(st.lv.spd)}
function pickFish(){const t=topFish();let r=Math.random()*(Math.pow(2,t+1)-1);for(let i=t;i>=0;i--){r-=Math.pow(2,i);if(r<0)return i}return 0}
function tierOf(){const s=st.lv.spd+st.lv.val+st.lv.dep;let t=0;TIERS.forEach((T,i)=>{if(s>=T.min)t=i});return t}
function pearlGain(){return Math.floor(Math.sqrt(st.run/1e5))}

// ================= Son =================
let AC=null,lastPlop=0;
function snd(f,d,type,vol,f2,delay){
 if(!st.snd)return;
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(vol||.1,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}
}
addEventListener('pointerdown',()=>{try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}},{passive:true});

// ================= Scène 3D =================
const R=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,1,.1,1200);
cam.position.set(1.2,4.2,11.5);cam.lookAt(0,1.1,0);
const hemi=new THREE.HemisphereLight(0xffffff,0x2a6f80,.8);scene.add(hemi);
const sunL=new THREE.DirectionalLight(0xffffff,1.2);sunL.position.set(30,50,25);scene.add(sunL);
scene.fog=new THREE.Fog(0xc4ecff,60,260);

const MC={};
function mat(c,o){const k=c+'|'+(o?JSON.stringify(o):'');return MC[k]||(MC[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:.65},o||{})))}
const GS=new THREE.SphereGeometry(1,10,8),GC=new THREE.ConeGeometry(1,1,4),GCy=new THREE.CylinderGeometry(1,1,1,7),GB=new THREE.BoxGeometry(1,1,1);
function mesh(g,m,x,y,z,sx,sy,sz){const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);if(sx!==undefined)o.scale.set(sx,sy===undefined?sx:sy,sz===undefined?sx:sz);return o}

// Ciel dégradé
const skyU={top:{value:new THREE.Color()},bot:{value:new THREE.Color()}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(500,24,12),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyU,
 vertexShader:'varying vec3 vp;void main(){vp=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vp;void main(){float h=clamp(vp.y*2.2,0.,1.);gl_FragColor=vec4(mix(bot,top,pow(h,.7)),1.);}'}));
scene.add(sky);
const sunM=mesh(GS,new THREE.MeshBasicMaterial({color:0xfff6c0,fog:false}),120,140,-380,22);scene.add(sunM);
// Étoiles (mer de nuit)
const stars=(()=>{const n=500,p=new Float32Array(n*3);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,e=rnd(.08,1.4);p[i*3]=Math.cos(a)*Math.cos(e)*450;p[i*3+1]=Math.sin(e)*450;p[i*3+2]=Math.sin(a)*Math.cos(e)*450}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));return new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,fog:false}))})();
scene.add(stars);

// Mer animée
function waveY(x,z,t){return .28*Math.sin(x*.22+t*1.1)+.2*Math.sin(z*.27+t*.85)+.1*Math.sin((x-z)*.45+t*1.7)}
const seaG=new THREE.PlaneGeometry(420,420,110,110);seaG.rotateX(-Math.PI/2);
const seaP=seaG.attributes.position;
const seaMat=new THREE.MeshStandardMaterial({color:0x1d9fc4,flatShading:true,roughness:.35,metalness:.1});
const sea=new THREE.Mesh(seaG,seaMat);scene.add(sea);
function updSea(t){for(let i=0;i<seaP.count;i++){const x=seaP.getX(i),z=seaP.getZ(i),d=x*x+z*z;seaP.setY(i,d>22000?0:waveY(x,z,t))}seaP.needsUpdate=true}

// Décor : îles, phare, montagnes, nuages, mouettes, icebergs
function palm(x,z,h,rot){const g=new THREE.Group();g.position.set(x,0,z);
 const tr=mesh(GCy,mat(0x8d6e63),0,h/2,0,.22,h,.22);tr.rotation.z=.12;g.add(tr);
 for(let i=0;i<6;i++){const l=mesh(GB,mat(0x43a047),0,0,0,2.6,.08,.7);const p=new THREE.Group();p.position.set(h*.06,h,0);p.rotation.y=i*Math.PI/3+(rot||0);l.position.x=1.1;l.rotation.z=-.35;p.add(l);g.add(p)}
 g.add(mesh(GS,mat(0x6d4c41),h*.06+.25,h-.25,.15,.22));g.add(mesh(GS,mat(0x6d4c41),h*.06-.1,h-.3,-.2,.22));return g}
const deco=new THREE.Group();scene.add(deco);
const sandM=mat(0xf3d99b);
(()=>{const isl=new THREE.Group();isl.position.set(-16,0,-64);

$('popX').onclick=closePop;$('pop').addEventListener('click',e=>{if(e.target.id==='pop')closePop()});
const hex=c=>'#'+c.toString(16).padStart(6,'0');
$('bAq').onclick=()=>{const d=depth(st.lv.dep);let n=0,h='<div class="grid">';
 FISH.forEach((f,i)=>{const c=st.caught[i]||0;if(c){n++;h+='<div class="fc"><div class="e" style="background:'+hex(f.c)+'">'+f.e+'</div><b>'+f.n+'</b><small>'+fmt(f.v*gainMult())+' € · ×'+fmt(c)+'</small></div>'}
  else h+='<div class="fc lock"><div class="e">?</div><b>???</b><small>'+(f.d<=d?'Bientôt…':'à '+fmt(f.d)+' m')+'</small></div>'});
 pop('<h2>🐠 Mes poissons</h2><p>'+n+' / '+FISH.length+' espèces pêchées</p>'+h+'</div>')};
$('bMore').onclick=openMore;
function openMore(){const g=pearlGain(),nx=SEAS[(st.sea+1)%SEAS.length].n;
 pop('<h2>⭐ Plus</h2>'+
 '<div class="sec"><h3>🌊 Nouvelle mer</h3><p>Pars vers <b>'+nx+'</b> : tu recommences avec une barque, mais tu gagnes des <b>perles 🦪</b>. Chaque perle donne <b>+10 % d’argent pour toujours</b>. Tes poissons pêchés et ton carburant sont gardés.</p>'+
 '<p>Tu gagnerais : <b>🦪 '+g+'</b>'+(g?'':'<br><small>Gagne '+fmt(1e5)+' € dans cette mer pour ta 1re perle (déjà '+fmt(st.run)+' €)</small>')+'</p>'+
 '<button class="big-b" id="bPres" '+(g?'':'disabled')+'>🌊 Partir (+'+g+' 🦪)</button></div>'+
 '<div class="sec"><h3>🏆 Statistiques</h3><p style="text-align:left">Bateau : <b>'+TIERS[tierOf()].n+'</b><br>Argent gagné en tout : <b>'+fmt(st.life)+' €</b><br>Poissons pêchés : <b>'+fmt(st.caught.reduce((a,b)=>a+(b||0),0))+'</b><br>Perles : <b>🦪 '+st.pearls+'</b> (+'+st.pearls*10+' %)</p></div>'+
 '<button class="big-b b" id="bSnd">'+(st.snd?'🔊 Son : activé':'🔇 Son : coupé')+'</button>'+
 '<button class="big-b b" id="bUpd">🔄 Vérifier les mises à jour</button>'+
 '<button class="big-b r" id="bRst">🗑️ Recommencer à zéro</button><p><small>Version '+APPV+'</small></p>');
 $('bPres').onclick=()=>{if(!pearlGain())return;if(!confirm('Partir vers '+nx+' ? Ton bateau et tes améliorations repartent à zéro.'))return;
  st.pearls+=pearlGain();st.sea++;st.m=0;st.run=0;st.lv.spd=st.lv.val=st.lv.dep=0;applySea();buildBoat(tierOf());closePop();renderUI();save();toast('🌊 Bienvenue dans <b>'+SEAS[st.sea%SEAS.length].n+'</b> !')};
 $('bSnd').onclick=()=>{st.snd=st.snd?0:1;save();openMore()};
 $('bUpd').onclick=()=>chkUpd(true);
 $('bRst').onclick=()=>{if(confirm('Effacer toute ta partie ?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}}}

// Gains pendant l'absence
function offline(sec){const lim=fuelH(st.lv.fuel)*3600,s=Math.min(sec,lim),g=income()*s;if(g<=0)return;
 st.m+=g;st.run+=g;st.life+=g;
 if(sec>=60){pop('<h2>👋 Bon retour !</h2><p>Ton bateau a pêché pendant <b>'+fmtH(s/3600)+'</b>'+(sec>lim?'<br><small>(il est tombé en panne d’essence après '+fmtH(lim/3600)+' : améliore le ⛽ Carburant !)</small>':'')+'</p><p style="font-family:var(--gf);font-size:30px;color:#2e7d32">+'+fmt(g)+' €</p><button class="big-b" id="bOk">💰 Récupérer</button>');
  $('bOk').onclick=()=>{closePop();snd(660,.1,'triangle',.1,1320)}}save()}

// Mises à jour
let SWR=null;
function chkUpd(man){fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
 if(!j||!j.v||j.v===APPV){if(man)toast('Le jeu est à jour ✓');return}closePop();$('updn').textContent=j.notes||'';$('upd').classList.add('on')}).catch(()=>{if(man)toast('Pas de connexion')})}
$('updB').onclick=()=>{try{SWR&&SWR.update()}catch(e){}setTimeout(()=>location.reload(),300)};
if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js?v='+APPV).then(r=>{SWR=r}).catch(()=>{})});
setInterval(()=>chkUpd(false),5*60e3);setTimeout(()=>chkUpd(false),4000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else chkUpd(false)});
addEventListener('pagehide',save);

// Taille de l'écran : le bateau reste visible au-dessus des cases du bas
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?56:42;cam.updateProjectionMatrix()}
addEventListener('resize',resize);

// ================= Boucle =================
applySea();buildBoat(tierOf());resize();renderUI();
(()=>{const s=(Date.now()-(st.t||Date.now()))/1000;if(s>5)offline(s)})();
let last=performance.now(),uiT=0,saveT=0;
function step(dt){
 T+=dt;if(frenzy>0)frenzy-=dt;
 updSea(T);
 const s=bScale;boat.position.y=waveY(0,0,T)-.05;boat.rotation.z=.06*Math.sin(T*1.1);boat.rotation.x=.04*Math.sin(T*.85+1);
 if(boat.userData.flag)boat.userData.flag.rotation.y=.3*Math.sin(T*4);
 updFishing(dt);updGold(dt);updJumps(dt);
 for(let i=fx.length-1;i>=0;i--){const e=fx[i];e.t+=dt;const k=Math.min(1,e.t/e.d);e.f(k);if(k>=1){fx.splice(i,1);e.end&&e.end()}}
 rings.forEach(r=>{if(!r.visible)return;const u=r.userData;u.t+=dt;const k=u.t/.7;r.scale.setScalar(1+k*2.5*u.b);r.material.opacity=.85*(1-k);if(k>=1)r.visible=false});
 clouds.forEach(c=>{c.position.x+=dt*1.5;if(c.position.x>170)c.position.x=-170});
 gulls.forEach(g=>{const u=g.userData;u.a+=dt*u.sp;g.position.set(Math.cos(u.a)*u.r,u.h+Math.sin(u.a*2),Math.sin(u.a)*u.r-6);g.rotation.y=-u.a;const fl=.5*Math.sin(T*6+u.a*5);u.p1.rotation.z=fl;u.p2.rotation.z=-fl});
 uiT-=dt;if(uiT<=0){uiT=.2;renderUI()}
 saveT-=dt;if(saveT<=0){saveT=3;save()}
}
function loop(now){
 let dt=(now-last)/1000;last=now;
 if(dt>2){offline(dt);dt=0}
 step(Math.min(dt,.1));R.render(scene,cam);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body></html>
